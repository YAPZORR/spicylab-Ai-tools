<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --page:#ece7fb;
  --page-ink:#2e2160;
  --page-muted:#65589a;
  --page-btn:#ffffff;
  --page-btn-line:rgba(76,52,170,.2);
  --blob-1:rgba(168,85,247,.32);
  --blob-2:rgba(236,72,153,.24);
  --blob-3:rgba(61,220,255,.2);

  --line:rgba(160,142,255,.2);
  --line-strong:rgba(180,160,255,.38);
  --text:#f7f4ff;
  --muted:#aba3d8;
  --dim:#8d86bb;
  --violet:#8b5cf6;
  --purple:#a855f7;
  --magenta:#d946ef;
  --pink:#ec4899;
  --hot:#f25fc0;
  --cyan:#3ddcff;
  --gold:#fbbf24;
  --gold-soft:#fde68a;

  --display:'Unbounded','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#07061a;--page-ink:#e9e4ff;--page-muted:#9990c6;
    --page-btn:rgba(255,255,255,.06);--page-btn-line:rgba(170,150,255,.24);
    --blob-1:rgba(124,58,237,.34);--blob-2:rgba(219,39,119,.2);--blob-3:rgba(34,211,238,.1);
  }
}
:root[data-theme="dark"]{
  --page:#07061a;--page-ink:#e9e4ff;--page-muted:#9990c6;
  --page-btn:rgba(255,255,255,.06);--page-btn-line:rgba(170,150,255,.24);
  --blob-1:rgba(124,58,237,.34);--blob-2:rgba(219,39,119,.2);--blob-3:rgba(34,211,238,.1);
}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  background:var(--page);color:var(--page-ink);
  font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit}
:where(button,a):focus-visible{outline:2px solid #f0abfc;outline-offset:3px}

.defs{position:absolute;width:0;height:0;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.b1{width:420px;height:420px;background:var(--blob-1);top:-140px;left:-120px}
.b2{width:380px;height:380px;background:var(--blob-2);bottom:-150px;right:-100px}
.b3{width:280px;height:280px;background:var(--blob-3);top:38%;left:62%}

.stage{
  position:relative;z-index:1;flex:1 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:28px 16px 36px;
}

/* ---------- Modal ---------- */
.modal{
  position:relative;width:min(420px,100%);
  border-radius:30px;padding:18px 18px 14px;color:var(--text);
  background:
    radial-gradient(90% 40% at 50% -8%, rgba(168,85,247,.42), transparent 62%),
    radial-gradient(60% 35% at 108% 100%, rgba(236,72,153,.18), transparent 70%),
    linear-gradient(180deg,#171142 0%,#110d33 55%,#0e0a2b 100%);
  border:1px solid var(--line-strong);
  box-shadow:0 40px 90px -30px rgba(60,20,140,.75),0 0 70px -20px rgba(217,70,239,.45),inset 0 1px 0 rgba(255,255,255,.08);
  isolation:isolate;
  animation:modalIn .55s cubic-bezier(.2,.9,.3,1.12) both;
}
.modal[hidden]{display:none}
.modal.closing{animation:modalOut .26s ease-in both}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
.bg-spark{position:absolute;color:#fff;opacity:.5;pointer-events:none}

.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between}
.balance{
  display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;
  background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.28);
  font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-soft);font-variant-numeric:tabular-nums;
}
.balance svg{width:24px;height:24px;display:block}
.balance.bump{animation:bump .32s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
.close{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:background .2s,color .2s;
}
.close:hover{background:rgba(255,255,255,.1);color:var(--text)}
.close svg{width:16px;height:16px}

.hero{text-align:center;margin-top:6px}
.hero h1{
  font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,30px);line-height:1.1;letter-spacing:-.02em;
  margin:0 0 8px;text-shadow:0 0 28px rgba(217,70,239,.35);
}
.hero p{margin:0 auto;max-width:32ch;min-height:3em;font-size:14px;line-height:1.5;color:var(--muted)}

/* ---------- Pass ---------- */
.pass{
  position:relative;margin-top:14px;padding:1.5px;border-radius:24px;
  background:linear-gradient(125deg,var(--cyan) 0%,#7d6bff 38%,var(--magenta) 72%,var(--pink) 100%);
  box-shadow:0 0 26px -6px rgba(125,107,255,.6),0 0 40px -14px rgba(61,220,255,.5);
}
.pass.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-5px) rotate(-.5deg)}40%,60%{transform:translateX(5px) rotate(.5deg)}
}
.pass-inner{position:relative;border-radius:22.5px;background:linear-gradient(180deg,#1d1655 0%,#16114a 100%);padding-bottom:10px}
.pass-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 4px}
.streak{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px}
.streak svg{width:22px;height:22px;transform-origin:50% 90%;transform:scale(calc(1 + var(--s,0) * .07));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.streak b{font-family:var(--display);font-weight:700}
.count{
  font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);
}
.perf{position:relative;height:20px}
.perf::before{content:"";position:absolute;left:20px;right:20px;top:50%;border-top:2px dashed rgba(170,150,255,.28)}
.notch{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:1.5px solid;background:#150f3c}
.notch.l{left:-12.5px;border-color:#51b9ff;clip-path:inset(0 0 0 50%)}
.notch.r{right:-12.5px;border-color:#c74df2;clip-path:inset(0 50% 0 0)}

/* ---------- Trail map ---------- */
.map{position:relative;aspect-ratio:360 / 350;margin:0 6px;container-type:inline-size}
.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trail .base{fill:none;stroke:rgba(170,150,255,.34);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 9}
.trail .lit{fill:none;stroke:url(#gTrail);stroke-width:5;stroke-linecap:round}

.stop{
  position:absolute;width:14.5%;aspect-ratio:1;translate:-50% -50%;
  display:grid;place-items:center;padding:0;border-radius:50%;
  border:1.5px solid var(--line-strong);
  background:radial-gradient(circle at 35% 30%,#2b2170,#18124a 75%);
  box-shadow:0 8px 16px -8px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);
  color:var(--dim);cursor:pointer;z-index:2;
  transition:scale .35s cubic-bezier(.3,1.6,.5,1),background .3s,border-color .3s;
}
.stop > *{grid-area:1 / 1}
.stop .num{font-family:var(--display);font-weight:700;font-size:16px;font-size:4.8cqw}
.stop .coin-i,.stop .chk{display:none}
.stop .coin-i{width:68%;height:68%}
.stop .chk{width:46%;height:46%;color:#fff}
.stop .amt{
  position:absolute;left:50%;bottom:-20%;translate:-50% 0;padding:1px 7px;border-radius:999px;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:10px;font-size:3cqw;color:var(--gold-soft);
  background:#1a1446;border:1px solid rgba(251,191,36,.35);
}
.stop.is-today{
  scale:1.14;border:2px solid var(--hot);
  background:radial-gradient(circle at 35% 30%,#45289a,#27195f 75%);
  animation:ping 2.2s ease-in-out infinite;
}
@keyframes ping{
  0%,100%{box-shadow:0 0 0 0 rgba(242,95,192,.5),0 10px 24px -8px rgba(236,72,153,.7)}
  60%{box-shadow:0 0 0 9px rgba(242,95,192,0),0 10px 28px -6px rgba(236,72,153,.9)}
}
.stop.is-today .num{display:none}
.stop.is-today .coin-i{display:block;animation:coinBob 1.4s ease-in-out infinite}
@keyframes coinBob{50%{transform:translateY(-8%) rotate(-8deg)}}
.stop.is-today .amt{color:#fff;background:linear-gradient(90deg,var(--purple),var(--pink));border-color:transparent}
.stop.is-claimed{
  border-color:transparent;background:linear-gradient(140deg,var(--hot),var(--purple));
  box-shadow:0 8px 18px -8px rgba(236,72,153,.8),inset 0 1px 0 rgba(255,255,255,.3);
}
.stop.is-claimed .num,.stop.is-claimed .amt{display:none}
.stop.is-claimed .chk{display:block}
.stop.just-claimed{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.stop.boop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1.2)}35%{transform:scale(1.38) rotate(-8deg)}100%{transform:none}}
.stop.nope{animation:nope .4s ease-in-out}
@keyframes nope{25%{transform:translateX(-9%) rotate(-7deg)}75%{transform:translateX(9%) rotate(7deg)}}

/* chest */
.chest-spot{
  position:absolute;width:24%;aspect-ratio:64 / 58;translate:-50% -50%;
  display:grid;place-items:center;padding:0;border:0;background:none;color:inherit;cursor:pointer;z-index:2;
}
.chest-spot > *{grid-area:1 / 1}
.rays{
  position:relative;width:150%;aspect-ratio:1;align-self:center;justify-self:center;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(252,211,77,.55) 0deg 7deg,transparent 7deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 16%,transparent 66%);mask:radial-gradient(circle,#000 16%,transparent 66%);
  opacity:.22;transition:opacity .4s;
}
.chest-spot.is-ready .rays,.chest-spot.is-opened .rays{opacity:1;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chest{position:relative;width:100%;height:auto;overflow:visible;transform-origin:50% 90%}
.chest-spot.is-ready .chest{animation:wiggle 2.2s ease-in-out infinite}
.chest-spot.nope .chest{animation:nope .4s ease-in-out}
@keyframes wiggle{
  0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-7deg)}74%{transform:rotate(6deg)}82%{transform:rotate(-4deg)}90%{transform:rotate(2deg)}
}
.chest-lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .55s cubic-bezier(.3,1.7,.5,1)}
.chest-spot.is-opened .chest-lid{transform:translate(-3px,-9px) rotate(-16deg)}
.chest-glow{opacity:0;transition:opacity .5s}
.chest-spot.is-opened .chest-glow{opacity:.95}
.chest-info{position:absolute;left:48.5%;right:1%;top:76%}
.chest-title{font-family:var(--display);font-weight:700;font-size:15px;font-size:4.3cqw}
.chest-status{margin-top:3px;font-size:12.5px;font-size:3.6cqw;line-height:1.35;color:var(--muted)}
.chest-info.is-ready .chest-status{color:#f9a8d4;font-weight:700}
.chest-info.is-opened .chest-status{color:var(--gold-soft)}
.chest-reward{
  margin-top:7px;display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;border-radius:999px;
  background:linear-gradient(90deg,rgba(124,58,237,.6),rgba(217,70,239,.45));border:1px solid rgba(240,171,252,.35);
  font-family:var(--display);font-weight:800;font-size:13px;color:#fff;
}
.chest-reward svg{width:20px;height:20px;display:block}

/* coin buddy */
.buddy{
  position:absolute;width:12.5%;aspect-ratio:48 / 52;translate:-50% -50%;
  padding:0;border:0;background:none;cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent;
}
.buddy-body{display:block;width:100%;height:100%;transform-origin:50% 92%;animation:bob 1.8s ease-in-out infinite}
.buddy-body svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-7%)}}
.buddy.is-sleep .buddy-body{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,.95)}}
.buddy.is-happy .buddy-body{animation:hop .7s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes hop{
  0%,100%{transform:translateY(0) scale(1.06,.94)}
  15%{transform:translateY(0) scale(.96,1.05)}
  50%{transform:translateY(-24%) scale(.97,1.03)}
  85%{transform:translateY(0) scale(1.05,.95)}
}
.buddy.is-walk .buddy-body{animation:wobble .36s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.buddy.boing .buddy-body{animation:boing .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(1.2,.8)}40%{transform:translateY(-32%) scale(.9,1.12)}100%{transform:none}}

.buddy .eyes-sleep,.buddy .eyes-happy,.buddy .mouth-open{display:none}
.buddy.is-sleep .eyes-open{display:none}
.buddy.is-sleep .eyes-sleep{display:inline}
.buddy.is-happy .eyes-open,.buddy.is-walk .eyes-open,.buddy.boing .eyes-open,.buddy.boing .eyes-sleep{display:none}
.buddy.is-happy .eyes-happy,.buddy.is-walk .eyes-happy,.buddy.boing .eyes-happy{display:inline}
.buddy.is-happy .mouth-smile,.buddy.is-walk .mouth-smile,.buddy.boing .mouth-smile{display:none}
.buddy.is-happy .mouth-open,.buddy.is-walk .mouth-open,.buddy.boing .mouth-open{display:inline}

.zzz{position:absolute;right:-22%;top:-18%;width:40%;height:40%;display:none;pointer-events:none}
.buddy.is-sleep .zzz{display:block}
.buddy.boing .zzz{display:none}
.zzz i{
  position:absolute;left:0;bottom:0;font-style:normal;font-family:var(--display);font-weight:700;color:#c4b5fd;
  opacity:0;animation:zz 2.4s linear infinite;font-size:12px;
}
.zzz i:nth-child(2){animation-delay:.8s;font-size:10px}
.zzz i:nth-child(3){animation-delay:1.6s;font-size:8px}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(12px,-20px)}}

/* ---------- CTA ---------- */
.cta{
  position:relative;margin-top:16px;width:100%;min-height:56px;
  display:flex;align-items:center;justify-content:center;gap:12px;padding:0 18px;
  border:0;border-radius:18px;cursor:pointer;
  font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 1px rgba(100,0,50,.35);
  background:linear-gradient(90deg,#d9409c 0%,#c42d7d 100%);
  box-shadow:0 14px 30px -12px rgba(236,72,153,.85),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(120,10,70,.35);
  transition:transform .15s,filter .2s,background .3s;
}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta:active{transform:translateY(1px) scale(.99)}
.cta.is-mega{background:linear-gradient(90deg,#7c3aed 0%,#b026c9 55%,#c42d7d 100%)}
.cta-main{display:inline-flex;align-items:center;gap:8px}
.cta-ico{width:18px;height:18px;flex:none}
.cta-chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 3px;border-radius:999px;
  background:rgba(70,5,50,.3);font-family:var(--display);font-size:13px;font-weight:700;
}
.cta-chip svg{width:20px;height:20px;display:block}
.cta.is-done{
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);
  color:var(--muted);text-shadow:none;cursor:default;font-weight:600;font-size:14.5px;
}
.cta.is-done:hover{filter:none;transform:none}
.cta.is-done .cta-chip{display:none}
.cta.is-done .cta-ico{color:#f0abfc}
.cta .time{font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}
.cta.nudge{animation:nudge .45s ease-in-out}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.more{
  display:flex;align-items:center;justify-content:center;gap:7px;width:max-content;
  margin:10px auto 0;padding:9px 12px;border-radius:12px;
  color:#c9b3ff;font-size:14px;font-weight:600;text-decoration:none;
}
.more:hover{color:#f5d0fe;background:rgba(255,255,255,.04)}
.more svg{width:18px;height:18px;display:block}

.toast{
  position:absolute;left:50%;bottom:10px;z-index:6;
  display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;
  background:rgba(22,15,60,.96);border:1px solid rgba(240,171,252,.4);
  box-shadow:0 10px 30px -8px rgba(0,0,0,.6),0 0 24px -6px rgba(236,72,153,.5);
  font-weight:700;font-size:13.5px;white-space:nowrap;
  opacity:0;transform:translate(-50%,14px);pointer-events:none;
  transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:22px;height:22px;display:block}

.fly{position:fixed;left:0;top:0;width:22px;height:22px;z-index:60;pointer-events:none;will-change:transform;filter:drop-shadow(0 3px 6px rgba(251,191,36,.55))}
.fly svg{width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}

.reopen{
  display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border:0;border-radius:16px;cursor:pointer;
  font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,#8b5cf6,#c42d7d);
  box-shadow:0 14px 30px -12px rgba(168,85,247,.8);
}
.reopen[hidden]{display:none}
.reopen svg{width:22px;height:22px}
.proto{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--page-muted)}
.proto button{
  font-weight:600;font-size:12.5px;color:var(--page-ink);cursor:pointer;min-height:36px;padding:0 14px;
  background:var(--page-btn);border:1px solid var(--page-btn-line);border-radius:999px;
}
.proto button:hover{border-color:var(--pink)}

@media (max-width:360px){
  .modal{padding:16px 12px 12px;border-radius:26px}
  .pass-head{padding:12px 10px 2px}
  .map{margin:0 2px}
  .cta{font-size:16px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gCoinEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#e38a06"/></linearGradient>
    <radialGradient id="gCoinFace" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff4b8"/><stop offset=".55" stop-color="#fcc93c"/><stop offset="1" stop-color="#f09a0c"/></radialGradient>
    <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ec4899"/><stop offset=".6" stop-color="#fb923c"/><stop offset="1" stop-color="#fde047"/></linearGradient>
    <linearGradient id="gChestBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="gChestLid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="lidClip"><path d="M8 35V25C8 16 14 11 22 11H58C66 11 72 16 72 25V35Z"/></clipPath>
  </defs>

<script>
(() => {
  const REWARDS = [5, 5, 5, 5, 5, 5, 10];
  const START_BALANCE = 120;
  const KEY = 'daily-checkin-proto-v1';
  const VB_W = 360, VB_H = 350;
  const STOPS = [[48, 76], [176, 64], [306, 84], [292, 196], [172, 182], [56, 206], [112, 300]];
  const LIFT = [44, 44, 44, 44, 44, 44, 58];   // how high the buddy stands above each stop
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);

  let state = { claimed: 0, todayClaimed: false, balance: START_BALANCE };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Number.isInteger(saved.claimed) && saved.claimed >= 0 && saved.claimed <= 7) {
      state = { claimed: saved.claimed, todayClaimed: !!saved.todayClaimed,
        balance: Number.isFinite(saved.balance) ? saved.balance : START_BALANCE };
    }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const modal = $('#modal'), pass = $('#pass'), cta = $('#cta'), map = $('#map');
  const buddy = $('#buddy'), chestSpot = $('#chestSpot'), chestInfo = $('#chestInfo');
  const balanceEl = $('#balance'), balanceNum = $('#balanceNum');
  const litSegs = [...document.querySelectorAll('#trail .lit')];
  litSegs.forEach((p) => {
    p._L = p.getTotalLength();
    p.style.strokeDasharray = p._L + ' ' + p._L;
    p.style.strokeDashoffset = p._L;
  });

  const pct = (x, y) => [(x / VB_W * 100) + '%', (y / VB_H * 100) + '%'];
  chestSpot.style.left = pct(...STOPS[6])[0];
  chestSpot.style.top = pct(...STOPS[6])[1];

  // Stops for days 1–6
  const stops = [];
  for (let i = 0; i < 6; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'stop';
    const [l, t] = pct(...STOPS[i]);
    b.style.left = l; b.style.top = t;
    b.innerHTML =
      '<span class="num">' + (i + 1) + '</span>' +
      '<svg class="coin-i" aria-hidden="true"><use href="#coin"/></svg>' +
      '<svg class="chk" aria-hidden="true"><use href="#check"/></svg>' +
      '<span class="amt">+' + REWARDS[i] + '</span>';
    b.addEventListener('click', () => onStop(i));
    map.insertBefore(b, buddy);
    stops.push(b);
  }

  const availableIndex = () => (state.todayClaimed || state.claimed >= 7) ? -1 : state.claimed;
  const daysUntil = (i) => i - state.claimed + (state.todayClaimed ? 1 : 0);

  function untilMidnight() {
    const now = new Date(), mid = new Date(now); mid.setHours(24, 0, 0, 0);
    let s = Math.max(0, Math.floor((mid - now) / 1000));
    const h = String(Math.floor(s / 3600)).padStart(2, '0'); s %= 3600;
    return h + ':' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function subText() {
    const c = state.claimed, t = state.todayClaimed;
    if (c >= 7) return 'Week complete! You collected 40 coins. A new trail starts at midnight.';
    if (t) return c === 6 ? 'The Mega chest is one sleep away. Come back tomorrow to open it.'
                          : 'Coins collected for today. Day ' + (c + 1) + ' unlocks at midnight.';
    if (c === 6) return 'Day 7 is here! Open the Mega chest for 10 coins.';
    if (c === 0) return 'Check in each day to move along the trail. Day 7 opens the Mega chest.';
    return 'Your coin buddy is awake. Check in to collect today\u2019s 5 coins.';
  }

  /* ---------- Buddy ---------- */
  function placeBuddy(x, y) { const [l, t] = pct(x, y); buddy.style.left = l; buddy.style.top = t; }
  function buddyAt(i) { placeBuddy(STOPS[i][0], STOPS[i][1] - LIFT[i]); }
  function setBuddy(mode) {
    buddy.classList.remove('is-awake', 'is-sleep', 'is-happy', 'is-walk');
    buddy.classList.add('is-' + mode);
  }
  function buddyMode() {
    if (state.claimed >= 7) return 'happy';
    if (state.todayClaimed) return 'sleep';
    if (state.claimed === 6) return 'happy';
    return 'awake';
  }
  function boing() {
    buddy.classList.remove('boing'); void buddy.offsetWidth; buddy.classList.add('boing');
    clearTimeout(boing._t); boing._t = setTimeout(() => buddy.classList.remove('boing'), 620);
  }
  function retrigger(el, cls, ms) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms);
  }

  /* ---------- Render ---------- */
  let walking = false;
  function renderCta() {
    const idx = availableIndex(), done = idx === -1;
    cta.classList.toggle('is-done', done);
    cta.classList.toggle('is-mega', idx === 6);
    cta.setAttribute('aria-disabled', String(done));
    $('#ctaUse').setAttribute('href', done ? '#check' : '#star');
    if (done) {
      const lead = state.claimed >= 7 ? 'Week complete. New week in ' : 'Checked in. Next reward in ';
      $('#ctaText').innerHTML = lead + '<span class="time">' + untilMidnight() + '</span>';
    } else {
      $('#ctaText').textContent = idx === 6 ? 'Open the Mega chest' : 'Check in now';
      $('#ctaAmt').textContent = '+' + REWARDS[idx];
    }
  }

  function render() {
    const c = state.claimed, idx = availableIndex();
    $('#streakNum').textContent = c;
    $('#streak').style.setProperty('--s', c);
    $('#countText').textContent = c + ' of 7 days';
    $('#sub').textContent = subText();
    balanceNum.textContent = state.balance.toLocaleString();

    stops.forEach((s, i) => {
      const claimed = i < c, today = i === idx;
      s.classList.toggle('is-claimed', claimed);
      s.classList.toggle('is-today', today);
      s.setAttribute('aria-label', 'Day ' + (i + 1) + ', ' + REWARDS[i] + ' coins, ' +
        (claimed ? 'collected' : today ? 'ready to collect' : 'locked'));
    });

    if (!walking) {
      litSegs.forEach((p, i) => { p.style.strokeDashoffset = i < Math.min(c, 6) ? 0 : p._L; });
      buddyAt(Math.min(c, 6));
      setBuddy(buddyMode());
    }

    const ready = idx === 6, opened = c >= 7;
    [chestSpot, chestInfo].forEach((el) => {
      el.classList.toggle('is-ready', ready);
      el.classList.toggle('is-opened', opened);
    });
    const d = daysUntil(6);
    const status = opened ? 'Opened! +10 coins collected' : ready ? 'Ready to open!'
      : d === 1 ? 'Opens tomorrow' : 'Opens in ' + d + ' days';
    $('#chestStatus').textContent = status;
    chestSpot.setAttribute('aria-label', 'Mega chest, 10 coins. ' + status);

    renderCta();
  }

  /* ---------- Effects ---------- */
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let parts = [], raf = 0, W = 0, H = 0;
  function sizeCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);
  const COLORS = ['#f25fc0', '#d946ef', '#a855f7', '#8b5cf6', '#3ddcff', '#fbbf24', '#fde68a'];
  function burst(x, y, n, power) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 7) * power, r = Math.random();
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (3 + Math.random() * 4) * power,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
        c: COLORS[(Math.random() * COLORS.length) | 0], kind: r < 0.18 ? 'dot' : r < 0.32 ? 'spark' : 'rect',
        t: 0, life: 60 + Math.random() * 50 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function drawSpark(r) {
    ctx.beginPath(); ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * .15, -r * .15, r, 0); ctx.quadraticCurveTo(r * .15, r * .15, 0, r);
    ctx.quadraticCurveTo(-r * .15, r * .15, -r, 0); ctx.quadraticCurveTo(-r * .15, -r * .15, 0, -r);
    ctx.fill();
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const q of parts) {
      q.t++; q.vy += 0.22; q.vx *= 0.985; q.vy *= 0.985; q.x += q.vx; q.y += q.vy; q.rot += q.vr;
      ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      if (q.kind === 'dot') { ctx.beginPath(); ctx.arc(0, 0, q.w / 2.2, 0, 6.283); ctx.fill(); }
      else if (q.kind === 'spark') drawSpark(q.w * 1.1);
      else ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    parts = parts.filter((q) => q.t < q.life && q.y < H + 40);
    if (parts.length) raf = requestAnimationFrame(tick); else { raf = 0; ctx.clearRect(0, 0, W, H); }
  }
  function flyCoins(fromEl, toEl, count, onArrive) {
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + 16, y1 = b.top + b.height / 2;
    for (let k = 0; k < count; k++) {
      const el = document.createElement('div');
      el.className = 'fly';
      el.innerHTML = '<svg aria-hidden="true"><use href="#coin"/></svg>';
      document.body.appendChild(el);
      const jx = (Math.random() - .5) * 60, jy = (Math.random() - .5) * 30 - 10;
      const mx = (x0 + x1) / 2 + (Math.random() - .5) * 90, my = Math.min(y0, y1) - 50 - Math.random() * 50;
      const anim = el.animate([
        { transform: `translate(${x0 - 11}px,${y0 - 11}px) scale(.4)`, opacity: 0 },
        { transform: `translate(${x0 - 11 + jx}px,${y0 - 11 + jy}px) scale(1.15)`, opacity: 1, offset: .2 },
        { transform: `translate(${mx - 11}px,${my - 11}px) scale(1)`, opacity: 1, offset: .6 },
        { transform: `translate(${x1 - 11}px,${y1 - 11}px) scale(.55)`, opacity: .9 }
      ], { duration: 900 + Math.random() * 150, delay: k * 70, easing: 'cubic-bezier(.45,.05,.4,1)', fill: 'both' });
      anim.onfinish = () => { el.remove(); onArrive(); };
    }
  }
  function bump() { retrigger(balanceEl, 'bump', 340); }
  function countTo(from, to, dur) {
    const t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      balanceNum.textContent = Math.round(from + (to - from) * e).toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  const toastEl = $('#toast');
  let toastTimer = 0;
  function toast(text) {
    toastEl.innerHTML = '<svg aria-hidden="true"><use href="#coin"/></svg><span></span>';
    toastEl.querySelector('span').textContent = text;
    toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  /* ---------- Walk the trail ---------- */
  function walk(i, done) {
    const seg = litSegs[i], L = seg._L;
    if (reduce) { seg.style.strokeDashoffset = 0; done(); return; }
    setBuddy('walk');
    const dur = 1150, t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const pt = seg.getPointAtLength(e * L);
      const lift = (LIFT[i] + (LIFT[i + 1] - LIFT[i]) * e) * (1 - .45 * Math.sin(e * Math.PI));
      const hop = Math.abs(Math.sin(e * Math.PI * 3)) * 14;
      placeBuddy(pt.x, pt.y - lift - hop);
      seg.style.strokeDashoffset = L * (1 - e);
      if (p < 1) requestAnimationFrame(step); else done();
    };
    requestAnimationFrame(step);
  }

  /* ---------- Actions ---------- */
  let busy = false;
  function checkIn() {
    const i = availableIndex();
    if (busy || i === -1) return;
    busy = true;
    const amt = REWARDS[i], isMega = i === 6;
    const src = isMega ? chestSpot : stops[i];
    const from = state.balance;
    state.claimed += 1; state.todayClaimed = true; state.balance += amt;
    save();
    if (!isMega) walking = true;
    render();
    balanceNum.textContent = from.toLocaleString();

    if (isMega) { retrigger(pass, 'shake', 600); setBuddy('happy'); boing(); }
    else { retrigger(stops[i], 'just-claimed', 650); setBuddy('happy'); }
    toast(isMega ? 'Mega chest opened! +10 coins' : 'Checked in! +' + amt + ' coins');

    let pending = 2;
    const finish = () => { if (--pending === 0) busy = false; };

    if (reduce) { balanceNum.textContent = state.balance.toLocaleString(); finish(); }
    else {
      const r = src.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      burst(cx, cy, isMega ? 140 : 70, isMega ? 1.35 : 1);
      if (isMega) setTimeout(() => burst(cx, cy - 10, 80, 1.1), 260);
      const n = isMega ? 10 : 6;
      let arrived = 0;
      flyCoins(src, balanceEl, n, () => {
        arrived++; bump();
        if (arrived === 1) countTo(from, state.balance, 650);
        if (arrived === n) finish();
      });
    }

    if (!isMega) {
      setTimeout(() => walk(i, () => { walking = false; render(); finish(); }), reduce ? 0 : 520);
    } else finish();
  }

  function onStop(i) {
    if (walking) return;
    if (i === availableIndex()) return checkIn();
    if (i < state.claimed) { retrigger(stops[i], 'boop', 520); toast('Day ' + (i + 1) + ' collected. Nice!'); return; }
    const d = daysUntil(i);
    retrigger(stops[i], 'nope', 420);
    toast(d === 1 ? 'Day ' + (i + 1) + ' unlocks tomorrow' : 'Day ' + (i + 1) + ' unlocks in ' + d + ' days');
  }

  chestSpot.addEventListener('click', () => {
    if (walking) return;
    if (availableIndex() === 6) return checkIn();
    if (state.claimed >= 7) { toast('Already opened. +10 coins collected'); return; }
    const d = daysUntil(6);
    retrigger(chestSpot, 'nope', 420);
    toast(d === 1 ? 'The Mega chest opens tomorrow' : 'The Mega chest opens in ' + d + ' days');
  });

  const LINES = {
    awake: ['Tap the glowing stop!', 'Boing!', 'Hehe, that tickles', 'Coins, coins, coins!'],
    sleep: ['Zzz\u2026 wake me tomorrow', 'Five more minutes\u2026'],
    happy: ['We did it!', 'Best. Week. Ever.', 'Wheee!']
  };
  buddy.addEventListener('click', () => {
    if (walking) return;
    boing();
    const list = LINES[buddyMode()];
    toast(list[(Math.random() * list.length) | 0]);
  });

  function nextDay() {
    if (busy) return;
    if (!state.todayClaimed) {
      toast("Check in first. Today's coins are waiting");
      retrigger(cta, 'nudge', 460);
      return;
    }
    if (state.claimed >= 7) state.claimed = 0;
    state.todayClaimed = false;
    save(); render(); boing();
    toast(state.claimed === 6 ? 'Mega chest day! Open it now' : 'Good morning! New coins are ready');
  }
  function resetWeek() {
    if (busy) return;
    state = { claimed: 0, todayClaimed: false, balance: START_BALANCE };
    save(); render(); toast('Week reset');
  }

  function closeModal() {
    modal.classList.add('closing');
    setTimeout(() => {
      modal.hidden = true; modal.classList.remove('closing');
      $('#reopen').hidden = false; $('#reopen').focus();
    }, 240);
  }
  function openModal() {
    $('#reopen').hidden = true; modal.hidden = false;
    modal.style.animation = 'none'; void modal.offsetWidth; modal.style.animation = '';
    cta.focus({ preventScroll: true });
  }

  cta.addEventListener('click', checkIn);
  $('#closeBtn').addEventListener('click', closeModal);
  $('#reopen').addEventListener('click', openModal);
  $('#nextDay').addEventListener('click', nextDay);
  $('#resetWeek').addEventListener('click', resetWeek);
  $('#more').addEventListener('click', (e) => { e.preventDefault(); toast('Opens ways to earn more coins'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
  setInterval(() => { if (availableIndex() === -1 && !modal.hidden) renderCta(); }, 1000);

  render();
})();
</script>
</body>
</html>
