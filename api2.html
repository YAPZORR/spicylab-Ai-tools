<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpicyLab API module · complete design board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* SpicyLab live-site tokens (sampled from the production header and the Buy more Credits modal) */
:root{color-scheme:dark;
--bg:#030712;--board:#0B0D18;--hdr:#080E1D;--hdr-b:#252942;--pill:#0D0F1F;--pill-b:#252943;
--card:#0D0E25;--card-b:#252845;--card-line:#383858;--inset:#0C0D23;--inset-rec:#120E2E;--inset-b:#2C244F;--gold-edge:#93702A;
--modal:#0C0C22;--field:#0D0F1F;--field-b:#252943;--chip:#12132E;--chip-b:#272A4A;--sel:#241B52;--sel-b:#6D4FD8;
--tile:#17183A;--dash:#3D3B5E;--code:#080A1A;--code-b:#1F2140;--check:#C550F0;
--t1:#F3F4F6;--t2:#D1D5DB;--t3:#9CA3AF;--t4:#8B90A6;--t5:#6B7280;--nav:#B3B8CD;--lbl:#C7CADE;--ph:#6B7280;
--g-title:linear-gradient(90deg,#C583FC,#E77AFA);--g-nav:linear-gradient(90deg,#E43AC0,#AB39F7);
--g-tg:linear-gradient(90deg,#8B5CF6,#A855F7);--g-crypto:linear-gradient(90deg,#7C3AED,#D946EF);
--g-coins:linear-gradient(90deg,#915BF1,#ED6DB1);--g-dl:linear-gradient(90deg,#905BF0,#EA489B);
--g-rec:linear-gradient(135deg,#22D3EE,#AA40EE 45%,#EC4899);--g-outline:linear-gradient(90deg,#4F7CFF,#8A5CF6 50%,#E056D6);
--g-new:linear-gradient(90deg,#8F5BF3,#E44AA1);
--ok:#34D399;--ok-bg:rgba(52,211,153,.1);--ok-b:rgba(52,211,153,.35);
--err:#F87171;--err-bg:rgba(248,113,113,.1);--err-b:rgba(248,113,113,.38);
--run:#A78BFA;--run-bg:rgba(139,92,246,.16);--run-b:rgba(167,139,250,.42);
--wait:#AEB4C6;--wait-bg:rgba(156,163,175,.1);--wait-b:rgba(156,163,175,.32);
--rej:#FB923C;--rej-bg:rgba(251,146,60,.1);--rej-b:rgba(251,146,60,.4);
--train:#67E8F9;--train-bg:rgba(34,211,238,.1);--train-b:rgba(103,232,249,.36);
--warn:#FBBF24;--warn-bg:rgba(251,191,36,.08);--warn-b:rgba(251,191,36,.36);
--ann:#C6F432;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0}
body{background:var(--board);color:var(--t1);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}:focus-visible{outline:2px solid var(--ann);outline-offset:2px}svg{display:block;flex:none}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}.num{font-variant-numeric:tabular-nums}
.grad{background:var(--g-title);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--t3)}.dim{color:var(--t5)}.rel{position:relative}.w{color:#fff}.okc{color:var(--ok)}
.newtag{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:999px;background:var(--g-new);font-size:9.5px;font-weight:800;color:#fff;letter-spacing:.02em}
.same{display:grid;place-items:center;text-align:center;border:1px dashed #3A3870;border-radius:16px;background:repeating-linear-gradient(135deg,rgba(139,92,246,.05) 0 10px,transparent 10px 20px);color:var(--t4);font-size:12.5px;font-weight:600;padding:16px}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ===== board ===== */
.board{max-width:1520px;margin:0 auto;padding:48px 40px 160px}
.bhead{display:grid;grid-template-columns:1fr 470px;gap:44px;align-items:start;padding-bottom:28px}
.bhead h1{margin:0;font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-.025em;color:#fff}
.bhead .intro{margin:14px 0 0;color:var(--nav);max-width:720px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.howto div{padding:13px 15px;border-radius:14px;border:1px solid var(--card-b);background:rgba(13,14,37,.7);font-size:12.5px;color:var(--t3)}
.howto b{display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;margin-bottom:3px}
.legend{padding:14px 18px;border-radius:16px;border:1px solid var(--card-b);background:rgba(13,14,37,.7)}
.legend h4{margin:0 0 6px;font-size:12.5px;color:#fff;font-weight:700}
.legend .lr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:5px 0;font-size:12px;color:var(--t3);border-top:1px solid #171a33}
.jump{position:sticky;top:0;z-index:60;margin:0 -40px;padding:10px 40px;background:rgba(11,13,24,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--card-b);border-bottom:1px solid var(--card-b);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;height:32px;padding:0 12px;border-radius:999px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--t3);border:1px solid transparent;white-space:nowrap}
.jump a b{font-size:10.5px;color:var(--t5)}.jump a:hover{color:#fff}
.jump a.on{background:var(--sel);border-color:var(--sel-b);color:#fff}.jump a.on b{color:#C4B5FD}
.sec{margin-top:92px;scroll-margin-top:64px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:6px;padding-bottom:16px;border-bottom:1px solid var(--card-b)}
.sec-h h2{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#fff}
.sec-h h2 small{display:block;font-size:12.5px;font-weight:700;color:var(--t5);letter-spacing:0;margin-bottom:6px}
.sec-h p{margin:0;max-width:600px;color:var(--t3);font-size:13px;text-align:right}
.subh{margin:48px 0 4px}.subh h3{margin:0;font-size:18px;font-weight:800;color:#fff}
.subh p{margin:4px 0 0;font-size:13px;color:var(--t3);max-width:980px}
.fl{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:26px 0 10px;font-size:13px}
.fl b{font-weight:700;color:var(--t1)}.fl span{color:var(--t5);font-size:12px}
.scroll{overflow-x:auto;padding-bottom:6px}
.frame{width:1440px;border-radius:18px;overflow:hidden;border:1px solid var(--hdr-b);background:var(--bg);box-shadow:0 30px 80px -40px rgba(0,0,0,.9);position:relative}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 28px;margin-top:14px;max-width:1440px}
.note{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:12.5px;color:var(--t3);line-height:1.5}
.note b{color:var(--t2)}.note em{font-style:normal;color:var(--ann);font-weight:700;font-size:11px;display:block;margin-bottom:1px}
.pin{position:absolute;z-index:30;width:22px;height:22px;border-radius:50%;background:var(--ann);color:#162000;font:800 11px/22px Inter,sans-serif;text-align:center;box-shadow:0 0 0 3px rgba(198,244,50,.22);font-style:normal;pointer-events:none}
.note .pin,.pin.il{position:static;display:inline-block;vertical-align:middle}
.pin.tr{top:-9px;right:-9px}.pin.tl{top:-9px;left:-9px}
.g2{display:grid;grid-template-columns:repeat(2,710px);gap:20px;margin-top:12px;align-items:stretch}
.g2>.full{grid-column:1/-1}
.part{border-radius:18px;overflow:hidden;border:1px dashed #3A3870;background:var(--bg);display:flex;flex-direction:column}
.part.wide{width:1440px}
.partbar{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 16px;border-bottom:1px dashed #2C2A52;font-size:11.5px;font-weight:600;color:var(--t4);background:rgba(8,14,29,.85)}
.partbar .ptag{margin-left:auto;font-size:11px;color:var(--t5)}
.partin{padding:22px 26px 26px;flex:1}
.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--hdr-b);background:var(--bg);display:grid;place-items:center;padding:58px 20px 34px}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(#080E1D,#080E1D) 16px 10px/calc(100% - 32px) 46px no-repeat,linear-gradient(#1C1D41,#0C0C22) 40px 96px/200px 250px no-repeat,linear-gradient(#1C1D41,#0C0C22) 255px 96px/200px 250px no-repeat,linear-gradient(#1C1D41,#0C0C22) 470px 96px/200px 250px no-repeat,linear-gradient(#0D0E25,#0D0E25) 40px 370px/630px 300px no-repeat}
.stage::after{content:"";position:absolute;inset:0;background:rgba(3,7,18,.78);backdrop-filter:blur(3px)}
.stage-l{position:absolute;top:16px;left:18px;z-index:3;font-size:12px;font-weight:700;color:var(--t2);display:flex;align-items:center}
.stage-l b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--sel);border:1px solid var(--sel-b);color:#fff;font-size:10.5px;margin-right:8px}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--card-b);background:rgba(13,14,37,.7);font-size:12.5px;color:var(--t2)}
.path b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--sel);border:1px solid var(--sel-b);color:#fff;font-size:10.5px;margin-right:2px}
.path svg{color:var(--t5)}

/* ===== flow map ===== */
.lanes{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.lane{display:grid;grid-template-columns:140px 1fr;gap:18px;padding:18px;border-radius:18px;border:1px solid var(--card-b);background:rgba(13,14,37,.65)}
.lane-l{display:flex;flex-direction:column;gap:6px}
.lane-l i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--g-crypto);color:#fff}
.lane-l b{font-size:16px;color:#fff}.lane-l span{font-size:12px;color:var(--t3)}
.frow{display:flex;align-items:stretch}
.frow+.frow{margin-top:12px;padding-top:12px;border-top:1px dashed #2C2A52}
.fnode{width:178px;flex:none;display:flex;flex-direction:column;gap:3px;padding:12px 13px;border-radius:14px;background:var(--card);border:1px solid var(--card-line);transition:border-color .15s}
.fnode:hover{border-color:var(--sel-b)}
.fnode i{font-style:normal;align-self:flex-start;height:19px;padding:0 7px;border-radius:999px;background:var(--sel);border:1px solid var(--sel-b);font-size:10.5px;font-weight:800;color:#fff;display:grid;place-items:center}
.fnode b{font-size:13.5px;color:#fff;margin-top:4px}.fnode span{font-size:11.5px;color:var(--t3);line-height:1.45}
.fnode.alt{border-style:dashed;background:transparent}
.farr{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t5);gap:2px}
.farr small{font-size:9.5px;font-weight:700;color:var(--t4);text-align:center;line-height:1.2}
.fstack{display:flex;flex-direction:column;gap:6px;width:236px;flex:none}
.fstack .fnode{width:auto;padding:8px 11px;flex-direction:row;align-items:center;gap:8px}
.fstack .fnode b{margin:0;font-size:12.5px}.fstack .fnode b:empty{display:none}.fstack .fnode span{margin-left:auto;font-size:11px;text-align:right}

/* ===== site chrome ===== */
.site{padding:10px 20px 0}
.site-in{height:62px;border:1px solid var(--hdr-b);border-radius:16px;background:var(--hdr);display:flex;align-items:center;gap:18px;padding:0 10px 0 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff}
.navgrp{display:flex;align-items:center;gap:4px}
.navgrp a{white-space:nowrap;display:flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:999px;font-size:14px;font-weight:500;color:var(--nav);position:relative}
.navgrp a.on{background:var(--g-nav);color:#fff;font-weight:700}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.coinpill{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--pill-b);background:var(--pill);white-space:nowrap}
.coinpill b{font-size:15px;font-weight:700;color:#fff}
.getcoins{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 13px;border-radius:999px;background:var(--g-coins);font-size:12px;font-weight:800;letter-spacing:.02em;color:#fff}
.getcoins i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.pillbtn{white-space:nowrap;display:flex;align-items:center;gap:9px;height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--pill-b);background:var(--pill);font-size:14px;font-weight:500;color:var(--lbl)}
.pillbtn.signin{color:#fff;font-weight:600}
.dlbtn{white-space:nowrap;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--g-dl);font-size:14px;font-weight:700;color:#fff;box-shadow:0 6px 22px -8px rgba(234,72,155,.7)}
.avatar{width:44px;height:44px;border-radius:50%;background:#EF6C00;display:grid;place-items:center;font-size:20px;font-weight:500;color:#fff;box-shadow:0 0 0 2px #8B5CF6;flex:none;position:relative}
.avatar.s{width:34px;height:34px;font-size:16px}
.apinav{margin:14px 20px 0;padding:0 8px;border-bottom:1px solid var(--hdr-b);display:flex;align-items:center;gap:4px;height:50px}
.apiname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-right:18px;color:#fff}
.apinav>a{height:50px;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--t3);position:relative}
.apinav>a.on{color:#fff}
.apinav>a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--g-nav)}
.apinav .sp{margin-left:auto}
.usdpill{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--ok-b);background:rgba(52,211,153,.07);font-size:12.5px;color:var(--t2);font-weight:600;white-space:nowrap;position:relative}
.usdpill b{color:#fff}
.menu{position:absolute;z-index:25;width:300px;padding:8px;border-radius:18px;border:1px solid #2A2B52;background:radial-gradient(260px 120px at 100% 0,rgba(168,40,180,.2),transparent 70%),var(--modal);box-shadow:0 30px 60px -20px rgba(0,0,0,.9)}
.menu .who{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--card-b);margin-bottom:6px}
.menu .who b{display:block;color:#fff;font-size:14px}.menu .who small{color:var(--t3);font-size:12px}
.menu a{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:11px;font-size:13.5px;color:var(--t2);font-weight:500}
.menu a.hl{background:rgba(139,92,246,.12);color:#fff}
.menu a .r{margin-left:auto;font-size:12px;font-weight:700}
.menu .sep{height:1px;background:var(--card-b);margin:6px 4px}
.menu .lbl{font-size:11px;font-weight:700;color:var(--t5);padding:8px 10px 4px;display:flex;gap:8px;align-items:center}

/* ===== primitives ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;font-weight:700;font-size:14.5px;border:1px solid transparent;white-space:nowrap;color:#fff}
.btn.sm{height:38px;padding:0 15px;font-size:13px;border-radius:11px}
.btn.xs{height:32px;padding:0 12px;font-size:12px;border-radius:9px}
.btn.crypto,.btn.cta{background:var(--g-crypto);box-shadow:0 10px 28px -12px rgba(217,70,239,.8)}
.btn.tg{background:var(--g-tg);box-shadow:0 10px 28px -12px rgba(139,92,246,.8)}
.btn.outline{background:linear-gradient(#12132E,#12132E) padding-box,var(--g-outline) border-box}
.btn.soft{background:var(--g-tg)}
.btn.ghost{background:var(--chip);border-color:var(--card-line);color:var(--t1)}
.btn.line{background:transparent;border-color:var(--pill-b);color:var(--t2)}
.btn.danger{background:#DC2626}
.btn.teal{background:linear-gradient(#0E2233,#0E2233) padding-box,linear-gradient(90deg,#22D3EE,#6366F1) border-box;color:#A5F3FC}
.btn.off,.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.link{color:#E9A8FB;font-weight:700;display:inline-flex;align-items:center;gap:5px}.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-b);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.chip.on{background:var(--sel);border-color:var(--sel-b);color:#fff}.chip.sm{height:24px;font-size:11px;padding:0 9px}
button.chip:hover{color:#fff}
.panel{background:var(--card);border:1px solid var(--card-b);border-radius:18px}
.gcard{border:1px solid transparent;background:linear-gradient(180deg,#1E1648,#0E0C26 55%,#0D0E25) padding-box,var(--g-rec) border-box;border-radius:20px;box-shadow:0 0 44px -14px rgba(170,64,238,.55)}
.field{display:flex;flex-direction:column;gap:6px}.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--t1)}
.field .hint{font-size:11.5px;color:var(--t3)}.errm{font-size:11.5px;color:var(--err);display:flex;align-items:center;gap:5px;font-weight:600}
.input{height:46px;border-radius:12px;background:var(--field);border:1px solid var(--field-b);padding:0 14px;color:var(--t1);font-size:13.5px;display:flex;align-items:center;gap:8px}
.input.ph{color:var(--ph)}.input.focus{border-color:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.22)}
.input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.14)}
.input.area{height:auto;min-height:66px;padding:12px 14px;align-items:flex-start}.input.sel{justify-content:space-between}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--t2)}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid #4B4F7A;background:var(--field);display:grid;place-items:center;flex:none;margin-top:1px}
.box.on{background:var(--g-crypto);border-color:transparent}
.ck{width:18px;height:18px;border-radius:50%;background:var(--check);box-shadow:0 0 12px rgba(197,80,240,.55);display:grid;place-items:center;color:#fff;flex:none}
.coin{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD54A,#E8AC00 60%,#C98600);box-shadow:inset 0 0 0 2px #DB9300;color:#8A5A00;font-weight:900;flex:none}
.sk{display:inline-block;background:linear-gradient(90deg,#14162e 0%,#232646 40%,#14162e 80%);background-size:300% 100%;border-radius:8px;animation:sk 1.6s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-200% 0}}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid rgba(167,139,250,.25);border-top-color:var(--run);animation:spin .9s linear infinite;flex:none}
.spin.lg{width:46px;height:46px;border-width:3px}@keyframes spin{to{transform:rotate(360deg)}}
.ind{height:6px;border-radius:6px;background:#1E1F40;overflow:hidden;position:relative}
.ind span{position:absolute;top:0;bottom:0;width:35%;border-radius:6px;background:var(--g-crypto);animation:ind 1.6s ease-in-out infinite}
@keyframes ind{from{left:-35%}to{left:100%}}
@media (prefers-reduced-motion:reduce){.spin,.sk,.ind span,.dotspin{animation:none!important}html{scroll-behavior:auto}}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-b)}.st.err{color:var(--err);background:var(--err-bg);border-color:var(--err-b)}
.st.run{color:var(--run);background:var(--run-bg);border-color:var(--run-b)}.st.wait{color:var(--wait);background:var(--wait-bg);border-color:var(--wait-b)}
.st.rej{color:var(--rej);background:var(--rej-bg);border-color:var(--rej-b)}.st.train{color:var(--train);background:var(--train-bg);border-color:var(--train-b)}

/* ===== pages ===== */

.pbtn{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(3,7,18,.6)!important;backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18)}

.up{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.upside{display:flex;flex-direction:column;gap:8px;min-width:0}
.zoom{height:96px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--chip-b)}

.lowres{filter:blur(1.6px) saturate(.9)}.lowres2{filter:blur(1.1px) saturate(.85)}
.pix{position:absolute;inset:0;background-image:linear-gradient(rgba(3,7,18,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(3,7,18,.18) 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
.pix.big{background-size:14px 14px}
.zoom-frame{position:absolute;left:7%;top:36%;width:30%;height:30%;border:1.5px dashed rgba(255,255,255,.8);border-radius:4px}
.tflow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tflow.v{grid-template-columns:1fr;gap:10px}

/* ===== plans ===== */

/* ===== modals ===== */

.sumrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1E1F40;font-size:13px}

.ratebox{margin-top:12px;border-radius:14px;background:var(--code);border:1px solid var(--code-b);padding:12px 14px}

.rates{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;font-size:12px}.rates div{display:flex;justify-content:space-between;color:var(--t3)}.rates b{color:#fff;font-weight:600}
.limits{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;position:relative}.methods .btn{height:52px}
.state-c{text-align:center;padding:6px 6px 2px}
.state-c .ic{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center}
.state-c h3{margin:0;font-size:21px;font-weight:800;color:#fff}.state-c p{margin:6px auto 0;color:var(--t3);font-size:13px;max-width:380px}
.ic.ok{background:var(--ok-bg);border:1px solid var(--ok-b);color:var(--ok)}.ic.err{background:var(--err-bg);border:1px solid var(--err-b);color:var(--err)}
.ic.wait{background:var(--wait-bg);border:1px solid var(--wait-b);color:var(--wait)}.ic.run{color:var(--run)}
.ic.tgc{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;border-radius:50%;box-shadow:0 0 0 8px rgba(59,130,246,.15)}
.ic.vio{background:var(--tile);border:1px solid var(--card-line);color:#E9A8FB}
.keptplan{margin-top:16px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--chip);border:1px solid var(--chip-b);text-align:left}

.ms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mopt{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;background:var(--field);border:1px solid var(--field-b);font-size:12.5px;color:var(--t2);font-weight:600}
.mopt.on{background:var(--sel);border-color:var(--sel-b);color:#fff}.ms.bad .mopt{border-color:rgba(248,113,113,.4)}
.keyshow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--code);border:1px solid var(--sel-b);font-family:var(--mono);font-size:12.5px;color:#E9E7FF;word-break:break-all}
.keyshow span{flex:1}
.steps-mini{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}

.steps-mini div.done{color:#fff}.steps-mini div.now{color:var(--t1)}
.steps-mini i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:#1E1F40;color:var(--t3)}
.steps-mini div.done i{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-b)}.steps-mini div.now i{background:var(--run-bg);border:1px solid var(--run-b)}
.center{text-align:center}.small{font-size:12.5px;color:var(--t3)}

/* ===== console ===== */
.con{display:grid;grid-template-columns:250px 1fr;margin-top:10px}
.side{border-right:1px solid var(--hdr-b);padding:14px 12px 18px 20px;display:flex;flex-direction:column;gap:3px}
.side a{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:var(--nav)}
.side a.on{background:linear-gradient(90deg,rgba(228,58,192,.18),rgba(171,57,247,.12));color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(171,57,247,.45)}
.side .sh{font-size:11px;font-weight:700;color:var(--t5);padding:14px 12px 6px}
.sbal{margin-top:auto;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--card-b)}
.sbal small{display:block;font-size:11px;color:var(--t3);font-weight:600}.sbal b{font-size:21px;font-weight:800;color:#fff}
.sbal .tier{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--t3)}
.side .sbal a{display:inline;height:auto;padding:0;font-size:11.5px;color:#E9A8FB;font-weight:700}
.cmain{padding:22px 32px 40px 30px;min-width:0;min-height:600px}
.ch{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}

.ch p{margin:4px 0 0;color:var(--t3);font-size:13px}.ch .acts{display:flex;gap:10px}
.crumb{font-size:12px;color:var(--t4);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ov{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px}
.balcard{padding:24px;grid-row:span 2;display:flex;flex-direction:column;position:relative}

.balcard .v{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:10px;color:#fff}
.balcard .v sup{font-size:26px;vertical-align:top;position:relative;top:7px;margin-right:2px;color:var(--t2)}
.balcard .v.lowv{color:var(--warn)}.balcard .v.zero{color:var(--err)}
.balcard .exp{margin-top:10px;font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:7px}
.balcard .row{display:flex;gap:10px;margin-top:auto;padding-top:20px}
.balcard.mini{padding:18px;grid-row:auto}.balcard.mini .v{font-size:40px}
.kpi{padding:16px 18px;position:relative}.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:#fff}
.kpi p{margin:4px 0 0;font-size:12px;color:var(--t3)}
.kpi.reserved{border-style:dashed;border-color:#3A3870;background:repeating-linear-gradient(135deg,rgba(139,92,246,.05) 0 8px,transparent 8px 16px),var(--card)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px}.trio div{padding-right:10px}
.trio div+div{padding-left:14px;border-left:1px solid var(--card-b)}.trio b{font-size:23px;font-weight:800;display:block;color:#fff}
.trio span{font-size:11.5px;color:var(--t3);font-weight:600;display:flex;align-items:center;gap:5px}.trio .o{color:var(--ok)}.trio .e{color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ptitle2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}.ptitle2 h3{margin:0;font-size:15px;font-weight:700;color:#fff}
.limitrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-top:1px solid #1A1C38;font-size:12.5px}
.limitrow span{color:var(--t3)}.limitrow b{font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.meter{width:90px;height:6px;border-radius:6px;background:#1E1F40;overflow:hidden;display:inline-block}.meter i{display:block;height:100%;background:var(--g-crypto)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--t4);text-align:left;padding:11px 14px;border-bottom:1px solid var(--card-b);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #151733;vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}.tbl .r{text-align:right}
.tbl td.fee{font-weight:700;font-variant-numeric:tabular-nums;color:#fff}.tbl td.fee small{display:block;font-weight:500;color:var(--t3);font-size:11px}
.tbl tr.revoked td{color:var(--t5)}.tbl tr.revoked .mono{text-decoration:line-through;text-decoration-color:rgba(139,144,166,.6)}
.tbl td.wrap{white-space:normal}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;position:relative}
.sel{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border-radius:12px;background:var(--pill);border:1px solid var(--pill-b);font-size:12.5px;font-weight:500;color:var(--t3);position:relative}
.sel b{color:#fff;font-weight:600}.sel.open{border-color:var(--sel-b);background:var(--sel)}
.search{flex:1;min-width:220px;max-width:360px;margin-left:auto;height:40px;border-radius:12px;position:relative}
.ddp{border-radius:14px;background:#11122C;border:1px solid var(--card-line);padding:6px;box-shadow:0 24px 50px -16px rgba(0,0,0,.9)}
.ddp h6{margin:4px 8px 6px;font-size:11px;font-weight:700;color:var(--t5)}
.ddp div.o{display:flex;align-items:center;gap:9px;min-height:34px;padding:0 9px;border-radius:9px;font-size:12.5px;color:var(--t2);font-weight:500}
.ddp div.o.on{background:var(--sel);color:#fff}.ddp .box{width:16px;height:16px}
.ddp .foot{display:flex;justify-content:space-between;gap:8px;padding:8px 6px 4px;border-top:1px solid var(--card-b);margin-top:6px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--card-b);font-size:12px;color:var(--t3)}
.pager .pg{display:flex;gap:6px}
.pager .pg span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-b);font-weight:700;color:var(--t2)}
.pager .pg span.on{background:var(--g-nav);border-color:transparent;color:#fff}
.success-hero{display:flex;align-items:center;gap:18px;padding:24px;border-radius:20px;border:1px solid transparent;background:linear-gradient(90deg,#0F2A2A,#141538 60%,#1A1236) padding-box,linear-gradient(90deg,#34D399,#8B5CF6,#EC4899) border-box;position:relative}
.success-hero h2{margin:0;font-size:23px;font-weight:800;color:#fff}.success-hero p{margin:4px 0 0;color:var(--t2);font-size:13px}
.statsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.statsrow .kpi .v{font-size:25px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.s3{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--card-b);display:flex;gap:12px}
.s3 i{font-style:normal;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--sel);border:1px solid var(--sel-b);font-weight:800;font-size:12px;flex:none;color:#fff}
.s3 b{display:block;font-size:13.5px;color:#fff}.s3 span{font-size:12px;color:var(--t3)}
.empty{text-align:center;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--tile);border:1px solid var(--card-line);display:grid;place-items:center;color:#E9A8FB;margin-bottom:16px}
.empty h3{margin:0;font-size:18px;font-weight:800;color:#fff}.empty p{margin:6px 0 18px;color:var(--t3);font-size:13px;max-width:420px}
.empty .row{display:flex;gap:10px}
.lots .limitrow b{font-variant-numeric:tabular-nums}
.txtype{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:#fff}
.txtype i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-style:normal}
.amt-pos{color:var(--ok);font-weight:800}.amt-neg{color:#fff;font-weight:800}.amt-rel{color:var(--run);font-weight:800}.amt-exp{color:var(--warn);font-weight:800}
.receipt{background:#fff;color:#111827;border-radius:14px;padding:20px;font-size:12.5px}

.receipt .rr span{color:#6B7280}.receipt .tot{font-size:15px;font-weight:800;border-bottom:0}

/* ===== drawers and results ===== */
.drawers{display:grid;grid-template-columns:repeat(3,460px);gap:22px 20px;align-items:start;margin-top:12px}
.dcell .fl{margin:0 0 8px}
.drawer{border:1px solid #2A2B52;border-radius:18px;background:radial-gradient(400px 200px at 100% 0,rgba(168,40,180,.16),transparent 70%),var(--modal);box-shadow:0 30px 60px -30px rgba(0,0,0,.9);position:relative}
.dh{padding:16px 18px 14px;border-bottom:1px solid var(--card-b);display:flex;align-items:flex-start;gap:12px}
.dh h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px;color:#fff;flex-wrap:wrap}.dh p{margin:4px 0 0;font-size:12px;color:var(--t3)}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--t3)}.kv dd{margin:0;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0;color:#fff}
.blk{border-radius:16px;background:var(--card);border:1px solid var(--card-b);padding:14px;position:relative}
.blk h4{margin:0 0 10px;font-size:12.5px;font-weight:700;color:var(--t2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.blk h4 span{font-weight:600;font-size:11.5px;color:var(--t5)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money div{padding:10px 11px;border-radius:11px;background:var(--code);border:1px solid var(--code-b)}
.money small{display:block;font-size:11px;color:var(--t3);font-weight:600}.money b{font-size:16px;font-weight:800;color:#fff}
.bdown{margin-top:10px;font-size:12px;color:var(--t3)}.bdown div{display:flex;justify-content:space-between;padding:4px 0}.bdown b{color:#fff;font-weight:600}
.coll{border-radius:12px;border:1px solid var(--card-b);overflow:hidden}
.coll summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:12.5px;font-weight:600;color:var(--t2);background:rgba(18,19,46,.7)}
.coll summary::-webkit-details-marker{display:none}.coll summary small{font-weight:600;font-size:11px;color:var(--t5)}
.coll summary .chev{margin-left:auto;transition:transform .2s}.coll[open] summary .chev{transform:rotate(180deg)}
.coll pre{margin:0;padding:12px 14px;background:var(--code);font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#D7D9EC;white-space:pre;overflow-x:auto}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--t3);margin-top:10px}

.expired{border-radius:12px;border:1px dashed #3A3870;display:grid;place-items:center;text-align:center;color:var(--t3);font-size:12.5px;padding:28px 16px;background:repeating-linear-gradient(135deg,rgba(139,92,246,.04) 0 10px,transparent 10px 20px)}
.expired svg{margin:0 auto}.expired b{display:block;color:#fff;font-size:14px;margin:8px 0 2px}
.errbox{border-radius:12px;background:var(--err-bg);border:1px solid var(--err-b);padding:14px;font-size:12.5px;color:var(--t2);display:flex;flex-direction:column;gap:7px}
.errbox.rej{background:var(--rej-bg);border-color:var(--rej-b)}.errbox b{font-size:13.5px}
.errbox code{font-family:var(--mono);font-size:11.5px}
.progress{border-radius:12px;background:var(--code);border:1px solid var(--code-b);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--t3)}
.tl{display:flex;flex-direction:column}
.tl div{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding-bottom:14px;position:relative;font-size:12.5px}
.tl div::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--sel-b)}.tl div:last-child::before{display:none}
.tl i{width:17px;height:17px;border-radius:50%;background:var(--ok-bg);border:1px solid var(--ok-b);display:grid;place-items:center;color:var(--ok)}
.tl i.e{background:var(--err-bg);border-color:var(--err-b);color:var(--err)}.tl i.p{background:var(--train-bg);border-color:var(--train-b);color:var(--train)}
.tl i.g{background:#1E1F40;border-color:#2A2B52}
.tl span{color:var(--t3)}.tl b{font-weight:600;color:#fff}
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.outgrid .thumb{height:150px}

/* ===== coverage ===== */
.cov td{white-space:normal;vertical-align:top}.cov td:first-child{font-weight:700;color:#fff;width:270px}
.cov a.link{font-size:12px;margin-right:12px}

/* ===== mobile ===== */
.mgroup{margin-top:34px}.mgroup>h3{margin:0 0 2px;font-size:16px;color:#fff;font-weight:800}.mgroup>p{margin:0;font-size:12.5px;color:var(--t3)}
.phones{display:grid;grid-template-columns:repeat(3,390px);gap:36px 52px;align-items:start;margin-top:4px}
.phonewrap .fl{margin-top:16px;flex-direction:column;align-items:flex-start;gap:2px;min-height:40px}
.phone{width:390px;border-radius:40px;border:1px solid #2A2B52;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 70px -30px rgba(0,0,0,.95),inset 0 0 0 6px #070914}
.m-hdr{height:60px;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;margin:12px 10px 0;border:1px solid var(--hdr-b);border-radius:16px;background:var(--hdr)}

.vflow{display:flex;flex-direction:column}

.vflow>div:last-child::before{display:none}
.vflow i{font-style:normal;width:34px;height:34px;border-radius:11px;background:var(--tile);border:1px solid var(--card-line);display:grid;place-items:center;font-weight:800;font-size:13px;color:#E9A8FB}
.vflow b{font-size:14px;display:block;padding-top:2px;color:#fff}.vflow span{font-size:12.5px;color:var(--t3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--pill);border:1px solid var(--pill-b);gap:4px}

.sheet{position:relative;border-radius:28px 28px 0 0;border:1px solid #2A2B52;border-bottom:0;padding:10px 18px 24px;background:radial-gradient(300px 160px at 0 0,rgba(79,70,229,.28),transparent 70%),radial-gradient(300px 160px at 100% 0,rgba(168,40,180,.26),transparent 70%),var(--modal)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:#3A3870;margin:2px auto 14px}
.sheet-stage{position:relative;padding-top:110px;background:linear-gradient(rgba(3,7,18,.78),rgba(3,7,18,.78)),var(--bg)}
.m-bnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hdr-b);background:rgba(8,14,29,.97);padding:6px 6px 14px}
.m-bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--t4);padding:6px 0;border-radius:10px;min-height:46px;justify-content:center}
.m-bnav a.on{color:#fff;background:linear-gradient(90deg,rgba(228,58,192,.2),rgba(171,57,247,.16))}

.mcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}.mcard .kv{grid-template-columns:96px 1fr;margin-top:10px;font-size:12px}
.mcard .bot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #1A1C38;font-size:12px;color:var(--t3)}

/* ============ Assemble and wire up ============ */
function render(){
 const parts=[sHead,sFlow,sIntegration,sOverview,sPlans,sPay,sSales,sDone,sConsole,sKeys,sLogs,sDetails,sModels,sBilling,sMobile,sCoverage];
 document.getElementById('board').innerHTML=parts.map(fn=>{try{return fn();}catch(e){console.error(e);return `<div class="alert err" style="margin-top:40px"><span class="ai">${ic('warn',16)}</span><div><b>Couldn’t draw ${fn.name}</b><p>${String(e&&e.message||e)}</p></div></div>`;}}).join('');
 wire();
}
const timers=new WeakMap();
function stopPlayer(p){clearInterval(timers.get(p));p.classList.remove('playing');const tm=p.querySelector('.tm');if(tm)tm.textContent='0:00 / 0:05';}
function playPlayer(p){
 stopPlayer(p);void p.offsetWidth;p.classList.add('playing');const tm=p.querySelector('.tm'),t0=Date.now();
 timers.set(p,setInterval(()=>{const s=Math.min(5,(Date.now()-t0)/1000);tm.textContent='0:0'+Math.floor(s)+' / 0:05';if(s>=5){clearInterval(timers.get(p));setTimeout(()=>stopPlayer(p),600);}},100));
}
function wire(){
 const B=document.getElementById('board');
 B.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('a[href="#"]'))e.preventDefault();
  const tab=t.closest('[data-tab]');
  if(tab){const box=tab.closest('[data-tabs]');box.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('on',x===tab);x.setAttribute('aria-selected',x===tab);});box.querySelectorAll('[data-pane]').forEach(p=>{p.hidden=p.dataset.pane!==tab.dataset.tab;});}
  const seg=t.closest('[data-seg] .seg button');
  if(seg){const box=seg.closest('[data-seg]'),i=+seg.dataset.i;box.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b===seg));box.querySelectorAll('[data-v]').forEach(p=>{const v=p.dataset.v.split('|');if(v[i]!==undefined)p.textContent=v[i];});}
  const f=t.closest('[data-filter] [data-f]');
  if(f){const box=f.closest('[data-filter]');box.querySelectorAll('[data-f]').forEach(c=>c.classList.toggle('on',c===f));box.querySelectorAll('[data-t]').forEach(r=>{r.hidden=f.dataset.f!=='all'&&r.dataset.t!==f.dataset.f;});}
  const c=t.closest('.copy,[data-copy]');
  if(c){e.preventDefault();if(c.classList.contains('copy')){c.classList.add('done');setTimeout(()=>c.classList.remove('done'),900);}else if(!c.dataset.busy){c.dataset.busy='1';const h=c.innerHTML;c.innerHTML=ic('check',14,2.6)+'Copied';setTimeout(()=>{c.innerHTML=h;delete c.dataset.busy;},1200);}}
  const pb=t.closest('.pbtn');if(pb)playPlayer(pb.closest('.player'));
 });
 B.addEventListener('input',e=>{if(e.target.matches('.cmp input'))e.target.parentElement.style.setProperty('--pos',e.target.value+'%');});
 if('IntersectionObserver' in window){
  const links=[...B.querySelectorAll('.jump a')];
  const io=new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.dataset.sec===x.target.id));const on=links.find(l=>l.dataset.sec===x.target.id);if(on&&on.parentElement.scrollTo)on.parentElement.scrollTo({left:on.offsetLeft-60,behavior:'smooth'});}}),{rootMargin:'-35% 0px -60% 0px'});
  B.querySelectorAll('.sec').forEach(s=>io.observe(s));
  const po=new IntersectionObserver(en=>en.forEach(x=>{if(!x.isIntersecting&&x.target.classList.contains('playing'))stopPlayer(x.target);}));
  B.querySelectorAll('.player').forEach(p=>po.observe(p));
 }
}
render();

</script>
