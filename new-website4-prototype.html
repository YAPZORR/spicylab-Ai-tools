function modalContent(){const name=state.modal,data=state.modalData;let title='',body='',foot='',wide=false,drawer=false;switch(name){
case 'sitemap':{title='Explore all screens';wide=true;const pages=[['home','Creation Hub','sparkles'],['projects','Short Film Projects','film'],['canvases','Free Canvases','grid'],['image','Image Generation','image'],['video','Video Generation','video'],['skills','Skills Library','wand'],['assets','Material Library','folder'],['history','Creation History','clock'],['settings','Account Settings','settings']];body=`<p class="sub sm mb-14">Every screen lives in this one HTML file. Click a destination to navigate.</p><div class="sitemap-grid">${pages.map(([pg,n,i])=>`<button class="sitemap-item" data-action="goFromModal" data-page="${pg}"><span class="stat-icon" style="width:33px;height:33px">${icon(i,17)}</span>${n}${icon('right',13)}</button>`).join('')}</div><div class="divider"></div><h4>Production workspace tabs</h4><div class="chiprow mt-12">${[['overview','Overview'],['chapters','Chapters'],['storyboard','Storyboards'],['projectCanvas','Project Canvas'],['film','Film Editor'],['roles','Roles & Assets'],['setup','Setup']].map(([t,n])=>`<button class="chip" data-action="goProjectTab" data-tab="${t}">${n}</button>`).join('')}</div><div class="divider"></div><h4>Explore components and dialogs</h4><div class="chiprow mt-12">${[['toolPicker','Creation tools'],['newMaterial','New material'],['createSkill','Create skill'],['addRole','Add character'],['styles','Art styles'],['nodeAdd','Canvas nodes'],['credits','Credits'],['editProfile','Edit profile']].map(([m,n])=>`<button class="chip" data-action="openModal" data-modal="${m}">${n}</button>`).join('')}</div>`;break}
case 'command':{title='Search Halo Studio';wide=false;const searchable=[['home','Creation Hub','Create with image, video, text or an agent'],['projects','Short Film Projects','Plan stories and chapters'],['canvases','Visual Canvas','Work in an infinite canvas'],['image','Image Generation','Visual workflows and output settings'],['video','Video Generation','Create film shots'],['skills','Skills Library','Find reusable creator workflows'],['assets','Material Library','Browse and add materials'],['history','Creation History','Past generation tasks'],['settings','Account Settings','Configure your workspace']].filter(it=>it.join(' ').toLowerCase().includes(state.modalSearch.toLowerCase()));body=`<div class="input-wrap">${icon('search',17)}<input class="field" data-bind="modalSearch" placeholder="Type a page, action or tool..." value="${esc(state.modalSearch)}" data-autofocus></div><div class="mt-12">${searchable.map(([p,l,desc])=>`<button class="pop-item" data-action="goFromModal" data-page="${p}">${icon(p==='home'?'sparkles':p==='projects'?'film':p==='assets'?'folder':p==='settings'?'settings':p==='skills'?'wand':p==='video'?'video':p==='image'?'image':'grid',19)}<span style="flex:1"><strong style="display:block">${l}</strong><small class="muted">${desc}</small></span>${icon('arrow',15)}</button>`).join('')}${!searchable.length?empty('No screens found','Try another keyword.','search'):''}</div>`;break}
case 'toolPicker':{title='Choose a creative workflow';wide=true;const tools=state.page==='video'?VIDEO_TOOLS:IMAGE_TOOLS;const cat=['all',...new Set(tools.map(t=>t.category).filter(c=>c!=='All'))];const list=tools.filter(t=>(state.modalFilter==='all'||state.modalFilter===t.category)&&(t.name+' '+t.desc).toLowerCase().includes(state.modalSearch.toLowerCase()));body=`<p class="sub sm mb-14">Start from scratch or pick a specialized visual production template.</p><div class="input-wrap mb-14">${icon('search',15)}<input class="field" data-bind="modalSearch" placeholder="Find a creation tool..." value="${esc(state.modalSearch)}" data-autofocus></div><div class="chiprow mb-14">${cat.map(c=>`<button class="chip ${state.modalFilter===c?'active':''}" data-action="modalFilter" data-filter="${c}">${c==='all'?'All':c}</button>`).join('')}</div><div class="modal-tool-grid">${list.map(t=>`<button class="tool-select-card" data-action="chooseTool" data-name="${esc(t.name)}"><span class="tool-icon">${icon(t.icon,19)}</span><strong>${esc(t.name)}</strong><p>${esc(t.desc)}</p></button>`).join('')}</div>${!list.length?empty('No workflows found','Try another search term.'):''}`;break}
case 'newMaterial':{title='Add a new material';wide=true;body=`<div class="grid-2"><div><div class="form-group"><label class="form-label">Material type</label><select class="select" id="assetNewType"><option value="image">Picture</option><option value="text">Text</option><option value="video">Video</option><option value="audio">Audio</option><option value="3D model">3D model</option></select></div><div class="form-group"><label class="form-label">Business classification</label><select class="select" id="assetNewGroup"><option>Material</option><option>Role</option><option>Scene</option><option>Props</option><option>Other</option></select></div><div class="form-group"><label class="form-label">Material title</label><input class="field" id="assetNewTitle" placeholder="A searchable descriptive name" data-autofocus></div><div class="form-group"><label class="form-label">Image URL (optional)</label><input class="field" id="assetNewUrl" placeholder="https://images.example.com/reference.jpg"></div><div class="form-group"><label class="form-label">Tags</label><input class="field" id="assetNewTags" placeholder="Portrait, medieval, scene..."></div><div class="form-group"><label class="form-label">Description / text content</label><textarea class="textarea" id="assetNewDesc" style="min-height:110px" placeholder="Add a description, script, visual note or prompt."></textarea></div></div><div><label class="form-label">Material preview</label><div style="aspect-ratio:1.18;background:var(--soft);border:1px dashed var(--line);border-radius:14px;overflow:hidden;display:grid;place-items:center" id="assetPreviewZone">${state.assetUploadData?imgTag(state.assetUploadData,'Uploaded reference','cover'):`<div class="text-center muted">${icon('image',35)}<p class="mt-12">No image selected</p></div>`}</div><button class="btn sm mt-12 w-full" data-action="triggerUpload" data-upload="materialUpload">${icon('upload',15)} Upload a cover image</button><input type="file" accept="image/*" hidden id="materialUpload"><div class="hero-note mt-16">${icon('info',14)} File previews are compressed before browser storage. Larger original files are not uploaded anywhere.</div></div></div>`;foot=`${btn('Cancel','closeModal','btn')}${btn(`${icon('check',14)} Save material`,'saveMaterial','btn primary')}`;break}
case 'assetDetail':{drawer=true;const a=db.assets.find(a=>a.id==data.id);if(!a){title='Material not found';body='This material is unavailable.';break}title='Material archives';body=`<div class="flex gap-9 mb-14"><div class="stat-icon">${icon(a.type==='image'?'image':a.type==='video'?'video':'file',19)}</div><div><h3>${esc(a.title)}</h3><p class="tiny muted">Added ${esc(a.date)} · ${esc(a.type)}</p></div></div><div style="min-height:240px;background:var(--soft);border-radius:15px;overflow:hidden;display:grid;place-items:center">${a.image?imgTag(a.image,a.title,'cover'):`<div class="text-center muted">${icon(a.type==='audio'?'volume':'file',42)}<p class="mt-12">${esc(a.desc)}</p></div>`}</div><div class="mt-16">${pill(a.group,'violet')} ${pill(a.type)}</div><div class="divider"></div><div class="caption">Description</div><p class="sm sub mt-12">${esc(a.desc)}</p><div class="divider"></div>${[['Title',a.title],['Material type',a.type],['Classification',a.group],['Tags',a.tags||'—'],['Added',a.date],['Storage','Local prototype / external image URL']].map(([k,v])=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="tiny muted">${k}</span><strong class="sm" style="max-width:60%;text-align:right;overflow-wrap:anywhere">${esc(v)}</strong></div>`).join('')}`;foot=`${btn(`${icon('copy',14)} Copy details`,'copyAsset','btn','data-id="'+a.id+'"')}${btn(`${icon('trash',14)} Delete`,'askDeleteAsset','btn danger','data-id="'+a.id+'"')}`;break}
case 'inspiration':{wide=true;const d=demos.find(d=>d.id==data.id)||demos[0];title=d.title;body=`<div class="grid-2"><div class="cover-wrap" style="aspect-ratio:1.1">${imgTag(d.image,d.title,'cover')}<span class="cover-tag">${d.type.toUpperCase()}</span></div><div><div class="eyebrow">${esc(d.category)} inspiration</div><h2 class="mt-12">${esc(d.title)}</h2><p class="sub sm mt-16">${esc(d.description)}</p><div class="setting-card"><strong>Prompt inspiration</strong><p class="sm muted mt-12">${esc(d.description)} Detailed composition, stunning lighting, professional framing, refined art direction and high visual quality.</p></div><div class="flex gap-8">${btn(`${icon('sparkles',15)} Use this idea`,'useInspiration','btn primary','data-id="'+d.id+'"')}${btn(`${icon('heart',14)} ${db.favorites.includes(d.id)?'Saved':'Save'}`,'toggleFavorite','btn','data-id="'+d.id+'"')}</div></div></div>`;break}
case 'inspireCreate':{title='Share a new inspiration';body=`<div class="hero-note mb-14">${icon('info',14)} This front-end demo will add an idea to your local inspiration collection.</div><div class="form-group"><label class="form-label">Creative title</label><input id="inspireTitle" class="field" data-autofocus placeholder="The world inside a drop of rain"></div><div class="form-group"><label class="form-label">Description / prompt</label><textarea id="inspireDesc" class="textarea" placeholder="Describe the subject, colors, style and story..."></textarea></div><div class="form-group"><label class="form-label">Category</label><select class="select" id="inspireType"><option>image</option><option>video</option></select></div>`;foot=`${btn('Cancel','closeModal','btn')}${btn('Save inspiration','saveInspiration','btn primary')}`;break}
case 'styles':{title='Choose your visual style';wide=true;const choices=[['Cinematic',PH.city],['3D Animation',PH.fantasy],['Anime',PH.flower],['Documentary',PH.sea],['Live-action',PH.woman],['Editorial',PH.model]];body=`<p class="sm muted mb-14">Select a creative direction. You can always change it in project setup.</p><div class="grid-3">${choices.map(([n,url])=>`<button class="style-option ${state.storyStyle===n?'selected':''}" data-action="chooseStyle" data-style="${n}">${imgTag(url,n,'cover')}<span>${esc(n)}</span></button>`).join('')}</div>`;break}
case 'addRole':{title='New character / role';body=`<div class="form-group"><label class="form-label">Character name</label><input id="roleName" class="field" placeholder="e.g., Nova" data-autofocus></div><div class="form-group"><label class="form-label">Character role</label><select class="select" id="roleType"><option>Protagonist</option><option>Supporting character</option><option>Antagonist</option><option>Guest character</option></select></div><div class="form-group"><label class="form-label">Description</label><textarea id="roleDesc" class="textarea" placeholder="Personality, appearance, goals and story arc"></textarea></div><div class="form-group"><label class="form-label">Example portrait</label><div class="chiprow">${[PH.woman,PH.man,PH.portrait,PH.man2].map((url,i)=>`<button class="chip" data-action="roleImage" data-url="${esc(url)}"><img src="${esc(url)}" width="42" height="42" style="object-fit:cover;border-radius:8px" alt="Portrait ${i+1}"></button>`).join('')}</div><div class="tiny muted mt-8" id="roleImgHint">Default image will be used if none is selected.</div></div>`;foot=`${btn('Cancel','closeModal','btn')}${btn(`${icon('plus',14)} Add role`,'saveRole','btn primary')}`;break}
case 'roleDetail':{const r=db.roles[data.index];title=r?.name||'Character';body=`<div class="grid-2">${imgTag(r?.image,'Character portrait','cover')}<div><div class="eyebrow">${esc(r?.role||'')}</div><h2 class="mt-12">${esc(r?.name||'')}</h2><p class="sm sub mt-16">${esc(r?.description||'')}</p>${pill('Active story role','green')}</div></div>`;break}
case 'createSkill':{title='Create a reusable skill';body=`<div class="form-group"><label class="form-label">Skill name</label><input id="skillName" class="field" placeholder="e.g., Dreamy Wedding Film Director" data-autofocus></div><div class="form-group"><label class="form-label">Category</label><select id="skillCategory" class="select"><option>Short films</option><option>Creative design</option><option>E-commerce</option><option>Social media</option></select></div><div class="form-group"><label class="form-label">When should this skill be used?</label><textarea id="skillDesc" class="textarea" placeholder="Describe the workflow, outputs and creative purpose..."></textarea></div><div class="hero-note">${icon('info',14)} Custom skills are stored locally; they are not executable AI plugins.</div>`;foot=`${btn('Cancel','closeModal','btn')}${btn('Create skill','saveSkill','btn primary')}`;break}
case 'skillDetail':{const s=[...SKILLS,...db.skillCreated].find(s=>s.id==data.id);if(!s){title='Skill unavailable';body='Not found.';break}title=s.name;body=`<div class="flex gap-12"><div class="skill-logo" style="width:65px;height:65px">${icon(s.icon,30)}</div><div><div class="eyebrow">${esc(s.category)}</div><h2 class="mt-8">${esc(s.name)}</h2><div class="tiny muted mt-8">By ${esc(s.creator)} · ${esc(s.uses)} uses</div></div></div><div class="setting-card"><h4>What it helps you create</h4><p class="sm sub mt-12">${esc(s.desc)}</p><div class="mt-16">${pill('Reusable workflow','violet')} ${pill('Local demo','blue')}</div></div>`;foot=`${btn('Close','closeModal','btn')}${btn(`${icon(db.skillsInstalled.includes(s.id)?'check':'plus',14)} ${db.skillsInstalled.includes(s.id)?'Installed':'Install skill'}`,'skillInstall','btn primary','data-id="'+s.id+'"')}`;break}
case 'historyDetail':{const t=db.history.find(x=>x.id==data.id);if(!t){title='Task not found';body='Missing task.';break}title='Creation task details';body=`<div class="flex gap-12"><div class="history-thumb" style="width:72px;height:72px">${t.image?imgTag(t.image,'',''):icon('file')}</div><div><h3>${esc(t.title)}</h3><p class="tiny muted mt-8">${esc(t.date)} · ${esc(t.model)}</p><div class="mt-8">${pill(t.status,t.status==='Completed'?'green':t.status==='Failed'?'pink':'orange')} ${pill(t.type,'violet')}</div></div></div>${t.image?`<div class="cover-wrap mt-16" style="max-height:285px">${imgTag(t.image,t.title,'cover')}</div>`:''}<div class="setting-card"><div class="between"><span class="sm sub">Credits</span><strong>${t.credits}</strong></div><div class="between mt-12"><span class="sm sub">Model</span><strong>${esc(t.model)}</strong></div><div class="between mt-12"><span class="sm sub">Status</span><strong>${esc(t.status)}</strong></div></div><div class="hero-note">${icon('info',14)} Example history entries are illustrative. New demo tasks are stored locally.</div>`;foot=`${btn(`${icon('trash',14)} Delete record`,'deleteHistory','btn danger','data-id="'+t.id+'"')}${btn('Close','closeModal','btn')}`;break}
case 'preview':{const o=state.genOutput;title='Full-size demo preview';wide=true;body=`<div style="background:#15161e;border-radius:16px;overflow:hidden;text-align:center;max-height:63vh">${o?.image?`<img src="${esc(o.image)}" alt="Example image" style="max-height:63vh;max-width:100%;object-fit:contain">`:empty('No preview yet','Run the demo generator first.')}</div><div class="tiny muted mt-12">Sample media only, not AI generated.</div>`;break}
case 'playDemo':{title='Cinematic preview';wide=true;body=`<div style="position:relative;aspect-ratio:16/8;overflow:hidden;border-radius:16px;background:#15161e"><img src="${esc(state.genOutput?.image||PH.castle)}" style="width:105%;height:105%;object-fit:cover;animation:float 8s linear infinite;filter:saturate(1.1)" alt="Motion sample"><div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,16,22,.7),transparent 60%);display:flex;align-items:end;padding:22px"><div style="color:#fff"><h3>Animated still demonstration</h3><p class="tiny" style="color:#eee">A motion-style preview, not a rendered video.</p></div></div></div>`;break}
case 'credits':{title='Credits & usage';body=`<div class="card card-pad" style="background:radial-gradient(70% 120% at 100% 0%,rgba(252,193,30,.18),transparent 70%),var(--g-text-t);border-color:rgba(252,193,30,.3)"><div class="eyebrow" style="color:var(--g-text-i)">Demo wallet</div><h1 class="mt-12 flex gap-12" style="font-size:52px;color:var(--ink)"><span class="coin lg">$</span>240 <span class="sm">demo points</span></h1><p class="sm sub mt-12">Points are an interface example only. No payment or billing is connected.</p></div><div class="setting-card"><div class="between"><span>Image sample</span><strong>0.03 example points</strong></div><div class="between mt-14"><span>Video sample</span><strong>15 example points</strong></div></div>`;foot=`${btn('Close','closeModal','btn')}${btn('View generation history','goFromModal','btn primary','data-page="history"')}`;break}
case 'editProfile':{title='Edit your profile';body=`<div class="form-group"><label class="form-label">Display name</label><input class="field" id="profileName" value="${esc(db.settings.name)}" data-autofocus></div><div class="form-group"><label class="form-label">Profile email</label><input class="field" id="profileEmail" type="email" value="${esc(db.settings.email)}"></div><div class="hero-note">${icon('info',14)} Changes affect only the local demo profile.</div>`;foot=`${btn('Cancel','closeModal','btn')}${btn('Save profile','saveProfile','btn primary')}`;break}
case 'nodeAdd':{title='Add to your canvas';body=`<p class="sm sub mb-14">Connect your ideas with flexible draggable cards.</p><div class="grid-2">${[['text','Story note','Write a plot point, concept or reminder.','file'],['image','Image reference','Add an atmospheric visual to your board.','image'],['prompt','AI prompt','Capture your creative direction.','sparkles'],['shot','Film shot','Plan a visual moment or camera movement.','film']].map(([type,l,desc,i])=>`<button class="sitemap-item" style="align-items:flex-start;flex-direction:column" data-action="addNode" data-type="${type}">${icon(i,21)}<strong>${l}</strong><span class="tiny muted">${desc}</span></button>`).join('')}</div>`;break}
case 'renameCanvas':{const c=db.canvases.find(c=>c.id==data.id);title='Rename your canvas';body=`<label class="form-label">Canvas name</label><input id="newCanvasName" class="field" value="${esc(c?.title||'New Canvas')}" data-autofocus>`;foot=`${btn('Cancel','closeModal','btn')}${btn('Save name','saveCanvasName','btn primary','data-id="'+data.id+'"')}`;break}
case 'confirmCanvasDelete':{const c=db.canvases.find(c=>c.id==data.id);title='Delete canvas?';body=`<p class="sm sub">Are you sure you want to delete <strong>${esc(c?.title||'this canvas')}</strong>? This removes the locally stored board and its nodes.</p>`;foot=`${btn('Cancel','closeModal','btn')}${btn('Delete canvas','confirmCanvasDelete','btn danger','data-id="'+data.id+'"')}`;break}
case 'confirmAssetDelete':{const a=db.assets.find(a=>a.id==data.id);title='Delete material?';body=`<p class="sm sub">Remove <strong>${esc(a?.title||'this material')}</strong> from your local library?</p>`;foot=`${btn('Cancel','closeModal','btn')}${btn('Delete material','confirmAssetDelete','btn danger','data-id="'+data.id+'"')}`;break}
case 'resetData':{title='Reset your workspace?';body='<p class="sm sub">This will reset local projects, canvases, skills, assets, preferences, and activity to the original example content. This cannot be undone.</p>';foot=`${btn('Cancel','closeModal','btn')}${btn('Reset demo','resetData','btn danger')}`;break}
case 'exportDemo':{title='Film export options';body=`<div class="hero-note mb-14">${icon('info',14)} Video rendering and downloadable film export require a real video backend. This is the interface design only.</div><div class="form-group"><label class="form-label">Output format</label><select class="select"><option>MP4 (H.264)</option><option>WebM</option></select></div><div class="form-group"><label class="form-label">Resolution</label><select class="select"><option>1080p</option><option>720p</option><option>4K</option></select></div>`;foot=btn('Close','closeModal','btn');break}
case 'agentDemo':{title='Canvas Agent';wide=true;body=`<div class="card card-pad" style="background:radial-gradient(70% 120% at 0% 0%,rgba(124,92,255,.3),transparent 70%),var(--g-agent-t);border-color:rgba(124,92,255,.3)"><div class="flex gap-12"><div class="stat-icon" style="width:70px;height:70px;border-radius:50%;background:var(--halo);color:#fff;box-shadow:inset 0 0 0 6px rgba(21,22,30,.18)">${icon('sparkles',29)}</div><div><div class="eyebrow" style="color:var(--g-agent-i)">AI canvas assistant</div><h2 class="mt-8">Ideas deserve a workspace.</h2><p class="sm sub mt-12">Use a canvas to arrange story concepts, asset references and production steps. AI orchestration would be connected to your chosen service.</p></div></div></div><div class="grid-2 mt-16"><button class="sitemap-item" data-action="agentNewCanvas">${icon('plus',21)} Create a canvas with sample nodes ${icon('arrow',16)}</button><button class="sitemap-item" data-action="goFromModal" data-page="canvases">${icon('folder',21)} Open existing canvases ${icon('arrow',16)}</button></div>`;break}
case 'homeFilters':{title='Browse inspiration';body=`<p class="sub sm mb-14">Choose a creative theme to explore visually rich concepts.</p><div class="chiprow">${['all','image','video'].map(t=>`<button class="chip ${state.homeFilter===t?'active':''}" data-action="homeFilter" data-filter="${t}">${t==='all'?'All':t==='image'?'Pictures':'Videos'}</button>`).join('')}</div>`;break}
case 'shotDetail':{const d=demos.find(d=>d.id==data.id)||demos[0];title='Storyboard shot details';wide=true;body=`<div class="grid-2"><div>${cover(d.image,'Cinematic shot')}</div><div><div class="eyebrow">Camera & art direction</div><h2 class="mt-12">${esc(d.title)}</h2><p class="sm sub mt-12">${esc(d.description)}</p><div class="setting-card"><div class="between"><span class="sm sub">Shot type</span>${pill('Medium / wide')}</div><div class="between mt-12"><span class="sm sub">Lens</span><strong>35 mm</strong></div><div class="between mt-12"><span class="sm sub">Timing</span><strong>6 seconds</strong></div><div class="between mt-12"><span class="sm sub">Lighting</span><strong>Natural cinematic</strong></div></div>${btn(`${icon('video',15)} Develop shot`,'shotToVideo','btn primary','data-id="'+d.id+'"')}</div></div>`;break}
default:{title='Prototype notice';body='<p class="sm sub">This dialog is an illustrative part of the one-file interface.</p>';foot=btn('Close','closeModal','btn')}
}return{title,body,foot,wide,drawer}}
function renderPopover(){const root=document.getElementById('popoverRoot');if(!state.popover){root.innerHTML='';return}const isProfile=state.popover==='profile';root.innerHTML=`<div style="position:fixed;inset:0;z-index:99" data-action="closePopover"></div><div class="popover" style="top:91px;right:18px">${isProfile?`<div class="flex gap-10" style="padding:6px 9px 15px"><div class="avatar">${esc(db.settings.name[0]||'A')}</div><div><strong>${esc(db.settings.name)}</strong><div class="tiny muted mt-8">${esc(db.settings.email)}</div></div></div><div class="storage-box"><div class="tiny muted">Available demo points</div><div class="between mt-8"><strong style="font:700 28px var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:8px"><span class="coin">$</span>240</strong><button class="btn sm" data-action="openModal" data-modal="credits">View ${icon('arrow',12)}</button></div></div><button class="pop-item" data-action="navigate" data-page="settings">${icon('settings',17)} Account & Settings ${icon('external',13)}</button><button class="pop-item" data-action="openModal" data-modal="sitemap">${icon('grid',17)} All screens</button><button class="pop-item" data-action="demoLogout" style="color:var(--danger-i)">${icon('logout',17)} Log out (demo)</button>`:`<div class="between mb-14"><strong>Notifications</strong>${pill('2 new','violet')}</div><div class="pop-item">${icon('circleCheck',18)}<div><strong class="sm">Your workspace is ready</strong><p class="tiny muted">Everything is ready to explore.</p></div></div><div class="pop-item">${icon('sparkles',18)}<div><strong class="sm">New creative idea</strong><p class="tiny muted">Try the cinematic workflows.</p></div></div><button class="btn sm block" data-action="closePopover">Mark as viewed</button>`}</div>`}
function mainMarkup(){switch(state.page){case 'home':return renderHome();case 'projects':return renderProjects();case 'project':return renderProject();case 'canvases':return renderCanvases();case 'canvasEditor':return renderCanvasEditor();case 'image':return renderGenerator('image');case 'video':return renderGenerator('video');case 'skills':return renderSkills();case 'assets':return renderAssets();case 'history':return renderHistory();case 'settings':return renderSettings();default:return renderHome()}}
function renderMain(keepCanvasScroll=false){const el=document.getElementById('main');const oldStage=document.getElementById('canvasStage');const prev=keepCanvasScroll&&oldStage?{x:oldStage.scrollLeft,y:oldStage.scrollTop}:null;el.innerHTML=mainMarkup();const newStage=document.getElementById('canvasStage');if(newStage&&prev){newStage.scrollLeft=prev.x;newStage.scrollTop=prev.y}}
function renderAll(){document.body.classList.toggle('day',db.settings.theme==='day');document.body.classList.toggle('is-canvas',state.page==='canvasEditor');document.body.classList.toggle('menu-open',state.mobileMenu);renderSidebar();renderTopbar();renderMain();renderModal();renderPopover()}
function navigate(page){state.page=page;state.modal=null;state.popover=null;state.mobileMenu=false;state.canvasSelectedNode=null;if(['image','video'].includes(page)){state.genMode=page;state.genTool='Direct prompt'}if(page==='canvasEditor'){state.canvasZoom=1}renderAll();window.scrollTo({top:0,behavior:'instant'})}
function rerenderWithFocus(field,modal=false){const focus=document.activeElement;const start=typeof focus.selectionStart==='number'?focus.selectionStart:0;const end=typeof focus.selectionEnd==='number'?focus.selectionEnd:0;let y=window.scrollY;if(modal){renderModal()}else{renderMain()}const next=document.querySelector(`${modal?'#modalRoot':'#main'} [data-bind="${CSS.escape(field)}"]`);if(next){next.focus({preventScroll:true});try{next.setSelectionRange(start,end)}catch(e){}}window.scrollTo(0,y)}
function pickSampleImage(text=''){const s=text.toLowerCase();if(/forest|tree|nature/.test(s))return PH.forest;if(/city|urban|building|neon/.test(s))return PH.city;if(/sea|ocean|beach|water/.test(s))return PH.sea;if(/castle|fantasy|medieval/.test(s))return PH.castle;if(/portrait|model|woman|face/.test(s))return PH.portrait;if(/space|planet|star/.test(s))return PH.space;if(/mountain|peak/.test(s))return PH.mountain;if(/product|fashion|clothing/.test(s))return PH.model;return [PH.fantasy,PH.woman,PH.lake,PH.city2,PH.flower][Math.floor(Math.random()*5)]}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Copied to clipboard.')}catch(e){toast('Copy is not available in this browser.','error')}el.remove()}
function exportJSON(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function nextId(array){return Math.max(0,...array.map(a=>Number(a.id)||0))+1}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function dateNow(){return new Date().toLocaleString('en-US',{month:'short',day:'numeric'})}
function switchProjectTab(tab){state.projectTab=tab;renderMain();window.scrollTo({top:0,behavior:'smooth'})}
function makeProject(fromPrompt=false){const id=nextId(db.projects);const title=fromPrompt?state.projectPrompt.trim().split(/[.!?]/)[0].slice(0,43)||'Untitled short film':'Untitled Film '+id;const p={id,title,genre:'Drama • Original',style:state.storyStyle,status:'Preparing story',image:fromPrompt?pickSampleImage(title+' '+state.projectPrompt):PH.fantasy,chapters:5,progress:10,created:dateNow(),description:fromPrompt?state.projectPrompt.slice(0,135):'Add a captivating story premise and create visual scenes.'};db.projects.unshift(p);state.selectedProject=id;state.projectTab='chapters';state.chapter=0;save();navigate('project');toast('New film project added to your workspace.')}
function newCanvas(title='Untitled Canvas',nodes=[]){const id=nextId(db.canvases);const c={id,title,kind:'Free Canvas',nodes,modified:'Just now'};db.canvases.unshift(c);state.canvasId=id;state.canvasSelectedNode=null;save();navigate('canvasEditor');toast('Canvas created. Add nodes to get started.')}
function addCanvasNode(type){const c=currentCanvas();if(!c)return;const id=nextId(c.nodes||[]);const count=c.nodes.length;const n={id,type,x:220+(count%4)*320,y:205+Math.floor(count/4)*245,text:type==='shot'?'Establishing shot: visual direction and camera movement':type==='prompt'?'Describe the image, mood, lighting, and art direction.':type==='image'?'Visual reference image':'New thought. Click to edit this note.'};if(type==='image')n.image=[PH.forest,PH.city,PH.portrait,PH.lake,PH.castle][count%5];c.nodes.push(n);state.canvasSelectedNode=id;c.modified='Just now';save();closeModal();renderMain(true);toast('New node added. Drag its header to reposition.')}
function updatedLines(){const c=currentCanvas();const lines=document.getElementById('nodeLines');if(lines&&c)lines.innerHTML=canvasConnections(c.nodes||[])}
function startDemoGeneration(){if(!state.genPrompt.trim()&&!state.genRefs.length){toast('Add a creative prompt or a reference image first.','error');return}const type=state.page==='video'?'video':'image';const id=nextId(db.history),media=state.genRefs[0]?.url||pickSampleImage(state.genPrompt);state.loading=true;const task={id,title:state.genPrompt.trim().slice(0,57)||'Reference-guided creative preview',type:type==='video'?'Video':'Image',status:'Running',model:type==='video'?'CineFlow 2.5':'Aurora Image 2.5',date:'Just now',image:media,credits:0};db.history.unshift(task);save();renderMain();setTimeout(()=>{task.status='Completed';task.credits=type==='video'?15:0.03;state.genOutput={image:media,title:task.title,type};state.loading=false;save();if(state.page===type)renderMain();toast('Demo preview ready — sample media displayed.')},1250)}
function addDemoShot(){const p=db.projects.find(p=>p.id===state.selectedProject);if(p){p.progress=Math.min(95,(p.progress||0)+2);save()}toast('Added a concept shot to your demo production.');renderMain()}
async function compressedImage(file,maxWidth=840){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,maxWidth/im.width);const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.75))};im.onerror=reject;im.src=reader.result};reader.readAsDataURL(file)})}
function addAssetRecord(item){db.assets.unshift({id:nextId(db.assets),date:dateNow(),...item});save()}
function dataExport(){exportJSON({exportedAt:new Date().toISOString(),product:'Halo Studio front-end prototype',data:db},'halo-studio-workspace.json')}
function handleAction(action,data,e){const id=Number(data.id);switch(action){
case 'navigate':navigate(data.page);break;
case 'dismissBanner':document.querySelector('#announcement').style.display='none';document.querySelector('.sidebar').style.top='0';document.querySelector('.workspace').style.paddingTop='0';document.querySelector('.topbar').style.top='0';break;
case 'mobileMenu':state.mobileMenu=!state.mobileMenu;document.body.classList.toggle('menu-open',state.mobileMenu);break;
case 'toggleTheme':db.settings.theme=db.settings.theme==='day'?'night':'day';save();renderAll();break;
case 'toggleProfile':state.popover=state.popover==='profile'?null:'profile';renderPopover();break;
case 'toggleNotification':state.popover=state.popover==='notification'?null:'notification';renderPopover();break;
case 'closePopover':state.popover=null;renderPopover();break;
case 'openModal':openModal(data.modal);break;
case 'closeModal':closeModal();break;
case 'goFromModal':navigate(data.page);break;
case 'goProjectTab':state.selectedProject=db.projects[0].id;state.projectTab=data.tab;navigate('project');break;
case 'setMode':state.mode=data.mode;renderMain();break;
case 'cycleHomeRatio':{const rs=['16:9','9:16','1:1','4:3'];state.genRatio=rs[(rs.indexOf(state.genRatio)+1)%rs.length];renderMain();break}
case 'homeGenerate':{if(state.mode==='agent'){openModal('agentDemo');break}if(state.mode==='text'){state.projectPrompt=state.homePrompt;navigate('projects');toast('Your story idea is ready in Short Film Projects.');break}state.genPrompt=state.homePrompt;navigate(state.mode);break}
case 'homeFilter':state.homeFilter=data.filter;closeModal();renderMain();break;
case 'toggleHomeFilter':openModal('homeFilters');break;
case 'openInspiration':openModal('inspiration',{id});break;
case 'toggleFavorite':{const n=db.favorites.indexOf(id);n<0?db.favorites.push(id):db.favorites.splice(n,1);save();if(state.modal==='inspiration')renderModal();else renderMain();toast(n<0?'Saved to favorites.':'Removed from favorites.');break}
case 'useInspiration':{const d=demos.find(d=>d.id===id);if(d){state.genPrompt=d.description+' Professional lighting and cinematic art direction.';navigate(d.type==='video'?'video':'image')}break}
case 'saveInspiration':{const name=val('inspireTitle'),desc=val('inspireDesc');if(!name||!desc){toast('Add a title and description first.','error');break}const d={id:nextId(demos),title:name,description:desc,type:val('inspireType')||'image',category:'My ideas',image:pickSampleImage(desc)};demos.unshift(d);state.homeFilter='all';navigate('home');toast('Your inspiration was added to the gallery.');break}
case 'newProject':makeProject(false);break;
case 'generateProject':if(!state.projectPrompt.trim()){toast('Describe your film premise before generating a project.','error');break}makeProject(true);break;
case 'toggleStorySettings':state.chapterSettingsOpen=!state.chapterSettingsOpen;renderMain();break;
case 'cycleStoryModel':{const models=['Story Reasoner','Grok 4.7','Claude Creative','Gemini Studio'];state.storyModel=models[(models.indexOf(state.storyModel)+1)%models.length];renderMain();break}
case 'chooseStyle':state.storyStyle=data.style;closeModal();renderMain();toast('Visual style set to '+data.style);break;
case 'openProject':state.selectedProject=id;state.projectTab='overview';state.chapter=0;navigate('project');break;
case 'projectTab':switchProjectTab(data.tab);break;
case 'openChapter':state.chapter=Number(data.index);switchProjectTab('chapters');break;
case 'selectChapter':state.chapter=Number(data.index);renderMain();break;
case 'saveChapter':save();toast('Chapter saved locally.');break;
case 'addChapter':{const p=db.projects.find(p=>p.id===state.selectedProject);if(p){p.chapters=Math.min(32,p.chapters+1);state.chapter=p.chapters-1;save();renderMain();toast('Chapter added.')}break}
case 'chapterAssets':toast('Asset extraction requires an AI backend. Add roles and assets manually in this prototype.');state.projectTab='roles';renderMain();break;
case 'formatText':{const t=document.getElementById('chapterEditor');if(t){const s=t.selectionStart,z=t.selectionEnd,text=t.value.slice(s,z),replacement=data.format==='upper'?text.toUpperCase():data.format==='lower'?text.toLowerCase():data.format==='bold'?`**${text}**`:data.format==='italic'?`*${text}*`:`_${text}_`;t.setRangeText(replacement,s,z,'select');db.chapters[`${state.selectedProject}:${state.chapter}`]=t.value;save();t.focus()}break}
case 'addShot':addDemoShot();break;
case 'shotDetail':openModal('shotDetail',{id});break;
case 'shotToVideo':{const d=demos.find(x=>x.id===id);state.genPrompt=(d?.description||'Cinematic shot')+' Smooth camera movement and natural dynamic motion.';navigate('video');break}
case 'previewFilm':openModal('playDemo');break;
case 'openRole':openModal('roleDetail',{index:Number(data.index)});break;
case 'roleImage':state.projectRoleDraft.image=data.url;document.getElementById('roleImgHint').textContent='Selected image reference.';break;
case 'saveRole':{const n=val('roleName');if(!n){toast('Enter a character name.','error');break}db.roles.push({name:n,role:val('roleType'),description:val('roleDesc')||'New creative character.',image:state.projectRoleDraft.image||PH.portrait});state.projectRoleDraft={};save();closeModal();renderMain();toast('Role added to the project.');break}
case 'saveProjectSetup':{const p=db.projects.find(p=>p.id===state.selectedProject);if(!p)break;p.title=val('projectTitle')||p.title;p.genre=val('projectGenre')||p.genre;p.description=val('projectDescription')||p.description;p.style=val('projectStyle')||p.style;save();renderAll();toast('Project settings saved.');break}
case 'newCanvas':newCanvas();break;
case 'openCanvas':state.canvasId=id;state.canvasSelectedNode=null;navigate('canvasEditor');break;
case 'canvasFilter':state.canvasFilter=data.filter;renderMain();break;
case 'renameCanvas':openModal('renameCanvas',{id});break;
case 'saveCanvasName':{const c=db.canvases.find(c=>c.id===id);if(c){c.title=val('newCanvasName')||c.title;c.modified='Just now';save();closeModal();renderAll();toast('Canvas renamed.')}break}
case 'deleteCanvas':openModal('confirmCanvasDelete',{id});break;
case 'confirmCanvasDelete':db.canvases=db.canvases.filter(c=>c.id!==id);save();navigate('canvases');toast('Canvas deleted.');break;
case 'canvasRail':{const tool=data.tool;state.canvasTool=tool;if(tool==='add'){openModal('nodeAdd')}else if(tool==='history'){navigate('history')}else if(['image','text','shot'].includes(tool)){addCanvasNode(tool)}else renderMain(true);break}
case 'addNode':addCanvasNode(data.type);break;
case 'selectNode':state.canvasSelectedNode=id;renderMain(true);break;
case 'unselectNode':state.canvasSelectedNode=null;renderMain(true);break;
case 'duplicateNode':{const c=currentCanvas();const n=c.nodes.find(n=>n.id===id);if(n){const clone={...n,id:nextId(c.nodes),x:n.x+45,y:n.y+70};c.nodes.push(clone);state.canvasSelectedNode=clone.id;save();renderMain(true)}break}
case 'deleteNode':{const c=currentCanvas();c.nodes=c.nodes.filter(n=>n.id!==id);state.canvasSelectedNode=null;save();renderMain(true);toast('Node deleted.');break}
case 'canvasZoomIn':state.canvasZoom=Math.min(1.7,Math.round((state.canvasZoom+.1)*10)/10);renderMain(true);break;
case 'canvasZoomOut':state.canvasZoom=Math.max(.5,Math.round((state.canvasZoom-.1)*10)/10);renderMain(true);break;
case 'canvasFit':state.canvasZoom=1;renderMain(true);break;
case 'canvasSave':save();toast('Canvas saved locally.');break;
case 'agentNewCanvas':newCanvas('Agent Story Blueprint',[{id:1,type:'prompt',x:190,y:170,text:state.homePrompt||'Describe your creative story idea.'},{id:2,type:'image',x:560,y:210,text:'Cinematic atmosphere reference',image:PH.city},{id:3,type:'shot',x:930,y:190,text:'Opening shot and core narrative direction.'}]);break;
case 'chooseTool':state.genTool=data.name;closeModal();renderMain();break;
case 'modalFilter':state.modalFilter=data.filter;renderModal();break;
case 'genRatio':state.genRatio=data.ratio;renderMain();break;
case 'genLength':state.genLength=data.length;renderMain();break;
case 'genClarity':state.genClarity=data.value;renderMain();break;
case 'genResolution':state.genResolution=data.value;renderMain();break;
case 'genCount':state.genCount=Number(data.value);renderMain();break;
case 'samplePrompt':state.genPrompt=state.page==='video'?'A lone traveler walks through a misty forest at dawn. Smooth steady tracking shot, natural movement, dappled cinematic light and atmospheric depth.':'An editorial portrait of a creative woman, golden-hour window lighting, natural expressive gaze, cinematic 50mm lens, realistic detailed skin texture, refined composition.';renderMain();break;
case 'clearRefs':state.genRefs=[];renderMain();break;
case 'removeRef':state.genRefs.splice(Number(data.index),1);renderMain();break;
case 'startGeneration':startDemoGeneration();break;
case 'copyGenPrompt':copyText(state.genPrompt);break;
case 'playDemo':openModal('playDemo');break;
case 'skillCategory':state.skillCategory=data.category;renderMain();break;
case 'skillView':state.skillView=data.view;renderMain();break;
case 'skillInstall':{const idx=db.skillsInstalled.indexOf(id);idx<0?db.skillsInstalled.push(id):db.skillsInstalled.splice(idx,1);save();if(state.modal==='skillDetail')renderModal();renderMain();toast(idx<0?'Skill added to library.':'Skill removed from library.');break}
case 'skillDetail':openModal('skillDetail',{id});break;
case 'saveSkill':{const n=val('skillName');if(!n){toast('A skill name is required.','error');break}const iid=nextId([...SKILLS,...db.skillCreated]);db.skillCreated.push({id:iid,name:n,desc:val('skillDesc')||'A customizable creative workflow.',category:val('skillCategory')||'Creative design',icon:'sparkles',uses:'0',creator:db.settings.name});db.skillsInstalled.push(iid);save();state.skillView='created';state.skillCategory='All skills';closeModal();renderMain();toast('Custom skill added to your library.');break}
case 'assetType':state.assetType=data.type;renderMain();break;
case 'assetGroup':state.assetGroup=data.group;renderMain();break;
case 'openAsset':openModal('assetDetail',{id});break;
case 'selectAsset':{const pos=state.assetSelected.indexOf(id);pos>=0?state.assetSelected.splice(pos,1):state.assetSelected.push(id);renderMain();break}
case 'toggleBatch':state.assetBatch=!state.assetBatch;state.assetSelected=[];renderMain();break;
case 'deleteSelectedAssets':if(!state.assetSelected.length){toast('Select at least one item.','error');break}db.assets=db.assets.filter(a=>!state.assetSelected.includes(a.id));state.assetSelected=[];state.assetBatch=false;save();renderMain();toast('Selected materials deleted.');break;
case 'saveMaterial':{const title=val('assetNewTitle'),typ=val('assetNewType'),url=val('assetNewUrl');if(!title){toast('Please enter a material title.','error');break}addAssetRecord({title,type:typ,group:val('assetNewGroup'),image:state.assetUploadData||(/^(https?:\/\/)/.test(url)?url:''),desc:val('assetNewDesc')||'Reference material.',tags:val('assetNewTags')});state.assetUploadData='';closeModal();renderMain();toast('Material added to your library.');break}
case 'copyAsset':{const a=db.assets.find(a=>a.id===id);if(a)copyText(`${a.title}\n${a.desc}\n${a.tags}`);break}
case 'askDeleteAsset':openModal('confirmAssetDelete',{id});break;
case 'confirmAssetDelete':db.assets=db.assets.filter(a=>a.id!==id);save();navigate('assets');toast('Material removed.');break;
case 'historyFilter':state.historyFilter=data.filter;renderMain();break;
case 'historyLayout':state.historyLayout=data.layout;renderMain();break;
case 'historyDetail':openModal('historyDetail',{id});break;
case 'deleteHistory':db.history=db.history.filter(h=>h.id!==id);save();closeModal();renderMain();toast('History record removed.');break;
case 'settingsTab':state.settingsTab=data.tab;renderMain();break;
case 'toggleSetting':db.settings[data.setting]=!db.settings[data.setting];save();renderMain();break;
case 'saveProfile':{const name=val('profileName'),email=val('profileEmail');if(!name||!/^\S+@\S+\.\S+$/.test(email)){toast('Enter a name and valid email.','error');break}db.settings.name=name;db.settings.email=email;save();closeModal();renderAll();toast('Local profile updated.');break}
case 'refreshSettings':renderMain();toast('Local settings refreshed.');break;
case 'demoAuth':toast('Authentication and email verification need a secure backend connection.','error');break;
case 'demoLogout':state.popover=null;renderPopover();toast('This is a single-user static demo. No login session exists.');break;
case 'exportData':dataExport();toast('Workspace JSON downloaded.');break;
case 'exportDiagnostics':exportJSON({generatedAt:new Date().toISOString(),browser:navigator.userAgent,storageAvailable:storageAvailable(),page:state.page,projects:db.projects.length,canvases:db.canvases.length,assets:db.assets.length},'halo-studio-diagnostics.json');toast('Diagnostics downloaded.');break;
case 'resetData':db=defaultDB();save();state.modal=null;navigate('home');toast('Demo reset to starter content.');break;
case 'copyText':copyText(data.value||'');break;
case 'triggerUpload':{const input=document.getElementById(data.upload);if(input)input.click();else toast('Upload input is not available on this screen.','error');break}
default:toast('This UI component is ready for backend integration.');break;
}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target){if(target.matches('button')&&target.disabled)return;e.preventDefault();e.stopPropagation();handleAction(target.dataset.action,target.dataset,e);return}if(state.page==='canvasEditor'){const node=e.target.closest('[data-node-id]');if(node){const id=Number(node.dataset.nodeId);if(state.canvasSelectedNode!==id){state.canvasSelectedNode=id;renderMain(true)}return}}});
document.addEventListener('input',e=>{const input=e.target;if(input.hasAttribute('data-bind')){const field=input.dataset.bind;state[field]=input.value;if(['homeSearch','projectSearch','canvasSearch','assetSearch','historySearch','skillSearch','modalSearch'].includes(field))rerenderWithFocus(field,field==='modalSearch')}else if(input.hasAttribute('data-node-text')){const c=currentCanvas(),n=c?.nodes.find(n=>n.id===Number(input.dataset.nodeText));if(n){n.text=input.value;save();const target=document.querySelector(`.node-card[data-node-id="${n.id}"] .node-card__body`);if(target)target.textContent=n.text}}else if(input.hasAttribute('data-node-image')){const c=currentCanvas(),n=c?.nodes.find(n=>n.id===Number(input.dataset.nodeImage));if(n){n.image=input.value;save()}}else if(input.matches('[data-chapter-text]')){db.chapters[`${state.selectedProject}:${state.chapter}`]=input.value;if(db.settings.autosave)save()}});
document.addEventListener('change',async e=>{const el=e.target;if(el.hasAttribute('data-setting')){db.settings[el.dataset.setting]=el.value;save();toast('Preference saved.')}if(el.hasAttribute('data-model-select'))state.genModel=el.value;if(el.type!=='file'||!el.files?.length)return;const id=el.id;try{if(id==='genRefInput'||id==='homeRef'){for(const file of Array.from(el.files).slice(0,8)){if(!file.type.startsWith('image/'))continue;const img=await compressedImage(file,450);state.genRefs.push({name:file.name,url:img})}toast(`${el.files.length} reference file(s) added.`);if(id==='genRefInput')renderMain()}else if(id==='materialUpload'){state.assetUploadData=await compressedImage(el.files[0]);renderModal();toast('Material cover loaded.')}else if(id==='assetQuickUpload'){const file=el.files[0];addAssetRecord({title:file.name.replace(/\.[^.]+$/,''),type:'image',group:'Material',image:await compressedImage(file),desc:'Uploaded local image reference.',tags:'upload'});renderMain();toast('Image added to your library.')}else if(id==='novelUpload'){const file=el.files[0];if(/\.(txt|md)$/i.test(file.name)){state.projectPrompt=(await file.text()).slice(0,4000);renderMain();toast('Story text imported. Review the premise and create a project.')}else toast('For .doc or .docx files, use a connected document parser. Plain text is supported in this static demo.','error')}else if(id==='canvasImport'){const file=el.files[0];const raw=await file.text();let nodes=[];try{const json=JSON.parse(raw);if(Array.isArray(json.nodes))nodes=json.nodes.map((n,i)=>({...n,id:i+1,x:Number(n.x)||180+i*310,y:Number(n.y)||180}))}catch(ex){nodes=[{id:1,type:'text',x:230,y:210,text:raw.slice(0,1200)}]}newCanvas(file.name.replace(/\.[^.]+$/,'')||'Imported canvas',nodes)}}catch(err){console.error(err);toast('Could not process this file. Try a smaller image or text file.','error')}el.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.popover){state.popover=null;renderPopover()}else if(state.mobileMenu){state.mobileMenu=false;document.body.classList.remove('menu-open')}return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('command')}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!state.modal){e.preventDefault();openModal('command')}});
let drag=null;document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag-node]');if(!h||state.page!=='canvasEditor')return;const card=h.closest('[data-node-id]');if(!card)return;const id=Number(card.dataset.nodeId);const c=currentCanvas(),node=c.nodes.find(n=>n.id===id);if(!node)return;e.preventDefault();state.canvasSelectedNode=id;document.querySelectorAll('.node-card').forEach(c=>c.classList.toggle('selected',c===card));drag={node,card,startX:e.clientX,startY:e.clientY,originalX:node.x,originalY:node.y,moved:false};h.style.cursor='grabbing'});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.startX)/state.canvasZoom,dy=(e.clientY-drag.startY)/state.canvasZoom;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;drag.node.x=Math.max(10,Math.round(drag.originalX+dx));drag.node.y=Math.max(10,Math.round(drag.originalY+dy));drag.card.style.left=drag.node.x+'px';drag.card.style.top=drag.node.y+'px';updatedLines()});
document.addEventListener('pointerup',e=>{if(!drag)return;drag=null;const c=currentCanvas();if(c)c.modified='Just now';save();renderMain(true)});
renderAll();
</script>
