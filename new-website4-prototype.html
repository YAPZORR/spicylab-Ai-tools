<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090c25">
<title>Halo Studio — Creative Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Halo Studio — "Nebula" theme
   Palette taken from Dialog.svg: night navy, periwinkle text,
   sky / iris / orchid / pink light, coin gold.
   Media colors: orchid = image, sky = video, gold = story/text,
   iris = agent & skills. Mint is reserved for success status.
   ========================================================== */
:root{
  --display:'Bricolage Grotesque','Geist',system-ui,sans-serif;
  --ui:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --vh:100vh;

  /* palette (from the SVG) */
  --night:#090c25;--deep:#06081a;--navy:#141838;--navy-2:#0b0e24;
  --peri:#aab4f0;--peri-2:#96a0e1;--white:#f5f6fc;
  --sky:#38bdf8;--iris:#7c5cff;--orchid:#e23fd6;--pinkc:#f256ab;--gold:#fcc11e;--mint:#3ee0b0;--rose:#ff5c8a;

  /* night surfaces (default) */
  --page:#090c25;--side:#06081a;--panel:#11143a;--elev:#161a45;
  --card-bg:linear-gradient(180deg,#151940 0%,#0d1030 100%);
  --ink:#f5f6fc;--sub:#aab4f0;--muted:#7c84b8;
  --line:rgba(150,160,225,.15);--line-strong:rgba(150,160,225,.3);--soft:rgba(150,160,225,.07);--hover:rgba(150,160,225,.12);

  /* media gels */
  --g-image:#e23fd6;--g-image-t:rgba(226,63,214,.16);--g-image-i:#f59bef;
  --g-video:#38bdf8;--g-video-t:rgba(56,189,248,.15);--g-video-i:#8fdcfc;
  --g-text:#fcc11e;--g-text-t:rgba(252,193,30,.14);--g-text-i:#ffd351;
  --g-agent:#7c5cff;--g-agent-t:rgba(124,92,255,.2);--g-agent-i:#c4b5fd;

  /* legacy names used by the app's templates */
  --brand:#8b6bff;--brand-tint:rgba(124,92,255,.2);--brand-ink:#c4b5fd;--brand2:#7c5cff;
  --pink:#f256ab;--pink-t:rgba(242,86,171,.16);--pink-i:#ff9ccb;
  --orange:#fcc11e;--violet:#7c5cff;--cyan:#38bdf8;
  --green:#3ee0b0;--mint-t:rgba(62,224,176,.14);--mint-i:#7cf0cc;
  --danger-t:rgba(255,92,138,.15);--danger-i:#ff8fae;

  /* signature gradients from the dialog */
  --grad-cta:linear-gradient(90deg,#e04bd8,#e23f8f);
  --grad-violet:linear-gradient(90deg,#8b6bff,#6a3ff0);
  --grad-crypto:linear-gradient(90deg,#845dfc,#f256ab);
  --grad-check:linear-gradient(135deg,#6a46fb,#9a3ff5 35%,#cf33e6 70%,#ee2fd6);
  --grad-guide:linear-gradient(90deg,#2d9bf0,#7c5cff 55%,#d946ef);
  --spectrum:linear-gradient(90deg,#38bdf8,#7c5cff 50%,#e23fd6);
  --grad-text:linear-gradient(90deg,#a880ff,#e040e6);
  --grad:var(--spectrum);
  --halo:conic-gradient(from 200deg,#38bdf8,#7c5cff 22%,#e23fd6 45%,#f256ab 62%,#fcc11e 80%,#38bdf8);

  --cta-glow:0 10px 28px -10px rgba(226,63,214,.75);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-md:0 18px 40px -18px rgba(3,4,20,.9),0 0 0 1px rgba(150,160,225,.06);
  --shadow-lg:0 40px 90px -20px rgba(3,4,20,.95),0 0 0 1px rgba(150,160,225,.12);
  --glow-select:0 0 0 3px rgba(226,63,214,.28),0 0 26px -2px rgba(226,63,214,.45);
  --radius:20px;
  --dot:rgba(150,160,225,.22);--checker:rgba(150,160,225,.06);--node-link:#a880ff;
  color-scheme:dark;
}
.day{
  --page:#f4f5fd;--panel:#ffffff;--elev:#ffffff;
  --card-bg:#ffffff;
  --ink:#141838;--sub:#4b5180;--muted:#858bb3;
  --line:#e2e5f5;--line-strong:#cbd0ec;--soft:#f0f1fb;--hover:#e8eaf8;
  --g-image-t:#fdeafb;--g-image-i:#b1229f;
  --g-video-t:#e3f5fe;--g-video-i:#0a78ad;
  --g-text-t:#fff6d9;--g-text-i:#946400;
  --g-agent-t:#efebff;--g-agent-i:#5a3ee0;
  --brand:#6a46fb;--brand-tint:#efebff;--brand-ink:#5a3ee0;
  --pink-t:#ffeaf4;--pink-i:#c22a79;
  --mint-t:#dcf8ef;--mint-i:#0a8a64;
  --danger-t:#ffe9ef;--danger-i:#d42a5b;
  --shadow:0 1px 2px rgba(20,24,56,.05);
  --shadow-md:0 18px 36px -18px rgba(40,30,120,.28),0 0 0 1px rgba(20,24,56,.03);
  --shadow-lg:0 40px 80px -24px rgba(30,20,90,.4),0 0 0 1px rgba(20,24,56,.06);
  --dot:#cfd3ea;--checker:#e9ebf7;--node-link:#7c5cff;
  color-scheme:light;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;font-family:var(--ui);background:var(--page);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--orchid);outline-offset:2px}
a{color:inherit;text-decoration:none}
input,select,textarea{outline:none}
select option{background:var(--elev);color:var(--ink)}
textarea{resize:vertical}
strong,b{font-weight:600}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.15}
h1{font-size:36px;line-height:1.05;letter-spacing:-.035em}
h2{font-size:24px}h3{font-size:18px}h4{font-size:15px;letter-spacing:-.015em}
p{line-height:1.55}
.muted{color:var(--muted)}.sub{color:var(--sub)}
.tiny{font-size:12px}.sm{font-size:13px}.bold{font-weight:650}
.nowrap{white-space:nowrap}.ellipsis{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.flex{display:flex;align-items:center}.between{display:flex;align-items:center;justify-content:space-between}.center{display:flex;align-items:center;justify-content:center}
.gap-6{gap:6px}.gap-7{gap:7px}.gap-8{gap:8px}.gap-9{gap:9px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-14{gap:14px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-14{margin-top:14px}.mt-16{margin-top:16px}.mt-22{margin-top:22px}.mt-28{margin-top:28px}.mb-14{margin-bottom:14px}
.w-full{width:100%}.text-right{text-align:right}.text-center{text-align:center}.hide{display:none!important}
.ico{flex-shrink:0;display:inline-block;width:18px;height:18px;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:15px;height:15px}.i-lg{width:23px;height:23px}

/* coin (from the dialog) */
.coin{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#ffe58a,#fcc11e 48%,#d08b00 100%);color:#8a5200;font:800 10px/1 var(--ui);box-shadow:inset 0 -1.5px 0 rgba(120,70,0,.35),0 0 12px rgba(252,193,30,.4)}
.coin.lg{width:30px;height:30px;font-size:15px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:0;border-radius:999px;background:var(--soft);font-family:var(--ui);font-size:12px;font-weight:550;color:var(--sub);white-space:nowrap;vertical-align:middle;box-shadow:inset 0 0 0 1px var(--line)}
.pill.violet{background:var(--g-agent-t);color:var(--g-agent-i);box-shadow:none}
.pill.blue{background:var(--g-video-t);color:var(--g-video-i);box-shadow:none}
.pill.pink{background:var(--g-image-t);color:var(--g-image-i);box-shadow:none}
.pill.green{background:var(--mint-t);color:var(--mint-i);box-shadow:none}
.pill.orange{background:var(--g-text-t);color:var(--g-text-i);box-shadow:none}
.pill.hot{background:var(--grad-check);color:#fff;box-shadow:0 4px 14px -4px rgba(226,63,214,.6)}

/* ---------- buttons ---------- */
.btn{position:relative;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:9px 15px;display:inline-flex;justify-content:center;align-items:center;gap:8px;font-weight:550;font-size:13.5px;color:var(--ink);transition:background .15s,border-color .15s,box-shadow .2s,color .15s,transform .15s;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--line-strong);background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad-cta);border-color:transparent;color:#fff;font-weight:600;box-shadow:var(--cta-glow)}
.btn.primary:hover{background:linear-gradient(90deg,#ee5ae6,#f04a9e);box-shadow:0 14px 34px -10px rgba(226,63,214,.95);transform:translateY(-1px)}
.btn.secondary{background:var(--grad-violet);color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px rgba(106,63,240,.9)}
.btn.secondary:hover{background:linear-gradient(90deg,#9a7dff,#7a52ff);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger-i);background:var(--danger-t);border-color:transparent}
.btn.danger:hover{border-color:color-mix(in srgb,var(--rose) 45%,transparent)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:12.5px;border-radius:10px}
.btn.lg{padding:12px 22px;min-height:46px;font-size:15px}
.btn.circle{padding:0;width:38px;height:38px;min-height:38px;border-radius:12px}
.btn.block{width:100%}
.btn-icon{padding:7px!important;min-width:34px;min-height:34px}
.link{color:var(--brand-ink);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- surfaces & forms ---------- */
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong) 20%,var(--line-strong) 80%,transparent);margin:20px 0}
.caption{font-size:12px;font-weight:600;color:var(--muted)}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--g-agent-i)}
.form-label{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.field,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 13px;color:var(--ink);min-height:42px;font-size:14px;transition:border-color .15s,box-shadow .2s,background .15s}
.field:hover,.select:hover,.textarea:hover{border-color:var(--line-strong)}
.field:focus,.select:focus,.textarea:focus{border-color:var(--iris);background:var(--panel);box-shadow:0 0 0 4px rgba(124,92,255,.22)}
.field::placeholder,.textarea::placeholder{color:var(--muted)}
.textarea{min-height:96px;line-height:1.6}
.form-group{margin-bottom:18px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--sub);transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--line-strong);color:var(--ink);background:var(--hover)}
.chip.active{background:var(--grad-check);color:#fff;border-color:transparent;box-shadow:0 6px 18px -8px rgba(226,63,214,.8)}
.input-wrap{position:relative}
.input-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-wrap input{padding-left:39px}
.k-badge{background:var(--soft);color:var(--muted);padding:2px 7px;border-radius:7px;font-size:11.5px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.gradient-text{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.color-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--grad-check);color:#fff;font-weight:700;font-family:var(--display);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.progress-track{height:6px;background:var(--hover);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:var(--spectrum);border-radius:20px;transition:width .35s;box-shadow:0 0 12px rgba(124,92,255,.6)}
.skeleton{background:linear-gradient(110deg,var(--soft) 20%,var(--hover) 40%,var(--soft) 60%);background-size:200% 100%;animation:shimmer 2s linear infinite}
@keyframes shimmer{to{background-position-x:-200%}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{50%{transform:scale(1.09);opacity:.7}}
@keyframes drift{from{background-position:0 0}to{background-position:80px 40px}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}

/* ---------- shell ---------- */
.announcement{height:30px;background:var(--grad-check);color:#fff;display:flex;justify-content:center;align-items:center;font-size:12px;font-weight:550;position:fixed;top:0;left:0;right:0;z-index:80}
.announcement span{opacity:.75!important}
.announcement button{background:transparent;border:0;color:#fff;padding:2px 9px;position:absolute;right:12px;top:3px;font-size:16px;line-height:1;border-radius:6px}
.announcement button:hover{background:rgba(255,255,255,.18)}
.sidebar{--ink:#f5f6fc;--sub:#aab4f0;--muted:#6f78ad;--line:rgba(150,160,225,.12);--line-strong:rgba(150,160,225,.24);--soft:rgba(150,160,225,.07);--hover:rgba(150,160,225,.1);--panel:#141838;
  position:fixed;left:0;top:30px;bottom:0;width:248px;background:radial-gradient(120% 40% at 0% 0%,rgba(112,60,255,.22),transparent 60%),var(--side);color:var(--ink);z-index:60;display:flex;flex-direction:column;transition:transform .25s;border-right:1px solid rgba(150,160,225,.1)}
.brand{display:flex;align-items:center;gap:12px;height:76px;padding:0 22px}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--halo);position:relative;flex:none;box-shadow:0 0 24px rgba(226,63,214,.55)}
.brand-mark::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--side)}
.brand-mark .ico{display:none}
.brand-name{font:700 20px/1 var(--display);letter-spacing:-.04em;color:#fff}
.brand-name .brand-thin{font-weight:500;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:12px;color:var(--muted);margin-top:4px}
.side-nav{padding:6px 12px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:rgba(150,160,225,.18) transparent}
.nav-section-title{font-size:12px;font-weight:500;color:var(--muted);padding:18px 12px 7px}
.nav-item{position:relative;width:100%;height:38px;background:none;border:0;display:flex;align-items:center;gap:12px;text-align:left;padding:0 12px;border-radius:11px;font-weight:500;font-size:13.5px;color:var(--sub);margin-bottom:2px;transition:background .15s,color .15s}
.nav-item:hover{background:var(--hover);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(124,92,255,.42),rgba(226,63,214,.16));color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(196,181,253,.22)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad-check)}
.nav-item.active .nav-icon{color:#f0abfc}
.nav-item .nav-icon{width:18px;display:flex}
.nav-item .nav-trailing{margin-left:auto}
.nav-item .nav-trailing.badge-count{font-size:11.5px;font-weight:600;color:var(--sub);background:rgba(150,160,225,.12);border-radius:999px;padding:1px 8px}
.nav-item.active .nav-trailing.badge-count{background:rgba(255,255,255,.16);color:#fff}
.side-bottom{padding:14px 14px 18px;border-top:1px solid var(--line)}
.storage-box{border-radius:14px;background:linear-gradient(180deg,rgba(124,92,255,.14),rgba(124,92,255,.04));padding:12px 14px;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(150,160,225,.1)}
.sidebar .progress-track{background:rgba(150,160,225,.14)}
.side-account{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer}
.side-account:hover{background:var(--hover)!important}
.workspace{margin-left:248px;padding-top:30px;min-height:var(--vh)}
.topbar{height:64px;position:sticky;top:30px;background:color-mix(in srgb,var(--page) 78%,transparent);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--line);z-index:40;display:flex;align-items:center;padding:0 clamp(18px,3vw,40px);gap:16px}
.breadcrumb{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted)}
.breadcrumb strong{font-size:13.5px;color:var(--ink);font-weight:600}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.search-trigger{border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;background:var(--soft);min-width:260px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;text-align:left;transition:border-color .15s,background .15s}
.search-trigger:hover{border-color:var(--line-strong);background:var(--hover)}
.search-trigger .k-badge{margin-left:auto}
.credit-chip{position:relative;padding:6px 12px 6px 7px;border-radius:999px;background:linear-gradient(90deg,rgba(252,193,30,.16),rgba(252,193,30,.06));border:1px solid rgba(252,193,30,.35);color:var(--g-text-i);font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;margin:0 4px;transition:box-shadow .2s,border-color .2s}
.credit-chip strong{font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink)}
.credit-chip:hover{border-color:rgba(252,193,30,.7);box-shadow:0 0 20px -4px rgba(252,193,30,.55)}
.dot-notif{position:absolute;right:9px;top:8px;width:8px;height:8px;background:var(--pinkc);border:2px solid var(--page);border-radius:50%;box-shadow:0 0 8px var(--pinkc)}
.burger{display:none}

/* ---------- page scaffolding ---------- */
.page{padding:30px clamp(18px,3vw,40px) 64px;max-width:1660px;margin:0 auto;animation:in .25s ease}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-heading p{color:var(--sub);margin-top:8px;font-size:15px;max-width:62ch}
.page-heading h1{font-size:38px}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:40px 0 16px}
.section-heading h2{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-heading p{font-size:14px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{padding:20px;position:relative;overflow:hidden}
.stat-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--g-agent-t);color:var(--g-agent-i);flex:none}
.stat-num{font:700 30px var(--display);letter-spacing:-.03em;margin-top:12px}
.stat-name{font-size:12.5px;color:var(--muted)}
.stats-grid .stat-card:nth-child(1) .stat-icon{background:var(--grad-check);color:#fff}
.stats-grid .stat-card:nth-child(2) .stat-icon{background:var(--mint-t);color:var(--mint-i)}
.stats-grid .stat-card:nth-child(3) .stat-icon{background:var(--g-video-t);color:var(--g-video-i)}
.stats-grid .stat-card:nth-child(4) .stat-icon{background:var(--danger-t);color:var(--danger-i)}
.stat-icon.gel-image{background:var(--g-image-t);color:var(--g-image-i)}
.stat-icon.gel-video{background:var(--g-video-t);color:var(--g-video-i)}

/* ---------- home: the nebula stage ---------- */
.hero{position:relative;background:#0a0d2b;color:#fff;min-height:390px;border-radius:28px;overflow:hidden;padding:48px 48px 40px;isolation:isolate;border:1px solid rgba(150,160,225,.16)}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:
  radial-gradient(42% 75% at 6% -5%,rgba(112,60,255,.6),transparent 70%),
  radial-gradient(38% 70% at 62% -10%,rgba(232,60,210,.38),transparent 70%),
  radial-gradient(22% 35% at 46% 42%,rgba(252,193,30,.1),transparent 70%),
  radial-gradient(55% 60% at 35% 125%,rgba(150,50,230,.42),transparent 70%)}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background:
  radial-gradient(1.5px 1.5px at 12% 22%,rgba(255,255,255,.8),transparent 100%),
  radial-gradient(1px 1px at 28% 78%,rgba(255,255,255,.6),transparent 100%),
  radial-gradient(1.5px 1.5px at 52% 14%,rgba(255,255,255,.7),transparent 100%),
  radial-gradient(1px 1px at 64% 66%,rgba(255,255,255,.5),transparent 100%),
  radial-gradient(1.5px 1.5px at 41% 58%,rgba(255,255,255,.55),transparent 100%),
  radial-gradient(1px 1px at 88% 88%,rgba(255,255,255,.6),transparent 100%),
  radial-gradient(1px 1px at 7% 64%,rgba(255,255,255,.5),transparent 100%)}
.hero-halo{position:absolute;z-index:-1;width:540px;aspect-ratio:1;right:-70px;top:50%;margin-top:-290px;pointer-events:none}
.hero-halo::before,.hero-halo::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--halo);animation:spin 60s linear infinite}
.hero-halo::before{-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 30px),#000 calc(100% - 29px));mask:radial-gradient(closest-side,transparent calc(100% - 30px),#000 calc(100% - 29px))}
.hero-halo::after{inset:-20px;filter:blur(48px);opacity:.8;-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 90px),#000 calc(100% - 60px));mask:radial-gradient(closest-side,transparent calc(100% - 90px),#000 calc(100% - 60px))}
.hero-halo span{position:absolute;inset:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,92,255,.16),transparent 75%)}
.hero-coin{position:absolute;z-index:-1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#fcc11e 48%,#c67a00);box-shadow:0 0 30px rgba(252,193,30,.55);animation:bob 7s ease-in-out infinite;pointer-events:none}
.hero-coin.c1{width:22px;height:22px;left:44%;top:16%;filter:blur(.5px)}
.hero-coin.c2{width:14px;height:14px;left:62%;top:74%;filter:blur(1.5px);opacity:.75;animation-delay:-3s}
.hero-bg-mark{display:none}
.hero .eyebrow{display:none}
.hero .hero-title{max-width:640px;font:800 54px/1 var(--display);letter-spacing:-.045em;margin:0 0 14px;color:#f5f6fc}
.hero .hero-desc{color:#aab4f0;font-size:16px;line-height:1.5;max-width:46ch}
.hero-composer{--mc:var(--g-image);--mt:var(--g-image-t);--mi:var(--g-image-i);position:relative;z-index:1;margin-top:30px;max-width:780px;background:rgba(10,13,40,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#f5f6fc;border:1px solid rgba(150,160,225,.22);border-radius:22px;padding:12px;box-shadow:0 30px 70px -25px rgba(0,0,0,.9);transition:border-color .2s,box-shadow .25s}
.day .hero-composer{--line:rgba(150,160,225,.15);--line-strong:rgba(150,160,225,.3);--soft:rgba(150,160,225,.07);--hover:rgba(150,160,225,.12);--ink:#f5f6fc;--sub:#aab4f0;--muted:#7c84b8;--panel:#161a45;--g-image-t:rgba(226,63,214,.16);--g-image-i:#f59bef;--g-video-t:rgba(56,189,248,.15);--g-video-i:#8fdcfc;--g-text-t:rgba(252,193,30,.14);--g-text-i:#ffd351;--g-agent-t:rgba(124,92,255,.2);--g-agent-i:#c4b5fd}
.hero-composer[data-mode=image]{--mc:var(--g-image);--mt:var(--g-image-t);--mi:var(--g-image-i)}
.hero-composer[data-mode=video]{--mc:var(--g-video);--mt:var(--g-video-t);--mi:var(--g-video-i)}
.hero-composer[data-mode=text]{--mc:var(--g-text);--mt:var(--g-text-t);--mi:var(--g-text-i)}
.hero-composer[data-mode=agent]{--mc:var(--g-agent);--mt:var(--g-agent-t);--mi:var(--g-agent-i)}
.hero-composer:focus-within{border-color:var(--mc);box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 28%,transparent),0 0 50px -10px var(--mc),0 30px 70px -25px rgba(0,0,0,.9)}
.mode-switch{display:flex;gap:4px;background:rgba(150,160,225,.08);padding:4px;border-radius:13px;width:fit-content;margin-bottom:6px}
.mode-switch button{border:0;background:transparent;padding:7px 13px 7px 11px;border-radius:10px;font-size:13px;font-weight:550;display:flex;align-items:center;gap:7px;color:#aab4f0;transition:background .15s,color .15s,box-shadow .2s}
.mode-switch button:hover{color:#fff;background:rgba(150,160,225,.08)}
.mode-switch button[data-mode=image]{--g:var(--g-image);--gt:var(--g-image-t)}
.mode-switch button[data-mode=video]{--g:var(--g-video);--gt:var(--g-video-t)}
.mode-switch button[data-mode=text]{--g:var(--g-text);--gt:var(--g-text-t)}
.mode-switch button[data-mode=agent]{--g:var(--g-agent);--gt:var(--g-agent-t)}
.mode-switch button .ico{color:var(--g)}
.mode-switch button.active{background:var(--gt);color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g) 55%,transparent),0 0 18px -6px var(--g)}
.hero-textarea{border:0;background:transparent;width:100%;min-height:64px;resize:vertical;color:#f5f6fc;padding:10px 8px;font-size:16px;line-height:1.5}
.hero-textarea::placeholder{color:#7c84b8}
.composer-bottom{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.composer-bottom .btn{--ink:#f5f6fc}
.composer-bottom .btn.primary{margin-left:auto;padding:10px 18px;min-height:42px;border-radius:13px;font-size:14px}
.composer-bottom .tiny.muted{color:#7c84b8}
.mode-pill{background:var(--mt)!important;color:var(--mi)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mc) 35%,transparent)!important;padding:6px 11px}
.mode-pill .ico{color:var(--mc)}

.action-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 0}
.action-tile{--g:var(--g-agent);--gt:var(--g-agent-t);--gi:var(--g-agent-i);position:relative;overflow:hidden;padding:18px;border:1px solid var(--line);background:var(--card-bg);border-radius:20px;text-align:left;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s,box-shadow .25s,transform .2s}
.action-tile:nth-child(1){--g:var(--g-video);--gt:var(--g-video-t);--gi:var(--g-video-i)}
.action-tile:nth-child(2){--g:var(--g-image);--gt:var(--g-image-t);--gi:var(--g-image-i)}
.action-tile:nth-child(3){--g:var(--g-text);--gt:var(--g-text-t);--gi:var(--g-text-i)}
.action-tile:nth-child(4){--g:var(--g-agent);--gt:var(--g-agent-t);--gi:var(--g-agent-i)}
.action-tile::after{content:'';position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(closest-side,var(--g),transparent);opacity:.12;transition:opacity .25s}
.action-tile .tile-icon{flex:none;width:42px;height:42px;border-radius:13px;background:var(--gt);color:var(--gi);display:grid;place-items:center;transition:background .2s,color .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.action-tile:hover{border-color:color-mix(in srgb,var(--g) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--g) 30%,transparent),0 18px 40px -18px var(--g);transform:translateY(-2px)}
.action-tile:hover::after{opacity:.35}
.action-tile:hover .tile-icon{background:var(--g);color:#0a0d2b;transform:rotate(-8deg) scale(1.06)}
.action-tile strong{font-size:14.5px;font-weight:600;display:block;margin:2px 0 4px}
.action-tile p{color:var(--muted);font-size:12.5px;line-height:1.45}

.recent-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.recent-tile{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:72px;transition:border-color .2s,box-shadow .2s;text-align:left;min-width:0}
.recent-tile:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.recent-tile:first-child{border-style:dashed;border-color:var(--line-strong);background:transparent}
.recent-tile:first-child:hover{border-color:var(--orchid);background:var(--g-image-t)}
.recent-tile:first-child .recent-icon{background:var(--grad-check);color:#fff!important;box-shadow:0 8px 20px -8px rgba(226,63,214,.8)}
.recent-icon{width:50px;height:50px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--muted)}
.recent-icon img{width:100%;height:100%;object-fit:cover}
.recent-tile strong{display:block;font-size:13.5px;font-weight:600}
.recent-tile small{color:var(--muted);font-size:12px}

.toolbar-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tabs{background:var(--soft);padding:4px;display:flex;border-radius:12px;gap:2px;width:fit-content;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button{padding:7px 14px;border-radius:9px;border:0;background:transparent;font-size:13px;font-weight:550;color:var(--sub);white-space:nowrap;transition:color .15s,background .15s}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button.active{background:var(--grad-violet);color:#fff;box-shadow:0 6px 16px -8px rgba(106,63,240,.9)}
.tabs button.active .muted{color:rgba(255,255,255,.7)}
.tabs button .muted{font-weight:500;margin-left:2px}

/* ---------- media / covers ---------- */
.media-card{border:1px solid var(--line);background:var(--card-bg);border-radius:20px;overflow:hidden;transition:border-color .2s,box-shadow .25s,transform .2s;text-align:left;cursor:pointer;min-width:0}
.media-card:hover{border-color:rgba(196,181,253,.45);box-shadow:0 22px 44px -20px rgba(124,92,255,.75);transform:translateY(-3px)}
.cover{width:100%;aspect-ratio:1.48;object-fit:cover;display:block;background:var(--soft)}
.cover-wrap{position:relative;overflow:hidden;border-radius:14px;background:var(--soft)}
.media-card .cover-wrap{border-radius:0}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.media-card:hover .cover-wrap img,.project-card:hover .cover-wrap img,.canvas-list-card:hover img,.asset-card:hover .cover-wrap img{transform:scale(1.06)}
.media-content{padding:14px 15px 15px}
.media-content h4{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-content p{font-size:12.5px;color:var(--muted);margin:5px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.media-content .between .ico{transition:transform .2s,color .2s}
.media-card:hover .media-content .between .ico{transform:translateX(3px);color:var(--orchid)}
.cover-tag{position:absolute;left:10px;bottom:10px;border-radius:999px;padding:4px 10px 4px 8px;color:#fff;background:rgba(6,8,26,.6);font-size:11.5px;font-weight:550;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.cover-tag.is-image .ico,.cover-tag.t-image .ico{color:#f59bef}
.cover-tag.is-video .ico,.cover-tag.t-video .ico{color:#8fdcfc}
.cover-tag.t-text .ico{color:#ffd351}
.cover-tag.t-audio .ico{color:#c4b5fd}
.cover-action{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(6,8,26,.55);backdrop-filter:blur(8px);color:#fff!important;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.cover-action:hover{transform:scale(1.12);background:rgba(242,86,171,.55)}
.cover-action.is-fav{background:var(--grad-cta);box-shadow:0 0 16px rgba(242,86,171,.7)}
.cover-action.is-fav .ico{fill:currentColor}

/* ---------- projects ---------- */
.story-composer{padding:22px;border-radius:24px;background:radial-gradient(60% 120% at 100% 0%,rgba(252,193,30,.1),transparent 60%),var(--card-bg);border:1px solid var(--line);position:relative;overflow:hidden}
.story-composer::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#ffd351,#fcc11e,#d08b00)}
.story-composer .stat-icon{background:var(--g-text-t);color:var(--g-text-i)}
.story-composer .textarea{background:var(--soft);min-height:96px}
.story-settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.project-card{border:1px solid var(--line);border-radius:22px;background:var(--card-bg);padding:8px;cursor:pointer;transition:border-color .2s,box-shadow .25s,transform .2s}
.project-card:hover{border-color:rgba(196,181,253,.45);box-shadow:0 22px 44px -20px rgba(124,92,255,.75);transform:translateY(-3px)}
.project-card .cover-wrap{aspect-ratio:1.7;border-radius:15px}
.project-card .project-body{padding:12px 8px 8px}
.project-card h3{font-size:18px;margin:6px 0 4px}
.project-card p{font-size:12.5px;color:var(--muted);line-height:1.5;min-height:38px}
.project-card .cover-tag{background:rgba(6,8,26,.65);color:#fff}
.project-card .eyebrow{font-size:12px!important;color:var(--sub)}
.project-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.project-top h2{font-size:30px;letter-spacing:-.035em}
.project-tabs{display:flex;gap:4px;align-items:center;overflow:auto;padding:5px;background:var(--card-bg);border:1px solid var(--line);border-radius:16px;max-width:100%;scrollbar-width:none}
.project-tabs button{white-space:nowrap;border:0;border-radius:11px;background:transparent;color:var(--sub);padding:9px 14px;font-size:13px;font-weight:550;transition:background .15s,color .15s}
.project-tabs button:hover{background:var(--hover);color:var(--ink)}
.project-tabs button.active{background:var(--grad-violet);color:#fff;box-shadow:0 8px 20px -10px rgba(106,63,240,.9)}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pipeline-step{border:1px solid var(--line);background:var(--card-bg);border-radius:18px;padding:16px 14px;position:relative;min-height:150px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .2s,transform .2s}
.pipeline-step:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.pipeline-step .step-icon{width:36px;height:36px;background:var(--soft);color:var(--sub);border-radius:11px;display:grid;place-items:center;margin-bottom:16px}
.pipeline-step.complete{border-color:rgba(62,224,176,.35);background:radial-gradient(80% 60% at 0% 0%,rgba(62,224,176,.12),transparent 70%),var(--card-bg)}
.pipeline-step.complete .step-icon{color:#06281f;background:var(--mint);box-shadow:0 0 18px -4px var(--mint)}
.pipeline-step h4{font-size:14px;margin-bottom:4px}
.pipeline-step p{font-size:12px;color:var(--muted);line-height:1.5}
.chapter-row{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:14px 8px;cursor:pointer;border-radius:10px}
.chapter-row:last-child{border:0}
.chapter-row:hover{background:var(--soft)}
.small-bar{height:4px;border-radius:20px;background:var(--hover);margin:7px 0}
.small-bar div{height:100%;border-radius:20px;background:var(--spectrum)}
.chapter-editor{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;min-height:660px}
.chapter-sidebar{border:1px solid var(--line);background:var(--card-bg);border-radius:20px;padding:12px;overflow:auto;max-height:calc(var(--vh)*.75)}
.chapter-select{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;text-align:left;border-radius:12px;padding:10px;font-size:13px;color:var(--sub);margin-bottom:3px}
.chapter-select:hover{background:var(--soft);color:var(--ink)}
.chapter-select.active{background:var(--g-text-t);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(252,193,30,.3)}
.chapter-select .number{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;font:700 12px var(--display)}
.chapter-select.active .number{background:var(--gold);color:#3b2600}
.chapter-paper{border:1px solid var(--line);border-radius:20px;background:var(--card-bg);padding:28px 32px;display:flex;flex-direction:column;min-width:0}
.chapter-paper .eyebrow{color:var(--g-text-i)}
.rich-toolbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:16px 0}
.rich-toolbar button{border:0;background:transparent;padding:5px 9px;border-radius:8px;color:var(--sub);font-weight:600}
.rich-toolbar button:hover{background:var(--hover);color:var(--ink)}
.editor-text{flex:1;width:100%;border:0;background:transparent;resize:none;min-height:410px;line-height:1.85;font-size:15.5px;color:var(--ink);max-width:72ch;font-family:var(--ui)}
.storyboard-card{padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--card-bg);cursor:pointer;transition:border-color .2s,box-shadow .25s}
.storyboard-card:hover{border-color:rgba(56,189,248,.5);box-shadow:0 18px 40px -20px rgba(56,189,248,.7)}
.storyboard-card .cover-wrap{aspect-ratio:1.75;border-radius:12px}
.role-card{display:flex;gap:14px;align-items:center;padding:14px;background:var(--card-bg);border:1px solid var(--line);border-radius:18px;transition:border-color .2s}
.role-card:hover{border-color:var(--line-strong)}
.role-card img{width:68px;height:78px;border-radius:12px;object-fit:cover}
.timeline{background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:20px;overflow-x:auto}
.time-ruler{display:flex;justify-content:space-between;gap:22px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:12px;min-width:740px;font-variant-numeric:tabular-nums}
.time-lane{display:flex;gap:6px;padding:12px 0;min-width:740px}
.time-clip{flex:1;height:84px;border-radius:10px;position:relative;overflow:hidden;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.time-clip:hover{border-color:var(--line-strong)}
.time-clip.active{border-color:var(--orchid);box-shadow:var(--glow-select)}
.time-clip img{width:100%;height:100%;object-fit:cover}
.time-clip span{position:absolute;bottom:0;left:0;right:0;color:#fff;font-size:11.5px;padding:6px 8px;background:linear-gradient(0deg,rgba(6,8,26,.85),transparent)}
.audio-lane{background:repeating-linear-gradient(90deg,rgba(252,193,30,.55) 0 3px,transparent 3px 7px) center/100% 46% no-repeat,var(--g-text-t);height:46px;border-radius:10px;display:flex;align-items:center;padding-left:14px;font-size:12.5px;font-weight:600;color:var(--g-text-i);min-width:740px}

/* ---------- studio lists ---------- */
.canvas-list-card,.asset-card{background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:8px;cursor:pointer;transition:border-color .2s,box-shadow .25s,transform .2s;min-width:0}
.canvas-list-card:hover,.asset-card:hover{border-color:rgba(196,181,253,.45);box-shadow:0 22px 44px -20px rgba(124,92,255,.75);transform:translateY(-3px)}
.canvas-list-card .cover-wrap{aspect-ratio:1.53}
.blank-preview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background-color:var(--soft);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:14px 14px;color:var(--muted);width:100%;height:100%;font-size:12px;text-transform:capitalize}
.blank-preview .ico{width:28px;height:28px}
.list-card-foot{padding:11px 6px 5px}
.list-card-foot h4{font-size:14.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-card-foot p{color:var(--muted);font-size:12px}
.asset-card .cover-wrap{aspect-ratio:1.22}
.asset-card .list-card-foot h4{font-size:13.5px}
.asset-filter-wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
.filter-panel{border:1px solid var(--line);border-radius:20px;background:var(--card-bg);padding:14px;height:fit-content;position:sticky;top:110px}
.filter-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;border:0;background:transparent;font-size:13.5px;text-align:left;color:var(--sub)}
.filter-item.active{background:linear-gradient(90deg,rgba(124,92,255,.4),rgba(226,63,214,.15));color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px rgba(196,181,253,.22)}
.day .filter-item.active,.day .settings-nav button.active{background:var(--grad-violet);color:#fff}
.filter-item.active .muted{color:inherit;opacity:.7}
.filter-item:not(.active):hover{background:var(--hover);color:var(--ink)}

/* ---------- generators ---------- */
.gen-layout{display:grid;grid-template-columns:minmax(300px,400px) minmax(340px,1fr) 270px;gap:16px;align-items:start}
.gen-panel{background:var(--card-bg);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0}
.gen-preview{min-height:620px;display:flex;flex-direction:column}
.gen-preview-body{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;border-radius:16px;background-color:var(--soft);background-image:conic-gradient(var(--checker) 25%,transparent 0 50%,var(--checker) 0 75%,transparent 0);background-size:22px 22px;overflow:hidden;min-height:440px}
.gen-preview-body::before{content:'';position:absolute;inset:0;background:radial-gradient(45% 45% at 50% 40%,rgba(124,92,255,.22),transparent 70%);pointer-events:none}
.gen-preview-body h3{color:var(--ink)!important;font-size:20px;position:relative}
.gen-preview-body p{position:relative}
.preview-spot{width:220px;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;border-radius:24px;background:var(--panel);box-shadow:0 0 60px -10px rgba(226,63,214,.5);position:relative;isolation:isolate}
.preview-spot::before{content:'';position:absolute;inset:-2px;border-radius:26px;background:var(--halo);z-index:-1}
.preview-spot::after{content:'';position:absolute;inset:0;border-radius:24px;background:var(--panel);z-index:-1}
.preview-spot .ico{width:52px;height:52px;color:var(--muted);stroke-width:1.4}
.preview-artwork{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.step-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 22px;font-size:13px}
.step-item{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:550}
.step-item span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line-strong);font:700 11px var(--display)}
.step-item.active{color:var(--ink)}
.step-item.active span{background:var(--grad-check);color:#fff;box-shadow:0 0 12px -2px rgba(226,63,214,.7)}
.step-line{flex:1;min-width:12px;height:1px;background:var(--line-strong)}
.preset-tool{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px;background:var(--soft);cursor:pointer;margin-bottom:10px;transition:box-shadow .15s,background .15s}
.preset-tool:hover{box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--hover)}
.tool-icon{width:38px;height:38px;border-radius:11px;background:var(--g-agent-t);color:var(--g-agent-i);display:grid;place-items:center;flex:none}
.upload-target{border:1.5px dashed var(--line-strong);border-radius:14px;background:transparent;display:grid;place-items:center;text-align:center;min-height:90px;cursor:pointer;color:var(--muted);font-size:13px;padding:12px;transition:border-color .15s,color .15s,background .15s}
.upload-target:hover{border-color:var(--sky);color:var(--g-video-i);background:var(--g-video-t)}
.ref-previews{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.ref-preview{width:56px;height:56px;border-radius:10px;background:var(--soft);overflow:hidden;position:relative}
.ref-preview img{width:100%;height:100%;object-fit:cover}
.ref-preview button{position:absolute;right:2px;top:2px;border:0;background:#fff;color:#141838;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;padding:0}
.task-mini{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer;transition:background .15s,border-color .15s}
.task-mini:hover{background:var(--hover);border-color:var(--line-strong)}
.task-mini-preview{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}
.task-mini-preview img{width:100%;height:100%;object-fit:cover}
.gen-panel .grid-2 .btn{font-size:13px!important;font-weight:550;padding:11px 12px!important;border-radius:12px}
.gen-panel .grid-2 .btn .ico{color:var(--muted)}
.gen-panel .grid-2 .btn:hover .ico{color:var(--orchid)}

/* ---------- skills ---------- */
.skills-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
.skill-card{background:var(--card-bg);padding:18px;border:1px solid var(--line);border-radius:20px;transition:border-color .2s,box-shadow .25s,transform .2s;min-width:0;display:flex;flex-direction:column}
.skill-card:hover{border-color:rgba(124,92,255,.6);box-shadow:0 20px 40px -20px rgba(124,92,255,.8);transform:translateY(-2px)}
.skill-logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--g-agent-t);color:var(--g-agent-i);flex:none}
.skill-card h4{font-size:15px;line-height:1.3}
.skill-card p{font-size:12.5px;color:var(--muted);margin:12px 0;min-height:56px;flex:1}
.skill-card .btn{width:100%}

/* ---------- history & settings ---------- */
.history-row{display:grid;grid-template-columns:50px minmax(0,1fr) 100px 100px 96px 36px;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.history-row:last-child{border-bottom:0}
.history-row:hover{background:var(--hover)}
.history-thumb{width:48px;height:48px;background:var(--soft);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.history-thumb img{width:100%;height:100%;object-fit:cover}
.settings-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.settings-nav{padding:10px}
.settings-nav button{width:100%;padding:11px 12px;background:transparent;border:0;border-radius:12px;display:flex;align-items:center;gap:11px;text-align:left;color:var(--sub);font-size:13.5px;font-weight:550}
.settings-nav button.active{background:linear-gradient(90deg,rgba(124,92,255,.4),rgba(226,63,214,.15));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(196,181,253,.22)}
.settings-nav button.active .ico{color:#f0abfc}
.settings-nav button:not(.active):hover{background:var(--hover);color:var(--ink)}
.settings-main{padding:26px}
.setting-card{border:1px solid var(--line);padding:20px;border-radius:18px;background:var(--soft);margin:16px 0}
.setting-choice{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:16px 0;gap:20px}
.setting-choice:last-child{border-bottom:0}
.toggle{width:42px;height:24px;border-radius:24px;border:0;background:var(--line-strong);position:relative;flex:none;transition:background .2s,box-shadow .2s}
.toggle:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s cubic-bezier(.3,1.5,.5,1)}
.toggle:hover{box-shadow:0 0 0 4px var(--hover)}
.toggle.on{background:var(--grad-check);box-shadow:0 0 14px -3px rgba(226,63,214,.7)}
.toggle.on:after{left:21px}

/* ---------- canvas editor ---------- */
.is-canvas .sidebar,.is-canvas .topbar{display:none}
.is-canvas .workspace{margin:0;padding-top:30px}
.canvas-screen{height:calc(var(--vh) - 30px);min-height:580px;position:relative;overflow:hidden;background-color:var(--page);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px),radial-gradient(50% 50% at 20% 10%,rgba(112,60,255,.18),transparent 70%),radial-gradient(40% 50% at 90% 90%,rgba(226,63,214,.12),transparent 70%);background-size:22px 22px,100% 100%,100% 100%}
.canvas-head{position:absolute;top:16px;left:18px;right:18px;z-index:9;display:flex;align-items:center;justify-content:space-between;pointer-events:none;gap:10px}
.canvas-head>*{pointer-events:auto}
.floating-card{background:color-mix(in srgb,var(--elev) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:4px;padding:5px}
.canvas-rail{position:absolute;top:88px;left:18px;display:flex;flex-direction:column;gap:2px;z-index:8;background:color-mix(in srgb,var(--elev) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--shadow-md)}
.canvas-rail button{width:40px;height:40px;background:transparent;border:0;border-radius:11px;display:grid;place-items:center;color:var(--sub);transition:background .15s,color .15s}
.canvas-rail button:hover{background:var(--hover);color:var(--ink)}
.canvas-rail button.active{color:#fff;background:var(--grad-check);box-shadow:0 6px 16px -6px rgba(226,63,214,.8)}
.canvas-bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10}
.canvas-zoom{position:absolute;bottom:20px;left:18px;z-index:10}
.canvas-stage{position:absolute;inset:0;overflow:auto;cursor:grab}
.node-layer{position:relative;width:2300px;height:1500px;transform-origin:0 0}
.node-lines{position:absolute;inset:0;width:2300px;height:1500px;pointer-events:none;overflow:visible}
.node-card{--g:var(--g-text);position:absolute;width:260px;min-height:140px;background:var(--card-bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md);overflow:visible;cursor:default;transition:border-color .2s,box-shadow .2s}
.node-card[data-type=image]{--g:var(--g-image)}
.node-card[data-type=shot]{--g:var(--g-video)}
.node-card[data-type=prompt]{--g:var(--g-agent)}
.node-card:hover{border-color:color-mix(in srgb,var(--g) 50%,transparent)}
.node-card.selected{border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 28%,transparent),0 0 30px -6px var(--g),var(--shadow-md)}
.node-card__head{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:grab;font-weight:600;font-size:13px;user-select:none;border-radius:16px 16px 0 0}
.node-card__head .node-ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--g);color:#0a0d2b;box-shadow:0 0 12px -2px var(--g)}
.node-card__head .node-ico .ico{width:14px;height:14px;stroke-width:2}
.node-card__body{padding:12px 13px;color:var(--sub);font-size:13px;line-height:1.55}
.node-card img{width:100%;height:150px;object-fit:cover;display:block}
.node-port{position:absolute;width:14px;height:14px;background:var(--page);border:3px solid var(--g);border-radius:50%;top:63px;z-index:2;box-shadow:0 0 10px -1px var(--g)}
.node-port.in{left:-8px}.node-port.out{right:-8px}
.node-inspector{position:absolute;right:18px;top:88px;width:290px;background:var(--elev);border:1px solid var(--line);border-radius:18px;z-index:9;padding:18px;box-shadow:var(--shadow-lg)}

/* ---------- modal, menus, drawer ---------- */
.modal-root{position:fixed;inset:0;z-index:110;pointer-events:none}
.modal-root.open{pointer-events:auto}
.modal-backdrop{position:absolute;inset:0;background:rgba(4,5,18,.68);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s}
.modal-dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:min(calc(var(--vh)*.88),1000px);display:flex;flex-direction:column;border-radius:26px;background:#0d1030;border:1px solid rgba(150,160,225,.2);box-shadow:var(--shadow-lg),0 0 80px -30px rgba(124,92,255,.6);overflow:hidden;animation:pop .25s cubic-bezier(.2,.9,.3,1.1);isolation:isolate}
.modal-dialog::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(45% 35% at 0% 0%,rgba(112,60,255,.35),transparent 70%),radial-gradient(40% 30% at 100% 0%,rgba(232,60,210,.22),transparent 70%)}
.day .modal-dialog{background:#fff;border-color:var(--line)}
.day .modal-dialog::before{opacity:.35}
.modal-dialog.wide{width:min(920px,calc(100% - 32px))}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{font-size:20px}
.modal-body{padding:22px;overflow:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:rgba(150,160,225,.04)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,calc(100% - 20px));overflow:auto;background:var(--elev);box-shadow:var(--shadow-lg);animation:in .2s}
.popover{position:fixed;z-index:100;background:var(--elev);box-shadow:var(--shadow-lg),0 0 60px -30px rgba(226,63,214,.6);border:1px solid var(--line-strong);border-radius:18px;width:300px;padding:10px;animation:in .18s}
.popover .storage-box strong{color:var(--ink)}
.pop-item{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px;text-align:left;border-radius:10px;color:var(--sub);font-weight:500;font-size:13.5px}
.pop-item:hover{background:var(--hover);color:var(--ink)}
.pop-item p{font-size:12px}
.toast-host{position:fixed;right:20px;bottom:20px;z-index:160;display:flex;flex-direction:column;gap:9px}
.toast{background:#161a45;color:#fff;box-shadow:var(--shadow-lg),0 0 30px -12px rgba(62,224,176,.6);border:1px solid rgba(150,160,225,.22);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13.5px;max-width:380px;animation:in .25s;transition:opacity .25s}
.toast .ico{color:var(--mint)}
.modal-tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tool-select-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--soft);text-align:left;min-height:132px;transition:border-color .15s,background .15s,box-shadow .2s}
.tool-select-card:hover{border-color:var(--iris);background:var(--g-agent-t);box-shadow:0 14px 30px -18px rgba(124,92,255,.9)}
.tool-select-card strong{font-size:14px;display:block;margin:10px 0 4px}
.tool-select-card p{font-size:12.5px;color:var(--muted)}
.style-option{overflow:hidden;border:2px solid transparent;border-radius:14px;cursor:pointer;background:var(--soft);transition:border-color .15s,box-shadow .2s}
.style-option:hover{border-color:var(--line-strong)}
.style-option.selected{border-color:var(--orchid);box-shadow:var(--glow-select)}
.style-option img{width:100%;aspect-ratio:1.7;object-fit:cover}
.style-option span{display:block;padding:8px 10px;font-size:13px;font-weight:600}
.sitemap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sitemap-item{border:1px solid var(--line);background:var(--soft);border-radius:14px;text-align:left;padding:14px;display:flex;align-items:center;gap:10px;min-height:66px;font-size:13.5px;font-weight:600;transition:border-color .15s,background .15s}
.sitemap-item:hover{background:var(--g-agent-t);border-color:rgba(124,92,255,.55)}
.sitemap-item .ico{color:var(--g-agent-i)}
.empty-state{padding:64px 20px;text-align:center;color:var(--muted)}
.empty-state .ico{width:44px;height:44px;margin-bottom:12px;color:var(--brand-ink)}
.empty-state h3{color:var(--ink);margin-bottom:6px}
.hero-note{padding:11px 14px;background:var(--g-agent-t);border:0;color:var(--g-agent-i);border-radius:12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;line-height:1.5;box-shadow:inset 0 0 0 1px rgba(124,92,255,.25)}
.hero-note .ico{margin-top:2px}
.modal-body h1 .sm{font-family:var(--ui);letter-spacing:0;font-weight:500;color:var(--sub);font-size:15px}

/* project overview progress ring */
.overview-focus{position:relative;overflow:hidden;background:radial-gradient(50% 80% at 100% 0%,rgba(226,63,214,.14),transparent 70%),var(--card-bg)!important}
.overview-focus h2{font-size:28px;letter-spacing:-.03em}
.overview-num{--p:0;width:118px;height:118px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;position:relative;background:conic-gradient(#38bdf8,#7c5cff calc(var(--p)*.45%),#e23fd6 calc(var(--p)*.8%),#f256ab calc(var(--p)*1%),var(--hover) 0);filter:drop-shadow(0 0 14px rgba(124,92,255,.45))}
.overview-num::after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
.overview-num b{position:relative;z-index:1;font:700 34px/1 var(--display);letter-spacing:-.04em}
.overview-num b span{font-size:16px;color:var(--muted);margin-left:1px}

/* ---------- responsive ---------- */
@media(max-width:1480px){
  .gen-layout{grid-template-columns:minmax(290px,360px) minmax(320px,1fr)}
  .gen-right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .gen-right>.gen-panel{min-width:0}
  .grid-5{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero-halo{width:480px;margin-top:-260px;right:-130px}
}
@media(max-width:1190px){
  .recent-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .action-strip{grid-template-columns:repeat(2,1fr)}
  .grid-4{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pipeline{grid-template-columns:repeat(3,1fr)}
  .search-trigger{min-width:170px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .hero .hero-title{font-size:46px}
  .hero-halo{opacity:.75}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-110%);box-shadow:var(--shadow-lg)}
  .menu-open .sidebar{transform:translateX(0)}
  .workspace{margin-left:0}
  .burger{display:inline-flex}
  .topbar{padding:0 16px}
  .page{padding:22px 18px 44px}
  .search-trigger{min-width:0;width:38px;justify-content:center;padding:8px}
  .search-trigger span,.search-trigger .k-badge{display:none}
  .hero{padding:34px 28px 28px}
  .hero-halo{width:380px;margin-top:0;top:-140px;right:-160px}
  .hero .hero-title{font-size:40px;max-width:480px}
  .grid-4,.grid-5{grid-template-columns:repeat(3,1fr)}
  .gen-layout{grid-template-columns:1fr 1fr}
  .gen-preview{min-height:520px}
  .gen-right{grid-column:1/-1}
  .chapter-editor{grid-template-columns:200px 1fr}
  .settings-layout{grid-template-columns:200px 1fr}
  .page-heading h1{font-size:32px}
}
@media(max-width:690px){
  .announcement{font-size:10.5px;padding:0 30px 0 8px;text-align:center}
  .announcement span{display:none}
  .topbar{gap:6px}
  .breadcrumb>.muted,.breadcrumb>.ico{display:none}
  .breadcrumb strong{max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .top-actions{gap:2px}
  .top-actions>.btn.circle{width:34px;height:34px;min-height:34px}
  .top-actions>.btn.circle[data-action=openModal]{display:none}
  .credit-chip{padding:5px 9px 5px 5px}
  .credit-chip .credit-text,.credit-chip>.ico{display:none}
  .page-heading{align-items:flex-start;flex-direction:column}
  .page-heading h1{font-size:28px}
  .page-heading p{font-size:14px}
  .hero{padding:26px 18px 18px;border-radius:24px;min-height:0}
  .hero-halo{width:260px;top:-110px;right:-120px}
  .hero-coin.c1{left:70%;top:40%}
  .hero .hero-title{font-size:34px;max-width:300px}
  .hero .hero-desc{font-size:14.5px;max-width:300px}
  .hero-composer{margin-top:22px;border-radius:18px}
  .mode-switch{width:100%;overflow:auto}
  .mode-switch button{padding:7px 10px;flex:none}
  .composer-bottom .btn.primary{margin-left:0;width:100%}
  .composer-bottom .tiny.muted{display:none}
  .grid-2,.grid-3,.grid-4,.grid-5,.stats-grid,.action-strip,.recent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .action-tile{padding:12px;flex-direction:column;gap:10px}
  .action-tile .tile-icon{width:36px;height:36px}
  .action-tile p{display:none}
  .recent-tile{padding:7px;gap:9px}
  .recent-icon{width:40px;height:40px}
  .section-heading{align-items:flex-start;flex-direction:column}
  .gen-layout,.gen-right,.skills-layout,.asset-filter-wrap,.settings-layout,.chapter-editor{grid-template-columns:1fr}
  .gen-preview{min-height:460px}
  .gen-preview-body{min-height:310px}
  .filter-panel{display:none}
  .settings-main{padding:16px}
  .settings-nav{display:flex;overflow:auto;gap:4px}
  .settings-nav button{width:auto;white-space:nowrap;padding:10px}
  .pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .project-tabs{width:100%}
  .project-top{flex-wrap:wrap;align-items:flex-start}
  .project-top>.flex{min-width:0;flex:1 1 100%}
  .project-top .flex.gap-8{flex-wrap:wrap}
  .project-top h2{font-size:24px}
  .overview-focus>.between{flex-direction:column-reverse;align-items:flex-start;gap:12px}
  .overview-focus>.between>.text-center{padding:0!important;display:flex;align-items:center;gap:12px}
  .overview-num{width:76px;height:76px;margin:0}
  .overview-num::after{inset:7px}
  .overview-num b{font-size:22px}
  .overview-focus h2{font-size:24px}
  .history-row{grid-template-columns:42px minmax(0,1fr) 70px;padding:12px}
  .history-row>*:nth-child(3),.history-row>*:nth-child(5){display:none}
  .modal-tool-grid,.sitemap-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .canvas-head{left:10px;right:10px}
  .canvas-rail,.canvas-zoom{left:10px}
  .node-inspector{right:8px;width:250px}
  .grid-4 .project-card:nth-child(n+5){display:none}
  .chapter-paper{padding:20px}
}
@media(max-width:420px){

function renderFilm(p){const clips=demos.slice(0,5);return `${headingSmall('Film Assembly','Arrange your shots on a timeline, polish pacing, and prepare the final edit.',btn(`${icon('download',14)} Export options`,'openModal','btn sm','data-modal="exportDemo"'))}<div class="card card-pad"><div class="flex gap-8 mb-14">${pill('Sequence 01','violet')}${pill('16:9 | 1080p')}${pill('Draft edit','orange')}</div><div style="border-radius:15px;overflow:hidden;background:#15161e;aspect-ratio:16/7.7;max-height:440px;display:flex;justify-content:center;align-items:center;position:relative">${imgTag(p.image,'Film preview','preview-artwork')}<div style="position:absolute;inset:0;background:rgba(15,16,22,.4);display:grid;place-items:center"><button class="btn circle" style="width:56px;height:56px" data-action="previewFilm">${icon('play',23)}</button></div><span style="position:absolute;bottom:16px;left:18px;color:white;font-size:11px">${esc(p.title)} · Preview concept</span></div><div class="between mt-16"><div class="flex gap-9"><button class="btn circle" data-action="previewFilm">${icon('play')}</button><span class="tiny muted">00:00 / 00:30</span></div><div>${btn(`${icon('sliders',14)} Edit settings`,'openModal','btn sm','data-modal="exportDemo"')}</div></div></div><div class="section-heading"><div><h2>Editable timeline</h2><p>Select a clip to inspect its storyboard.</p></div>${btn(`${icon('plus',14)} Add scene`,'addShot','btn sm')}</div><div class="timeline"><div class="time-ruler">${['00:00','00:05','00:10','00:15','00:20','00:25','00:30'].map(t=>`<span>${t}</span>`).join('')}</div><div class="time-lane">${clips.map((c,i)=>`<div class="time-clip ${i===0?'active':''}" data-action="shotDetail" data-id="${c.id}">${imgTag(c.image,'Scene still','')}<span>0${i+1} · ${esc(c.title)}</span></div>`).join('')}</div><div class="audio-lane">${icon('volume',16)} &nbsp; Soundtrack · Ambient cinematic mix (placeholder)</div></div>`}
function renderRoles(p){return `${headingSmall('Roles & Assets','Keep characters, locations and visual references consistent across the project.',btn(`${icon('plus',14)} Add character`,'openModal','btn primary sm','data-modal="addRole"'))}<div class="grid-3">${db.roles.map((r,i)=>`<div class="role-card"><img src="${esc(r.image)}" alt="${esc(r.name)}"><div style="min-width:0"><div class="eyebrow">${esc(r.role)}</div><h3 class="mt-8">${esc(r.name)}</h3><p class="tiny muted mt-8">${esc(r.description)}</p><button class="btn ghost sm mt-8" data-action="openRole" data-index="${i}">View role ${icon('arrow',12)}</button></div></div>`).join('')}<button class="role-card" data-action="openModal" data-modal="addRole" style="border-style:dashed;justify-content:center;color:var(--brand)">${icon('plus',23)} Add a new role</button></div><div class="section-heading"><div><h2>Linked scene materials</h2><p>References used across storyboards and canvases.</p></div>${btn('Open material library','navigate','btn sm','data-page="assets"')}</div><div class="grid-4">${db.assets.filter(a=>a.image).slice(0,4).map(a=>`<button class="canvas-list-card" data-action="openAsset" data-id="${a.id}">${cover(a.image)}<div class="list-card-foot"><h4>${esc(a.title)}</h4><p>${esc(a.group)} · ${esc(a.type)}</p></div></button>`).join('')}</div>`}
function renderProjectSetup(p){return `${headingSmall('Project Setup','Manage the creative guidelines and metadata for this production.') }<div class="grid-2"><div class="card card-pad"><h3>General Information</h3><p class="sm muted mt-8 mb-14">Changes are stored locally in your browser.</p><div class="form-group"><label class="form-label">Project name</label><input class="field" id="projectTitle" value="${esc(p.title)}"></div><div class="form-group"><label class="form-label">Genre</label><input class="field" id="projectGenre" value="${esc(p.genre)}"></div><div class="form-group"><label class="form-label">Story description</label><textarea class="textarea" id="projectDescription">${esc(p.description)}</textarea></div>${btn(`${icon('check',14)} Save project`,'saveProjectSetup','btn primary')}</div><div class="card card-pad"><h3>Visual Production Defaults</h3><div class="form-group mt-16"><label class="form-label">Art style</label><select class="select" id="projectStyle">${['Cinematic','3D Animation','Anime','Documentary','Live-action'].map(s=>`<option ${p.style===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Canvas ratio</label><select class="select"><option>16:9 Widescreen</option><option>9:16 Portrait</option><option>1:1 Square</option></select></div><div class="form-group"><label class="form-label">Resolution</label><select class="select"><option>1080p</option><option>720p</option><option>4K</option></select></div><div class="hero-note">${icon('info',15)} Projects are stored locally in this prototype. Connect a database before sharing projects between devices.</div></div></div>`}
function renderCanvases(){const list=db.canvases.filter(c=>(state.canvasFilter==='all'||c.kind===state.canvasFilter)&&c.title.toLowerCase().includes(state.canvasSearch.toLowerCase()));return pageWrap(`${heading('Your Free Canvases','Collect ideas, arrange visual stories and explore connections on an infinite board.',`${btn(`${icon('upload',15)} Import`,'triggerUpload','btn','data-upload="canvasImport"')}${btn(`${icon('plus',15)} New canvas`,'newCanvas','btn primary')}<input id="canvasImport" type="file" hidden accept=".json,.txt">`)}<div class="toolbar-line"><div class="input-wrap" style="width:min(320px,100%)">${icon('search',15)}<input class="field" data-bind="canvasSearch" value="${esc(state.canvasSearch)}" placeholder="Search your canvases"></div><div class="tabs">${[['all','All'],['Free Canvas','Free Canvas'],['Project Canvas','Project Canvas']].map(([val,label])=>`<button data-action="canvasFilter" data-filter="${val}" class="${state.canvasFilter===val?'active':''}">${label}</button>`).join('')}</div><div style="flex:1"></div><span class="sm muted">${list.length} canvases</span></div><div class="grid-4"><button class="canvas-list-card" data-action="newCanvas" style="border-style:dashed"><div class="cover-wrap"><div class="blank-preview">${icon('plus',35)}<strong style="color:var(--sub)">Start from blank</strong><span>Your next creative board</span></div></div><div class="list-card-foot"><h4>Create a new canvas</h4><p>Infinite board · All yours</p></div></button>${list.map(c=>`<article class="canvas-list-card" data-action="openCanvas" data-id="${c.id}">${cover(c.nodes?.find(n=>n.image)?.image||'',`${c.nodes?.length||0} nodes`)}<div class="list-card-foot"><div class="between"><h4>${esc(c.title)}</h4><button class="btn ghost btn-icon" title="Rename canvas" data-action="renameCanvas" data-id="${c.id}">${icon('pencil',14)}</button></div><div class="between"><p>${esc(c.kind)} · ${esc(c.modified)}</p><button class="btn ghost btn-icon" data-action="deleteCanvas" data-id="${c.id}" title="Delete canvas">${icon('trash',14)}</button></div></div></article>`).join('')}</div>${!list.length?empty('No canvases match','Try another name, or make a new board.'):''}`)}
function currentCanvas(){return db.canvases.find(c=>c.id===state.canvasId)||db.canvases[0]}
function canvasConnections(nodes){return nodes.slice(1).map((n,i)=>{const prev=nodes[i],x1=prev.x+260,y1=prev.y+70,x2=n.x,y2=n.y+70,dx=Math.max(50,(x2-x1)*.45);return `<path d="M${x1} ${y1} C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}" style="stroke:var(--node-link)" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linecap="round" opacity=".7"/>`}).join('')}
function canvasNodeHTML(n){const name=n.type==='image'?'Image Reference':n.type==='shot'?'Film Shot':n.type==='prompt'?'AI Prompt':'Story Note';return `<div class="node-card ${state.canvasSelectedNode===n.id?'selected':''}" data-type="${esc(n.type||'note')}" style="left:${n.x}px;top:${n.y}px" data-node-id="${n.id}"><span class="node-port in"></span><span class="node-port out"></span><div class="node-card__head" data-drag-node="${n.id}"><div class="flex gap-8" style="pointer-events:none"><span class="node-ico">${icon(n.type==='image'?'image':n.type==='shot'?'film':n.type==='prompt'?'sparkles':'file',16)}</span>${name}</div><span style="pointer-events:none">${icon('more',15)}</span></div>${n.image?imgTag(n.image,'Canvas reference',''):`<div class="node-card__body">${esc(n.text||'Add a new thought here...')}</div>`}${n.image?`<div class="node-card__body">${esc(n.text||'Visual reference')}</div>`:''}</div>`}

function skillCard(s){const active=db.skillsInstalled.includes(s.id);return `<article class="skill-card"><div class="flex gap-10"><div class="skill-logo">${icon(s.icon,20)}</div><div><h4>${esc(s.name)}</h4><span class="tiny muted">${esc(s.category)}</span></div></div><p>${esc(s.desc)}</p><div class="between mb-14"><span class="tiny muted">${icon('heart',13)} ${esc(s.uses)} uses</span><span class="tiny muted">by ${esc(s.creator)}</span></div><div class="flex gap-7"><button class="btn ${active?'':'secondary'} sm" style="flex:1" data-action="skillInstall" data-id="${s.id}">${icon(active?'check':'plus',13)} ${active?'Installed':'Add to library'}</button><button class="btn sm btn-icon" data-action="skillDetail" data-id="${s.id}" title="More info">${icon('external',14)}</button></div></article>`}

(t.type)} · ${esc(t.model)}</div></div><span>${pill(t.status,t.status==='Completed'?'green':t.status==='Failed'?'pink':'orange')}</span><span class="tiny muted">${esc(t.date)}</span><span class="tiny muted">${t.credits} credits</span>${icon('right',15)}</div>`).join('')}${!list.length?empty('No matching tasks','Clear filters to explore earlier work.','clock'):''}</div>`:`<div class="grid-4">${list.map(t=>`<article class="canvas-list-card" data-action="historyDetail" data-id="${t.id}">${cover(t.image,t.status)}<div class="list-card-foot"><h4>${esc(t.title)}</h4><p>${esc(t.type)} · ${esc(t.model)} · ${esc(t.date)}</p></div></article>`).join('')}</div>`}`)}
