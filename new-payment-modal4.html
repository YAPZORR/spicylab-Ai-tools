/* ============ SpicyLab tokens ============ */
:root{
  --page:#07060e;
  --modal:#0f0c24;
  --line:rgba(190,165,255,.12);
  --line-2:rgba(190,165,255,.22);
  --text:#fff;
  --text-2:#d8d2f4;
  --muted:#9c96c3;
  --muted-2:#6d6895;
  --violet:#7b4dff;
  --magenta:#c43cf2;
  --pink:#ec4aa9;
  --cyan:#3ec6f4;
  --gold:#ffc22e;
  --grad-brand:linear-gradient(90deg,#7b4dff 0%,#b13ff0 52%,#ec4aa9 100%);
  --grad-ring:linear-gradient(140deg,#8b5cf6 0%,#c43cf2 55%,#ec4aa9 100%);
  --grad-word:linear-gradient(90deg,#b45cff 0%,#e44fd6 100%);
  --grad-card:linear-gradient(90deg,#f257b6 0%,#da3f9e 100%);
  --grad-guide:linear-gradient(90deg,#2f8cff 0%,#7b4dff 100%);
  --sans:"Inter SL",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Outfit SL",Outfit,"Inter SL",ui-sans-serif,system-ui,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.ico{width:1em;height:1em;flex:none;display:inline-block}
.word{background:var(--grad-word);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}

/* ============ presentation page ============ */
.doc{max-width:1536px;margin:0 auto;padding:56px 48px 96px}
.doc-head{max-width:760px;margin-bottom:56px}
.doc-head h1{font-size:30px;font-weight:800;letter-spacing:-.025em}
.doc-head p{margin-top:8px;font-size:15px;line-height:1.5;color:var(--muted)}
.doc-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.doc-nav a{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--text-2);text-decoration:none;font-size:13px;font-weight:600}
.doc-group+.doc-group{margin-top:96px;padding-top:56px;border-top:1px solid var(--line)}
.doc-group-head{max-width:720px;margin-bottom:32px}
.doc-group-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.doc-group-head p{margin-top:8px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.doc-section+.doc-section{margin-top:56px}
.doc-section>h3{font-size:16px;font-weight:700;color:var(--text-2);margin-bottom:18px}
.shot{margin-bottom:40px}
.shot figcaption{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.mobile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start}
.shot--m{min-width:0}
.shot--m figcaption{text-align:center}
.shot--m .fit{width:max-content;margin:0 auto}

.stage{position:relative;overflow:hidden;border-radius:22px;isolation:isolate}
.stage--desktop{width:1440px;padding:56px 160px;display:flex;justify-content:center}
.stage--mobile{width:430px;padding:28px 20px}
.backdrop{position:absolute;inset:-80px;z-index:-1;filter:blur(46px);
  background:
    radial-gradient(38% 42% at 8% 18%,rgba(98,64,214,.7),transparent 70%),
    radial-gradient(30% 40% at 92% 8%,rgba(64,140,230,.4),transparent 70%),
    radial-gradient(34% 40% at 88% 92%,rgba(214,70,150,.5),transparent 70%),
    radial-gradient(40% 36% at 36% 104%,rgba(230,150,96,.4),transparent 70%),
    #120f22}
.backdrop::after{content:"";position:absolute;inset:0;background:rgba(6,5,14,.58)}

/* ============ shared atoms ============ */
.coin{--s:18px;position:relative;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff6c4 0 6%,#ffd95a 18%,#ffbf1f 48%,#f29a06 78%,#c97400 100%);
  box-shadow:inset 0 0 0 calc(var(--s)*.07) #df8a00,inset 0 0 0 calc(var(--s)*.12) #ffd24d}
.coin::before{content:"$";font-weight:900;font-size:calc(var(--s)*.56);line-height:1;color:#a35c00;text-shadow:0 1px 0 rgba(255,232,150,.55)}

.radio{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:12px;color:#fff}
.radio .ico{stroke-width:3.2}
.radio.is-on{border:0;background:var(--grad-ring);box-shadow:0 0 0 4px rgba(196,60,242,.16)}

.chip{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.chip--violet{background:linear-gradient(135deg,#a07bff,#6a3df0)}
.chip--pink{background:linear-gradient(135deg,#ff73c8,#e0408f)}
.chip--gold{background:linear-gradient(135deg,#ffd95e,#f2a10c);color:#5b3500}

.avatars{display:flex}
.avatar{width:24px;height:24px;margin-left:-7px;border-radius:50%;border:2px solid var(--modal);display:grid;place-items:center;font-size:12px;color:#fff}
.avatar:first-child{margin-left:0}
.avatar--v{background:linear-gradient(135deg,#a07bff,#6a3df0)}
.avatar--p{background:linear-gradient(135deg,#ff73c8,#d93f9f)}
.avatar--g{background:linear-gradient(135deg,#ffd95e,#f29a06);color:#5b3500}
.avatar--c{background:linear-gradient(135deg,#7fdcff,#2f8cff)}
.avatar--l{background:linear-gradient(135deg,#c9b2ff,#8b5cf6)}
.stars{display:inline-flex;gap:2px;color:var(--gold);font-size:13px}

.close{position:absolute;z-index:5;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--text-2);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.close--m{top:16px;right:16px;width:32px;height:32px;font-size:15px}
.close--glass{background:rgba(10,6,30,.35);border-color:rgba(255,255,255,.2);color:#fff}

.best{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;color:#ffd36b;background:rgba(255,194,46,.12);border:1px solid rgba(255,194,46,.32)}

/* buttons */
.btn-card{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 10px 0 20px;border:0;border-radius:15px;color:#fff;font-size:15.5px;font-weight:700;white-space:nowrap;
  background:var(--grad-card);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 30px -14px rgba(236,74,169,.9)}
.btn-card>.ico{font-size:18px}
.amt-pill{padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.2);font-size:14px;font-weight:800}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px;border-radius:15px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#fff;font-size:14.5px;font-weight:650;white-space:nowrap}
.btn-ghost .ico{font-size:17px}
.i-tg{color:#5ccfff}
.i-btc{color:#ffb238}

/* secure + chips */
.a-secure{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-2);white-space:nowrap}
.lock .ico{color:#34d399;font-size:14px}

.c-corner,.c-plan,.c-label,.c-cell,.c-group{position:relative;z-index:1}
.c-corner{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.c-corner b{font-size:15px;font-weight:700}
.c-corner span{font-size:12px;color:var(--muted)}
.c-plan{display:flex;flex-direction:column;align-items:flex-start;padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.c-ptop{display:flex;align-items:center;width:100%}
.c-ptop .chip{width:26px;height:26px;border-radius:8px;font-size:14px}
.c-ptop .radio{margin-left:auto}
.c-pname{margin-top:14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.c-plan>.best{position:absolute;z-index:2;top:-11px;left:50%;transform:translateX(-50%);border:0;color:#3b2200;background:linear-gradient(90deg,#ffd95e,#ffb238);box-shadow:0 4px 12px -4px rgba(255,178,56,.7)}
.c-pcoins{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--text-2)}
.c-pp{margin-top:14px;font-size:34px;line-height:1;font-weight:800;letter-spacing:-.045em}
.c-pm{margin-top:6px;font-size:12.5px;color:var(--muted)}
.c-group{grid-column:1/-1;padding:18px 18px 8px;font-size:12.5px;font-weight:700;color:#fff}
.c-label{display:flex;align-items:center;padding:11px 18px;font-size:13.5px;line-height:1.3;color:var(--text-2);border-top:1px solid rgba(190,165,255,.07)}
.c-cell{display:flex;align-items:center;justify-content:center;padding:11px 10px;text-align:center;font-size:13.5px;border-top:1px solid rgba(190,165,255,.07)}
.c-val{font-weight:600;color:var(--muted)}
.c-val.is-col{font-weight:700;color:#fff}
.c-yes{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#c43cf2)}
.c-yes .ico{stroke-width:3.2}
.c-cell:not(.is-col) .c-yes{color:#cdb8ff;background:rgba(139,92,246,.2)}
.c-no{width:12px;height:2px;border-radius:2px;background:rgba(190,165,255,.25)}
.c-yield{flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.c-yield.is-col{color:#fff;font-weight:600}
.c-yield span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.c-yield .ico{font-size:12px;color:#b9a3ff}
.c-table>.c-label:last-of-type,.c-table>.c-cell:nth-last-child(-n+3){padding-bottom:16px}

.c-side{display:flex;flex-direction:column;gap:12px}
.c-side .b-pay{margin-top:0}
.c-side .gl-txt b{white-space:normal;line-height:1.25}
.c-side .gl-top{white-space:normal}
.c-sum{padding:18px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.c-sum-head{display:flex;align-items:center;gap:10px}
.c-sum-head .chip{width:30px;height:30px;border-radius:9px;font-size:16px}
.c-sum-head b{font-size:16px;font-weight:700}
.c-sum-coins{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:15px;color:var(--text-2)}
.c-sum-coins b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
.c-sum-out{margin-top:4px;font-size:12.5px;color:var(--muted)}
.c-kv{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.c-kv>div{display:flex;align-items:baseline;justify-content:space-between;font-size:13px}
.c-kv dt{color:var(--muted)}
.c-kv dd{font-weight:700;color:var(--text-2)}
.c-kv-total{margin-top:4px;padding-top:10px;border-top:1px dashed var(--line-2)}
.c-kv-total dt{color:#fff;font-weight:600}
.c-kv-total dd{font-size:19px;font-weight:800;color:#fff}
.c-save{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:600;color:#7fdcff}
.c-save .ico{font-size:14px}

/* C mobile */
.cm-modal{position:relative;width:390px;padding:30px 14px 20px;border-radius:34px;border:1px solid rgba(190,165,255,.16);
  background:radial-gradient(380px 220px at 50% -50px,rgba(123,77,255,.24),transparent 70%),var(--modal);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 40px 80px -20px rgba(0,0,0,.85)}
.cm-head{text-align:center;padding:0 24px}
.cm-head h1{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
.cm-head p{margin-top:8px;font-size:13.5px;line-height:1.4;color:var(--muted);text-wrap:balance}
.c-table--m{margin-top:20px;grid-template-columns:minmax(0,1fr) repeat(3,64px);border-radius:18px}
.c-table--m .c-hl{inset:4px 2px;border-radius:13px}
.c-table--m .c-corner{padding:12px 10px 12px 12px}
.c-table--m .c-corner b{font-size:13px}
.c-table--m .c-corner span{font-size:10.5px}
.c-table--m .c-plan{align-items:center;gap:3px;padding:10px 2px 12px}
.c-crown{height:14px;display:grid;place-items:center;font-size:13px;color:var(--gold)}
.c-table--m .c-pname{margin-top:2px;font-size:11.5px}
.c-table--m .c-pp{margin-top:0;font-size:16px;letter-spacing:-.03em}
.c-table--m .c-plan .radio{margin-top:5px;width:20px;height:20px;font-size:11px}
.c-table--m .c-group{padding:13px 12px 6px;font-size:12px}
.c-table--m .c-label{padding:9px 6px 9px 12px;font-size:12px}
.c-table--m .c-cell{padding:9px 2px;font-size:11.5px}
.c-table--m .c-yes{width:18px;height:18px;font-size:10px}
.c-table--m .c-yield{font-size:10.5px;gap:3px}
.c-table--m .c-yield .ico{font-size:10px}
.cm-checkout{display:flex;flex-direction:column;gap:12px;margin-top:16px;padding:14px;border-radius:22px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.cm-checkout .c-sum{padding:0;border:0;background:none}
.cm-checkout .b-pay{margin-top:0}

/* =====================================================================
   OPTION D — plan passes
   ===================================================================== */
.d--monthly{--glow:123,77,255}
.d--quarterly{--glow:214,64,220}
.d--annual{--glow:255,170,60}
.d-modal{position:relative;width:1120px;display:grid;grid-template-columns:500px 1fr;border-radius:30px;overflow:hidden;border:1px solid rgba(190,165,255,.18);background:var(--modal);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 60px 120px -30px rgba(0,0,0,.85),0 0 100px -40px rgba(var(--glow),.5)}
.d-left{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px 28px;overflow:hidden;
  background:radial-gradient(62% 42% at 50% 42%,rgba(var(--glow),.34),transparent 72%),linear-gradient(180deg,#150f33 0%,#0d0a22 100%)}
.d-left::before,.dm-modal::before{content:"";position:absolute;inset:0;max-height:560px;pointer-events:none;opacity:.7;
  background:radial-gradient(1.4px 1.4px at 14% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 82% 12%,#fff,transparent),
    radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.4px 1.4px at 90% 60%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 10% 88%,#fff,transparent),radial-gradient(1px 1px at 64% 28%,#fff,transparent)}
.d-fan{position:relative;flex:none;width:100%;height:470px}

.pass-wrap{position:absolute;left:50%;top:50%;width:240px;height:360px;margin:-180px 0 0 -120px;filter:drop-shadow(0 24px 28px rgba(0,0,0,.55))}
.pos-l{transform:translateX(-140px) rotate(-10deg) scale(.84);z-index:1}
.pos-c{transform:translateY(-4px) scale(.88);z-index:2}
.pos-r{transform:translateX(140px) rotate(10deg) scale(.84);z-index:1}
.pass-wrap:not(.is-on) .pass{filter:brightness(.5) saturate(.7)}
.pass-wrap.is-on{z-index:3;filter:drop-shadow(0 30px 34px rgba(0,0,0,.6)) drop-shadow(0 0 36px rgba(var(--glow),.55))}
.pos-l.is-on{transform:translateX(-104px) translateY(-14px) rotate(-6deg)}
.pos-c.is-on{transform:translateY(-16px)}
.pos-r.is-on{transform:translateX(104px) translateY(-14px) rotate(6deg)}

.pass{position:relative;width:100%;height:100%;padding:20px 20px 0;border-radius:24px;overflow:hidden;color:#fff;
  -webkit-mask:radial-gradient(circle 14px at 0 72%,transparent 13.5px,#000 14px) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 72%,transparent 13.5px,#000 14px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 14px at 0 72%,transparent 13.5px,#000 14px) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 72%,transparent 13.5px,#000 14px) right/51% 100% no-repeat}
.pass--monthly{background:radial-gradient(120% 60% at 100% 0%,rgba(62,198,244,.6),transparent 60%),linear-gradient(160deg,#4a2acc 0%,#7b4dff 52%,#3a1fa8 100%)}
.pass--quarterly{background:radial-gradient(120% 60% at 100% 0%,rgba(255,140,210,.6),transparent 60%),linear-gradient(160deg,#6524c4 0%,#c43cf2 52%,#8c1f86 100%)}
.pass--annual{background:radial-gradient(120% 60% at 100% 0%,rgba(255,214,110,.8),transparent 60%),linear-gradient(160deg,#7a2fd6 0%,#d23ea8 55%,#ef8a3a 100%)}
.pass::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 115% 38%,rgba(255,255,255,.075) 0 1px,transparent 1px 16px)}
.pass::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 44%,transparent 58%)}
.pass>*{position:relative;z-index:1}
.pass-top{display:flex;align-items:center;gap:8px;font-size:14px}
.pass .chip{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pass-best{margin-left:auto;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;color:#3b2200;background:linear-gradient(90deg,#ffe08a,#ffb238)}
.pass-mid{margin-top:46px}
.pass-mid .n{display:block;font-family:var(--display);font-size:66px;line-height:.9;font-weight:800;letter-spacing:-.03em}
.pass-mid .u{display:block;margin-top:6px;font-family:var(--display);font-size:19px;font-weight:600;opacity:.88}
.pass-mid p{margin-top:16px;font-size:12px;opacity:.88}
.pass-stub{position:absolute;left:0;right:0;bottom:0;height:28%;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(10,4,30,.24)}
.pass-stub::before{content:"";position:absolute;left:18px;right:18px;top:-1px;border-top:2px dashed rgba(255,255,255,.42)}
.pass-stub b{display:block;font-family:var(--display);font-size:27px;line-height:1;font-weight:800}
.pass-stub div span{display:block;margin-top:4px;font-size:11px;opacity:.82}
.barcode{width:58px;height:34px;border-radius:3px;opacity:.7;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 13px)}

.d-pills{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.d-pill{padding:8px 18px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:650}
.d-pill.is-on{color:#fff;background:linear-gradient(135deg,#7b4dff,#c43cf2);box-shadow:0 8px 20px -8px rgba(196,60,242,.9)}
.d-trust{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.d-trust b{color:#fff;font-weight:700}
.d-left>*{position:relative}

.d-right{position:relative;display:flex;flex-direction:column;padding:38px 40px 26px}
.d-right .close{top:18px;right:18px}
.d-title{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
.d-sel{display:flex;align-items:center;gap:10px;margin-top:26px;font-size:16px}
.d-sel .chip{width:30px;height:30px;border-radius:9px;font-size:16px}
.d-sel b{font-weight:700}
.d-price{margin-top:14px}
.d-inc{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.d-inc ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:14px}
.d-inc li{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.3;color:var(--text-2)}
.d-ico{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#c43cf2)}
.d-teaser{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);font-size:12.5px;color:var(--muted)}
.d-teaser .ico{font-size:14px}
.d-teaser--all{color:#ffd36b;border-color:rgba(255,194,46,.35);background:rgba(255,194,46,.05)}

/* D mobile */
.dm-modal{position:relative;width:390px;padding-bottom:20px;border-radius:34px;overflow:hidden;border:1px solid rgba(190,165,255,.18);
  background:radial-gradient(420px 340px at 50% 260px,rgba(var(--glow),.3),transparent 70%),linear-gradient(180deg,#150f33 0px,var(--modal) 560px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 40px 80px -20px rgba(0,0,0,.85),0 0 80px -30px rgba(var(--glow),.5)}
.dm-modal>*{position:relative}
.dm-modal>.close{position:absolute}
.dm-head{text-align:center;padding:30px 40px 0}
.d-title--m{font-size:30px}
.dm-head p{margin-top:8px;font-size:13.5px;line-height:1.4;color:var(--muted);text-wrap:balance}
.dm-carousel{height:340px;margin-top:14px}
.dm-carousel .pass-wrap{width:210px;height:315px;margin:-157.5px 0 0 -105px;transform:translateX(calc(var(--off) * 196px)) scale(.86);z-index:1}
.dm-carousel .pass-wrap.is-on{transform:translateY(-4px);z-index:3}
.dm-carousel .pass{padding:18px 18px 0;border-radius:22px;
  -webkit-mask:radial-gradient(circle 12px at 0 72%,transparent 11.5px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 72%,transparent 11.5px,#000 12px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 12px at 0 72%,transparent 11.5px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 72%,transparent 11.5px,#000 12px) right/51% 100% no-repeat}
.dm-carousel .pass-top{font-size:13px}
.dm-carousel .pass-mid{margin-top:38px}
.dm-carousel .pass-mid .n{font-size:56px}
.dm-carousel .pass-mid .u{font-size:17px}
.dm-carousel .pass-mid p{margin-top:12px;font-size:11.5px}
.dm-carousel .pass-stub{padding:0 18px}
.dm-carousel .pass-stub b{font-size:23px}
.dm-carousel .barcode{width:50px;height:30px}
.dm-modal .d-pills{width:max-content;margin:12px auto 0}
.dm-body{padding:22px 16px 0}
.dm-body .d-sel{margin-top:0}
.d-inc--m ul{grid-template-columns:1fr;gap:9px}
.dm-body .b-pay{margin-top:22px}
.dm-body .a-secure--m{margin-top:18px}


/* =====================================================================
   OPTION E — creation meter
   ===================================================================== */
.e-modal{position:relative;width:1080px;padding:36px 36px 28px;border-radius:28px;border:1px solid rgba(190,165,255,.16);
  background:radial-gradient(760px 300px at 50% -110px,rgba(123,77,255,.22),transparent 70%),var(--modal);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 60px 120px -30px rgba(0,0,0,.85)}
.e-modal .close{top:20px;right:20px}
.e-meter{margin-top:28px;padding:28px 28px 26px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(123,77,255,.11),rgba(255,255,255,.015))}
.e-meter-top{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:center}
.e-big{display:flex;align-items:baseline;gap:10px}
.e-big .n{font-size:76px;line-height:.9;font-weight:850;letter-spacing:-.05em}
.e-big .u{font-size:22px;font-weight:700;color:var(--text-2)}
.e-out p{margin-top:10px;font-size:16px;color:var(--text-2)}
.e-with{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:5px 12px 5px 5px;border-radius:999px;font-size:13px;color:var(--text-2);background:rgba(255,194,46,.08);border:1px solid rgba(255,194,46,.3)}
.e-with b{color:var(--gold);font-weight:800}
.e-grid-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.e-grid{display:grid;grid-template-rows:repeat(5,22px);grid-auto-flow:column;grid-auto-columns:22px;gap:5px}
.e-grid i{border-radius:5px;background:rgba(255,255,255,.045);border:1px solid rgba(190,165,255,.08)}
.e-grid i.on{border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 10px -2px rgba(196,60,242,.65)}
.e-legend{font-size:11.5px;color:var(--muted-2)}
.e-slider{margin-top:30px}
.e-track{position:relative;height:8px;margin:0 18px;border-radius:999px;background:rgba(255,255,255,.07)}
.e-fill{position:absolute;left:0;top:0;bottom:0;width:var(--pos);border-radius:inherit;background:linear-gradient(90deg,#7b4dff,#c43cf2,#ec4aa9);box-shadow:0 0 14px rgba(196,60,242,.6)}
.e-stop{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#231b4a;border:2px solid rgba(190,165,255,.3)}
.e-stop.is-past{background:#fff;border-color:#fff}
.e-thumb{position:absolute;top:50%;left:var(--pos);z-index:2;transform:translate(-50%,-50%);display:grid;padding:3px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,194,46,.18),0 0 22px rgba(255,182,30,.7)}
.e-labs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px}
.e-lab{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:0;border:0;background:none;text-align:left;color:var(--muted)}
.e-lab:nth-child(2){align-items:center;text-align:center}
.e-lab:nth-child(3){align-items:flex-end;text-align:right}
.e-lab b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:16px;font-weight:700;color:var(--text-2)}
.e-lab:nth-child(3) b{justify-content:flex-end}
.e-lab span{font-size:12.5px}
.e-lab .pp{font-weight:600}
.e-lab.is-on b{color:#fff}
.e-lab.is-on span{color:var(--text-2)}
.e-lab.is-on .pp{color:#fff}
.e-lower{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
.e-card{padding:20px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.e-card .b-feat-head h3{font-size:14px;font-weight:700}
.e-card .b-feat-head span{font-size:12.5px;color:var(--muted)}
.e-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.e-chips li{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.2}
.e-chips .ico{font-size:13px}
.e-chips .is-on{color:#fff;background:rgba(123,77,255,.16);border:1px solid rgba(139,92,246,.42)}
.e-chips .is-on .ico{color:#cbb5ff}
.e-chips .is-off{color:var(--muted-2);border:1px dashed rgba(190,165,255,.2)}
.e-buy .b-price{margin-top:0}
.e-buy .b-amt .num{font-family:var(--sans);font-size:46px;font-weight:800;letter-spacing:-.045em}
.e-buy .b-pay{margin-top:18px}
.e-modal .a-foot{margin-top:16px}

.em-modal{position:relative;width:390px;padding:30px 14px 20px;border-radius:34px;border:1px solid rgba(190,165,255,.16);
  background:radial-gradient(380px 220px at 50% -50px,rgba(123,77,255,.24),transparent 70%),var(--modal);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 40px 80px -20px rgba(0,0,0,.85)}
.e-meter--m{margin-top:20px;padding:20px 16px 18px;border-radius:22px}
.e-meter--m .e-big .n{font-size:58px}
.e-meter--m .e-big .u{font-size:18px}
.e-meter--m .e-out p{margin-top:8px;font-size:13.5px}
.e-meter--m .e-out p b{color:var(--gold)}
.e-meter--m .e-grid-wrap{margin-top:16px;align-items:center}
.e-meter--m .e-grid{grid-template-rows:repeat(8,17px);grid-auto-columns:17px;gap:4px}
.e-meter--m .e-grid i{border-radius:4px}
.e-meter--m .e-slider{margin-top:24px}
.e-meter--m .e-track{margin:0 12px}
.e-meter--m .e-labs{margin-top:20px}
.e-meter--m .e-lab b{font-size:14px}
.e-meter--m .e-lab span{font-size:11px}
.e-meter--m .e-lab .best{font-size:9.5px;padding:2px 6px}
.e-card--m{margin-top:12px;padding:16px}
.e-card--m .e-chips{gap:6px}
.e-card--m .e-chips li{padding:6px 10px;font-size:11.5px}
.em-secure{margin-top:16px}

/* =====================================================================
   OPTION F — bento
   ===================================================================== */
.f-modal{position:relative;width:1160px;display:grid;grid-template-columns:388px minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"pick price coins" "pick feat feat" "guide pay pay" "note note note";gap:12px;padding:16px;border-radius:30px;border:1px solid rgba(190,165,255,.18);background:#0a0820;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 60px 120px -30px rgba(0,0,0,.85)}
.close--float{top:-14px;right:-14px;width:38px;height:38px;background:var(--modal);border-color:var(--line-2);box-shadow:0 10px 24px -8px rgba(0,0,0,.7)}
.tile{position:relative;padding:22px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.03);overflow:hidden}
.f-pick{grid-area:pick;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 0% 0%,rgba(123,77,255,.3),transparent 62%),rgba(255,255,255,.03)}
.f-pick h1{font-family:var(--display);font-size:36px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
.f-pick p{margin-top:8px;font-size:14px;line-height:1.4;color:var(--muted)}
.f-opts{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:24px}
.f-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.f-opt.is-on{border:1.5px solid transparent;
  background:linear-gradient(180deg,rgba(123,77,255,.22),rgba(123,77,255,.06)) padding-box,linear-gradient(#15102f,#15102f) padding-box,var(--grad-ring) border-box;
  box-shadow:0 16px 34px -18px rgba(196,60,242,.85)}
.f-opt-id{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.f-opt-id b{font-size:15px;font-weight:700}
.f-opt-id .best{font-size:10px;padding:2px 7px}
.f-opt-id>span:last-child{flex-basis:100%;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.f-opt-p{text-align:right}
.f-opt-p b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-weight:700;letter-spacing:-.02em}
.f-opt-p span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}

.f-num{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.f-num .n{font-family:var(--display);font-size:60px;line-height:.9;font-weight:800;letter-spacing:-.035em}
.f-num .u{font-size:14px;color:var(--muted)}
.f-price{grid-area:price}
.f-price p{margin-top:12px;font-size:13px;line-height:1.5;color:var(--text-2)}
.f-price .b-save{display:inline-flex;margin:14px 0 0}
.f-coins{grid-area:coins;border-color:rgba(255,194,46,.28);
  background:radial-gradient(90% 80% at 100% 100%,rgba(255,178,56,.22),transparent 65%),radial-gradient(60% 60% at 0% 0%,rgba(255,214,110,.07),transparent 70%),rgba(255,255,255,.03)}
.f-coin{box-shadow:inset 0 0 0 calc(var(--s)*.07) #df8a00,inset 0 0 0 calc(var(--s)*.12) #ffd24d,0 0 30px rgba(255,190,50,.5)}
.f-coins .f-num{margin-top:14px}
.f-coins .f-num .u{font-family:var(--display);font-size:20px;font-weight:600;color:#ffd36b}
.f-coins p{margin-top:10px;font-size:13px;line-height:1.4;color:var(--text-2)}
.f-feat{grid-area:feat}
.f-feat .b-feat-head h3{font-size:14px;font-weight:700}
.f-feat .b-feat-head span{font-size:12.5px;color:var(--muted)}
.f-seg{display:flex;gap:4px;margin:12px 0 16px}
.f-seg i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08)}
.f-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:8px 20px}
.f-list li{display:flex;align-items:center;gap:10px;min-height:26px;font-size:13px;line-height:1.3}
.f-list .is-on .bf-ico{color:#fff;background:linear-gradient(135deg,#8b5cf6,#c43cf2)}
.f-list .is-off .bf-ico{color:var(--muted-2);background:rgba(255,255,255,.035);border:1px solid var(--line)}
.f-list .is-on .bf-txt{color:var(--text-2)}
.f-list .is-off .bf-txt{color:var(--muted-2)}
.f-trust{grid-area:trust;display:flex;flex-direction:column;justify-content:center;gap:10px;background:radial-gradient(90% 80% at 0% 100%,rgba(62,198,244,.16),transparent 65%),rgba(255,255,255,.03)}
.f-trust .avatar{border-color:#141130}
.f-num--sm .n{font-size:44px}
.f-num--sm .u{font-size:13px;color:var(--text-2)}
.f-trust .r{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.f-trust .r b{color:#fff}
.f-pay{grid-area:pay;display:flex;flex-direction:column;justify-content:center;gap:14px;background:radial-gradient(80% 90% at 50% 130%,rgba(236,74,169,.2),transparent 65%),rgba(255,255,255,.03)}
.f-pay .b-pay{margin-top:0}
.f-secure{justify-content:center}
.f-guide{grid-area:guide;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px;text-decoration:none;color:#fff;border:1px solid transparent;
  background:linear-gradient(90deg,rgba(62,198,244,.08),rgba(123,77,255,.06)) padding-box,linear-gradient(#100c27,#100c27) padding-box,linear-gradient(90deg,rgba(62,198,244,.5),rgba(139,92,246,.3),rgba(236,74,169,.5)) border-box}
.f-guide-art{flex:none;width:64px;height:48px;border-radius:12px;display:grid;place-items:center;
  background:radial-gradient(1px 1px at 20% 25%,#fff,transparent),radial-gradient(1px 1px at 70% 75%,#fff,transparent),linear-gradient(160deg,#2b2a8f,#3a1f84 55%,#1c1450)}
.f-guide-txt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.f-guide-txt b{font-size:15px;font-weight:700}
.f-guide-desc{font-size:12.5px;color:var(--muted)}
.f-note{grid-area:note;justify-content:center;margin-top:0}
.f-trust-in{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;border-radius:14px;font-size:12px;color:var(--text-2);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.f-trust-in .avatar{border-color:#1a1338}
.f-trust-in>div{display:flex;flex-direction:column;gap:3px;white-space:nowrap}
.f-trust-in b{color:#fff;font-weight:700}
.f-trust-in .r{display:flex;align-items:center;gap:6px}
.f-guide-txt b{line-height:1.25}
.f-guide-desc{line-height:1.45}

.f--m{width:390px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"pick pick" "price coins" "feat feat" "pay pay" "guide guide" "note note";gap:10px;padding:12px;border-radius:34px}
.f--m .tile{padding:18px;border-radius:22px}
.f--m .close--m{top:26px;right:26px}
.f--m .f-pick h1{font-size:30px;padding-right:40px}
.f--m .f-pick p{font-size:13px}
.f--m .f-trust-in{margin-top:14px}
.f--m .f-opts{padding-top:18px}
.f--m .f-opt{padding:12px}
.f--m .f-num .n{font-size:40px}
.f--m .f-num .u{font-size:12px}
.f--m .f-price p{font-size:12px}
.f--m .f-price .b-save{font-size:11px;padding:5px 8px;gap:4px}
.f--m .f-coins .f-num{margin-top:10px}
.f--m .f-coins .f-num .u{font-size:16px}
.f--m .f-coins p{font-size:12px}
.f--m .f-list{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
.f--m .f-trust{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px}
.f--m .f-num--sm .n{font-size:30px}
.f--m .f-trust .r{flex-basis:100%}
.f--m .f-guide{flex-direction:row;align-items:center;gap:12px;padding:12px}
.f--m .f-guide-art{width:48px;height:48px}
.f--m .f-guide-desc{display:none}
.f--m .f-guide-txt b{font-size:12.5px}
.f--m .f-guide .gl-go{width:30px;height:30px;padding:0;justify-content:center;font-size:0;border-radius:50%}
.f--m .f-guide .gl-go .ico{width:14px;height:14px}
.f--m .f-note{font-size:11px;text-align:center}


.f-opt-meter{grid-column:2 / -1;display:flex;align-items:center;gap:10px}
.f-opt-meter .bar{flex:1;height:5px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.08)}
.f-opt-meter .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#c43cf2,#ff6cb4)}
.f-opt-meter .t{font-size:11px;font-weight:600;white-space:nowrap;color:var(--muted)}
.f-opt.is-on .f-opt-meter .bar i{box-shadow:0 0 10px rgba(236,74,169,.7)}
.f-opt.is-on .f-opt-meter .t{color:var(--text-2)}

/* F — highlighted benefits (magenta/pink, desktop grid, mobile slider) */
.f-feat{padding:22px}
.fh-head h3{font-size:16px;font-weight:750}
.fh-head span{font-size:13px;color:var(--muted)}
.fh-head span b{color:#fff;font-weight:800}
.f-feat .f-seg{gap:5px;margin:12px 0 16px}
.f-feat .f-seg i{height:6px}
.f-feat .f-seg i.on{box-shadow:0 0 10px rgba(236,74,169,.55)}
.fh-scroll{min-width:0}
.fh-grid{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(52px,1fr));grid-auto-flow:column;gap:8px}
.fh{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;font-size:13.5px;line-height:1.28;font-weight:650}
.fh.is-on{color:#fff;border:1px solid rgba(236,74,169,.45);
  background:linear-gradient(135deg,rgba(236,74,169,.22) 0%,rgba(196,60,242,.10) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 22px -16px rgba(236,74,169,.95)}
.fh.is-off{color:var(--muted-2);font-weight:550;border:1px dashed rgba(190,165,255,.16);background:rgba(255,255,255,.012)}
.fh-ico{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.fh.is-on .fh-ico{color:#fff;background:linear-gradient(135deg,#ff6cc4,#d23e9e);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px -4px rgba(236,74,169,.85)}
.fh.is-off .fh-ico{color:var(--muted-2);background:rgba(255,255,255,.04)}
.fh-txt{flex:1;min-width:0}
.fh-state{flex:none;display:grid;place-items:center}
.fh.is-on .fh-state{width:18px;height:18px;border-radius:50%;font-size:10.5px;color:#d23e9e;background:#fff}
.fh.is-on .fh-state .ico{stroke-width:3.4}
.fh.is-off .fh-state{font-size:12px;color:var(--muted-2)}
.fh-more{justify-content:center;gap:8px;font-size:12.5px;font-weight:700;color:#ffd36b;border:1px solid rgba(255,194,46,.35);background:rgba(255,194,46,.07)}
.fh-more .ico{font-size:15px}

.f--m .f-feat{padding:18px 0 18px 18px}
.f--m .fh-head{padding-right:18px}
.f--m .f-feat .f-seg{margin:12px 18px 14px 0;gap:3px}
.f--m .f-feat .f-seg i{height:5px}
.f--m .fh-scroll{overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 18px 6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.f--m .fh-scroll::-webkit-scrollbar{display:none}
.f--m .fh-grid{width:max-content;grid-template-columns:none;grid-auto-columns:214px;grid-template-rows:repeat(3,minmax(54px,1fr))}
.f--m .fh{scroll-snap-align:start;font-size:13px}

/* F — larger, more obvious plan options in the picker */
.f-pick .f-opts{flex:1;margin-top:0;padding-top:22px;gap:14px}
.f-opt{position:relative;cursor:pointer;flex:1;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;row-gap:14px;align-content:center;
  padding:20px 18px;border-radius:20px;border:1px solid rgba(190,165,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02))}
.f-opt>.radio{grid-row:1 / span 2;width:26px;height:26px;font-size:14px}
.f-opt-chip{position:relative;grid-row:1 / span 2;width:42px;height:42px;border-radius:12px;font-size:20px}
.f-opt>.radio{grid-row:1 / span 2;width:24px;height:24px;font-size:13px;border:2px solid rgba(255,255,255,.42)}
.f-opt>.radio.is-on{border:0;box-shadow:0 0 0 4px rgba(196,60,242,.24),0 0 16px rgba(196,60,242,.75)}
.f-opt:hover>.radio:not(.is-on){border-color:rgba(255,255,255,.7)}
.f-opt:not(.is-on) .f-opt-chip{opacity:.85}
.f-opt-id{gap:6px}
.f-opt-id b{font-size:18px;font-weight:750;letter-spacing:-.01em;color:#fff}
.f-opt-id>span:last-child{font-size:13.5px;color:var(--text-2)}
.f-opt-p b{font-size:29px;font-weight:700}
.f-opt-p span{font-size:12px}
.f-opt-meter{grid-column:3 / -1}
.f-opt-meter .bar{height:6px}
.f-opt-meter .t{font-size:12px}
.f-opt:hover{border-color:rgba(190,165,255,.38)}
.f-opt.is-on{border:2px solid transparent;
  background:radial-gradient(90% 120% at 0% 0%,rgba(123,77,255,.45),transparent 60%) padding-box,linear-gradient(135deg,rgba(123,77,255,.32),rgba(196,60,242,.2) 60%,rgba(236,74,169,.16)) padding-box,linear-gradient(#15102f,#15102f) padding-box,var(--grad-ring) border-box;
  box-shadow:0 0 0 5px rgba(196,60,242,.12),0 22px 44px -18px rgba(196,60,242,.9)}
.f-opt.is-on .f-opt-p b{color:#fff;text-shadow:0 0 24px rgba(236,74,169,.55)}
.f-opt-flag{position:absolute;z-index:2;top:-11px;right:16px;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;color:#3b2200;
  background:linear-gradient(90deg,#ffe08a,#ffb238);box-shadow:0 6px 16px -6px rgba(255,178,56,.8)}
.f-opt-flag .ico{font-size:12px}

.f--m .f-pick .f-opts{flex:none;padding-top:22px;gap:14px}
.f--m .f-opt{padding:16px 14px;column-gap:12px;row-gap:12px}
.f--m .f-opt-chip{width:40px;height:40px;border-radius:11px;font-size:19px}
.f--m .f-opt>.radio{width:22px;height:22px;font-size:12px}
.f--m .f-opt-id b{font-size:16.5px}
.f--m .f-opt-id>span:last-child{font-size:12.5px}
.f--m .f-opt-p b{font-size:26px}
.f--m .f-opt-p span{font-size:11px}
.f--m .f-opt-meter .t{font-size:11px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
