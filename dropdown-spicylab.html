<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpicyLab · Mobile menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ================= Tokens (sampled from the desktop header) ================= */
  :root {
    --page:      #030712;
    --bar:       #070D1D;
    --surface:   #0F0B2A;
    --line:      #1D1645;
    --line-hi:   #4A289A;
    --divider:   #261D51;
    --text:      #FFFFFF;
    --nav:       #A2A0C2;
    --muted:     #79759D;

    --g-explore: linear-gradient(90deg, #E63ABE 0%, #AA39F6 100%);
    --g-cta:     linear-gradient(90deg, #8E5CF4 0%, #ED56AD 100%);
    --g-avatar:  linear-gradient(135deg, #823FF6 0%, #CC39E2 100%);
    --g-gift:    linear-gradient(90deg, #933EF1 0%, #BE3AE5 100%);
    --g-plus:    linear-gradient(135deg, #4E3CF3 0%, #6C3CF7 100%);
    --hot:       #FF3C26;

    --screen-h:  844px;          /* phone height in the preview frame */
    --gap:       12px;           /* header inset from the screen edge */
    --bar-h:     60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  ul { list-style: none; }
  a { color: inherit; text-decoration: none; }
  button, select { font: inherit; color: inherit; }
  svg { display: block; flex-shrink: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 18px;
    padding: 40px 16px;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(900px 600px at 50% 0%, #0B1230 0%, #02040B 70%);
    -webkit-font-smoothing: antialiased;
  }

  /* ================= Preview frame (desktop only) ================= */
  .phone {
    position: relative;
    width: 390px;
    height: var(--screen-h);
    overflow: hidden;
    border-radius: 44px;
    background: var(--page);
    box-shadow:
      0 0 0 10px #0C0E17,
      0 0 0 11px #262A3B,
      0 40px 90px -20px rgba(0, 0, 0, 0.8);
  }

  .caption {
    font-size: 13px;
    color: var(--muted);
  }

  /* ================= Page behind the header (placeholder) ================= */
  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: calc(var(--gap) + var(--bar-h) + 16px + env(safe-area-inset-top, 0px)) 12px 24px;
  }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px;
    margin-bottom: 14px;
    border-radius: 14px;
    border: 1px solid #141A2E;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    display: inline-grid;
    place-items: center;
    height: 30px;
    padding: 0 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    color: #C9CBD8;
    background: #121726;
    border: 1px solid #1C2236;
  }
  .chip.is-on { background: #fff; color: #0B0F1C; border-color: #fff; }
  .chip.icon { width: 30px; padding: 0; color: #9DA3B8; }
  .chip.icon svg { width: 14px; height: 14px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card {
    aspect-ratio: 3 / 4;
    border-radius: 14px;
    background: linear-gradient(160deg, #0F1630 0%, #080D1F 100%);
    border: 1px solid #10162A;
  }

  /* ================= Menu toggle (checkbox, no JS) ================= */
  .nav-toggle {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .backdrop {
    position: absolute;
    inset: 0;
    z-index: 40;
    background: rgba(2, 4, 12, 0.72);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease, visibility 0s linear .22s;
    cursor: pointer;
  }

  /* ================= Mobile header bar ================= */
  .m-header {
    position: absolute;
    top: calc(var(--gap) + env(safe-area-inset-top, 0px));
    left: var(--gap);
    right: var(--gap);
    z-index: 50;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: var(--bar-h);
    padding: 0 10px 0 14px;
    border-radius: 16px;
    border: 1px solid transparent;
    background:
      linear-gradient(var(--bar), var(--bar)) padding-box,
      linear-gradient(180deg, #5A31B8 0%, #291A54 45%, #291A54 100%) border-box;
    box-shadow: 0 0 16px 2px rgba(10, 30, 95, 0.55);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-right: auto;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  /* Swap for the real logo file */
  .brand img { width: 24px; height: 24px; }

  /* coin balance */
  .coins {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 5px 0 6px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .coin {
    position: relative;
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 800;
    color: #9A6200;
    background: radial-gradient(circle at 35% 30%, #FFE27A 0%, #FFC21F 50%, #DB9300 100%);
    box-shadow: inset 0 -1.5px 0 rgba(140, 80, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .coin-amount {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .coin-add {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--g-plus);
    box-shadow: 0 2px 8px -2px rgba(78, 60, 243, 0.8);
  }
  .coin-add svg { width: 12px; height: 12px; }

  /* avatar */
  .avatar {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: var(--g-avatar);
    box-shadow: 0 0 14px -2px rgba(140, 62, 243, 0.7);
  }

  /* burger */
  .burger {
    position: relative;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: border-color .2s ease, background-color .2s ease;
  }
  .burger span {
    position: absolute;
    left: 11px;
    width: 18px;
    height: 2px;
    border-radius: 2px;
    background: #D6D3F0;
    transition: transform .25s ease, opacity .2s ease, top .25s ease;
  }
  .burger span:nth-child(1) { top: 13px; }
  .burger span:nth-child(2) { top: 19px; }
  .burger span:nth-child(3) { top: 25px; }

  .nav-toggle:focus-visible ~ .m-header .burger {
    outline: 2px solid #AA39F6;
    outline-offset: 2px;
  }

  /* ================= Dropdown menu panel ================= */
  .menu {
    margin-top: 8px;
    max-height: calc(var(--screen-h) - var(--gap) * 2 - var(--bar-h) - 8px - env(safe-area-inset-top, 0px));
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 10px;
    border-radius: 18px;
    border: 1px solid transparent;
    background:
      linear-gradient(var(--bar), var(--bar)) padding-box,
      linear-gradient(180deg, #5A31B8 0%, #291A54 30%, #291A54 100%) border-box;
    box-shadow:
      0 24px 60px -12px rgba(0, 0, 0, 0.75),
      0 0 22px -6px rgba(90, 49, 184, 0.45);

    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.98);
    transform-origin: top right;
    transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s;
  }

  /* ---- subscription row ---- */
  .sub {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 58px;
    padding: 0 16px 0 9px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .gift {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--g-gift);
  }
  .gift svg { width: 18px; height: 18px; }
  .sub-text { display: grid; gap: 2px; margin-right: auto; }
  .sub-label {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sub-plan { font-size: 15px; font-weight: 700; }
  .sub > svg { width: 18px; height: 18px; color: var(--muted); }

  /* ---- nav list ---- */
  .m-nav {
    display: grid;
    gap: 2px;
    margin: 10px 0;
  }

  .m-link {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    padding: 0 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    color: var(--nav);
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease;
  }
  .m-link:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }

  .m-link.is-active {
    color: #fff;
    font-weight: 600;
    background: var(--g-explore);
    box-shadow: 0 8px 20px -10px rgba(230, 58, 190, 0.8);
  }

  .badge-hot,
  .badge-new {
    display: inline-grid;
    place-items: center;
    height: 17px;
    padding: 0 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.03em;
    color: #fff;
  }
  .badge-hot { background: var(--hot); }
  .badge-new { background: var(--g-plus); font-weight: 700; letter-spacing: 0; }

  /* AI Generators accordion */
  .m-group summary { list-style: none; }
  .m-group summary::-webkit-details-marker { display: none; }
  .m-group .chev {
    width: 16px;
    height: 16px;
    margin-left: auto;
    transition: transform .2s ease;
  }
  .m-group[open] > summary { color: var(--text); }
  .m-group[open] .chev { transform: rotate(180deg); }

  .m-sub {
    display: grid;
    gap: 2px;
    margin: 2px 0 6px 26px;
    padding-left: 12px;
    border-left: 1px solid var(--divider);
  }
  .m-sub a {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--nav);
  }
  .m-sub a:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }

  /* ---- bottom actions ---- */
  .m-actions {
    display: grid;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--divider);
  }

  .lang {
    position: relative;
    display: flex;
    align-items: center;
    height: 50px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--nav);
  }
  .lang svg { position: absolute; pointer-events: none; }
  .lang .globe { left: 16px; width: 18px; height: 18px; }
  .lang .chev  { right: 16px; width: 16px; height: 16px; }
  .lang select {
    width: 100%;
    height: 100%;
    padding: 0 44px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--nav);
    font-size: 15px;
    font-weight: 500;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  .lang select option { background: var(--bar); color: #fff; }

  .btn-download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 52px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    background: var(--g-cta);
    box-shadow: 0 10px 26px -10px rgba(237, 86, 173, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .btn-download svg { width: 18px; height: 18px; }

  :where(a, summary, select):focus-visible {
    outline: 2px solid #AA39F6;
    outline-offset: 2px;
  }

  /* ================= Open state ================= */
  .nav-toggle:checked ~ .backdrop {
    opacity: 1;
    visibility: visible;
    transition: opacity .22s ease, visibility 0s;
  }
  .nav-toggle:checked ~ .m-header .menu {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity .22s ease, transform .22s ease, visibility 0s;
  }
  .nav-toggle:checked ~ .m-header .burger {
    border-color: var(--line-hi);
    background: #150F38;
  }
  .nav-toggle:checked ~ .m-header .burger span:nth-child(1) { top: 19px; transform: rotate(45deg); }
  .nav-toggle:checked ~ .m-header .burger span:nth-child(2) { opacity: 0; }
  .nav-toggle:checked ~ .m-header .burger span:nth-child(3) { top: 19px; transform: rotate(-45deg); }
  .nav-toggle:checked ~ .screen { overflow: hidden; }

  /* ================= On a real phone: drop the frame ================= */
  @media (max-width: 520px) {
    body { display: block; padding: 0; background: var(--page); }
    .phone {
      --screen-h: 100dvh;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
    .caption { display: none; }
  }

  @media (max-width: 350px) {
    .brand span { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
