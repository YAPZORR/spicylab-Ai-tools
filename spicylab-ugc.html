<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spicy Lab · UGC Community Templates · Board + Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* ===== Board canvas & toolbar (tokens) ===== */
:root{
  color-scheme:dark;
  --canvas:#1e1e1e;--label-bg:#ffffff;--label-fg:#111111;
  --tb-bg:rgba(22,20,28,.94);--tb-fg:#f4f4f5;--tb-mut:#a1a1aa;--tb-line:rgba(255,255,255,.1);--tb-chip:rgba(255,255,255,.06);
  --note-bg:#2a2a2e;--note-fg:#e4e4e7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#1e1e1e;--label-bg:#ffffff;--label-fg:#111111;--tb-bg:rgba(22,20,28,.94);--tb-fg:#f4f4f5;--tb-mut:#a1a1aa;--tb-line:rgba(255,255,255,.1);--tb-chip:rgba(255,255,255,.06);--note-bg:#2a2a2e;--note-fg:#e4e4e7}}
:root[data-theme="dark"]{--canvas:#1e1e1e;--label-bg:#ffffff;--label-fg:#111111;--tb-bg:rgba(22,20,28,.94);--tb-fg:#f4f4f5;--tb-mut:#a1a1aa;--tb-line:rgba(255,255,255,.1);--tb-chip:rgba(255,255,255,.06);--note-bg:#2a2a2e;--note-fg:#e4e4e7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--tb-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tb-bg)}
button{font:inherit}

#tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--tb-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--tb-line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;font-size:13px}
#tb .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;margin-right:6px;white-space:nowrap}
#tb .brand small{font-weight:600;color:var(--tb-mut);font-size:12px}
#tb .grp{display:flex;align-items:center;gap:2px;background:var(--tb-chip);border:1px solid var(--tb-line);border-radius:10px;padding:3px}
#tb .grp button,#tb .tbtn{border:0;background:transparent;color:var(--tb-mut);padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
#tb .grp button.on{background:#fff;color:#111}
#tb .tbtn{border:1px solid var(--tb-line);background:var(--tb-chip);color:var(--tb-fg)}
#tb .tog{display:flex;align-items:center;gap:7px;color:var(--tb-mut);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;user-select:none}
#tb .tog i{width:30px;height:17px;border-radius:9px;background:#3f3f46;position:relative;transition:.2s}
#tb .tog i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s}
#tb .tog.on i{background:#ec4899}#tb .tog.on i::after{left:15px}
#tb .sep{width:1px;height:22px;background:var(--tb-line)}
#tb select{background:var(--tb-chip);color:var(--tb-fg);border:1px solid var(--tb-line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;max-width:280px}
#tb .route{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#f9a8d4;background:rgba(236,72,153,.1);border:1px solid rgba(236,72,153,.3);padding:4px 8px;border-radius:6px;white-space:nowrap}
#tb .push{margin-left:auto}
#tb .only-proto,#tb .only-board{display:contents}
body.mode-board #tb .only-proto{display:none}
body.mode-proto #tb .only-board{display:none}

#boardView{overflow-x:auto;overflow-y:hidden}
.board{width:2560px;padding:70px 80px 160px;background:var(--canvas)}
.b-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:56px;color:#fff}
.b-head h1{font-size:64px;line-height:1;margin:0 0 14px;font-weight:800;letter-spacing:-1.5px}
.b-head p{margin:0;font-size:20px;color:#bdbdc6;max-width:1200px;line-height:1.5}
.b-legend{display:flex;gap:26px;font-size:17px;color:#d4d4d8;flex-wrap:wrap;justify-content:flex-end}
.b-legend span{display:flex;align-items:center;gap:10px}
.b-label{background:var(--label-bg);color:var(--label-fg);text-align:center;font-weight:800;font-size:40px;padding:16px 20px;margin:140px 0 64px;letter-spacing:-.3px}
.b-label:first-of-type{margin-top:40px}
.b-pair{margin-bottom:110px}
.b-pair-h{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;margin-bottom:22px}
.b-pair-h h3{margin:0 0 10px;font-size:30px;color:#fff;font-weight:800;letter-spacing:-.3px}
.b-notes{display:flex;flex-wrap:wrap;gap:10px 14px;max-width:2000px}
.b-note{background:var(--note-bg);color:var(--note-fg);border-radius:10px;padding:9px 14px;font-size:16px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.b-note b{color:#fff}
.b-open{flex:none;background:#fff;color:#111;border:0;border-radius:12px;padding:14px 20px;font-weight:800;font-size:17px;cursor:pointer;display:flex;gap:10px;align-items:center}
.b-row{display:flex;gap:60px;align-items:flex-start}
.b-cap{display:flex;gap:12px;align-items:center;margin-bottom:14px;color:#a1a1aa;font-size:17px;font-weight:700}
.b-cap code{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:#f9a8d4;background:rgba(236,72,153,.1);border:1px solid rgba(236,72,153,.25);padding:4px 10px;border-radius:7px;font-weight:500}
.board .frame{pointer-events:none}
.board .frame.fixed .scroller{overflow:hidden}

#protoView{padding:26px 20px 60px}
.stage{display:flex;gap:60px;align-items:flex-start;justify-content:center;width:max-content;margin:0 auto}
.pcol .plabel{display:flex;gap:10px;align-items:center;color:#a1a1aa;font-size:14px;font-weight:700;margin:0 0 12px}
body.dev-only-d .pcol.m,body.dev-only-m .pcol.d{display:none}

/* yellow spec markers (board only) */
.mk{position:absolute;z-index:30;width:30px;height:30px;border-radius:50%;background:#fde047;color:#111;font:800 15px/30px 'Plus Jakarta Sans',system-ui,sans-serif;text-align:center;box-shadow:0 0 0 3px rgba(0,0,0,.6);pointer-events:none}
.b-note .mk{position:static;flex:none;width:26px;height:26px;line-height:26px;font-size:13px;box-shadow:none}
.b-legend .mk{position:static;box-shadow:none}
.exist{outline:2px dashed rgba(255,255,255,.35);outline-offset:6px}

/* ===== Product frame (Spicy Lab) ===== */
.frame{--bg:#0a0717;--panel:#140f2c;--panel2:#1a1438;--panel3:#231b4a;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --txt:#f4f1ff;--mut:#a49dc8;--dim:#6d6690;--pink:#ec4899;--mag:#d946ef;--pur:#a855f7;--vio:#7c3aed;--teal:#2dd4bf;--amber:#fbbf24;--red:#fb7185;--green:#34d399;
  --grad:linear-gradient(90deg,#f0388f,#c026d3);--grad2:linear-gradient(135deg,#ec4899,#a855f7);
  position:relative;overflow:hidden;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.5);flex:none}
.frame.dev-m{border-radius:46px;box-shadow:0 0 0 10px #08070c,0 0 0 11px #2a2a30,0 30px 90px rgba(0,0,0,.6)}
.frame.fixed .scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3b2f6b transparent}
.frame.auto .scroller{position:relative}
.scroller{background:radial-gradient(1400px 700px at 50% 100%,rgba(124,58,237,.28),transparent 70%),radial-gradient(1000px 520px at 12% -4%,rgba(236,72,153,.09),transparent 70%),var(--bg);min-height:100%}
.frame a{color:inherit;text-decoration:none}
.frame button{color:inherit}
.frame [data-a]{cursor:pointer}
.frame :focus-visible{outline:2px solid #f472b6;outline-offset:2px}
.ic{display:inline-block;vertical-align:middle;flex:none}

/* status bar (mobile) */
.sbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:700;font-size:15px;position:sticky;top:0;z-index:41;background:#0b0819}
.sbar .si{display:flex;gap:6px;align-items:center}
.sbar .sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sbar .sig b{width:3px;background:#fff;border-radius:1px}
.sbar .bat{width:24px;height:12px;border:1.5px solid rgba(255,255,255,.6);border-radius:4px;padding:1.5px;position:relative}.sbar .bat::after{content:"";display:block;height:100%;width:80%;background:#fff;border-radius:1.5px}

/* nav desktop */
.nav{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid var(--line);background:rgba(10,7,23,.86);backdrop-filter:blur(14px);position:sticky;top:0;z-index:40}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo .lg{width:34px;height:34px;border-radius:11px;background:radial-gradient(circle at 30% 25%,#ff8fb8,#ec4899 45%,#9d174d);display:grid;place-items:center;box-shadow:0 6px 18px rgba(236,72,153,.45)}
.navgrp{display:flex;gap:3px;padding:5px;border:1px solid var(--line2);border-radius:15px;background:rgba(255,255,255,.02)}
.navgrp a{padding:9px 15px;border-radius:11px;color:var(--mut);display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.navgrp a:hover{color:#fff;background:rgba(255,255,255,.04)}
.navgrp a.on{background:var(--grad);color:#fff;box-shadow:0 6px 20px -4px rgba(236,72,153,.55)}
.hotb{font-size:9.5px;font-weight:800;background:#f43f5e;color:#fff;padding:2px 5px;border-radius:5px;letter-spacing:.3px}
.navr{display:flex;align-items:center;gap:10px;position:relative}
.coins{display:flex;align-items:center;gap:9px;padding:5px 5px 5px 12px;border:1px solid var(--line2);border-radius:999px;font-weight:800;font-size:14px}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#fbbf24 50%,#d97706);box-shadow:inset 0 0 0 2px rgba(180,83,9,.35);display:inline-block;flex:none}
.coin.s{width:14px;height:14px}
.getc{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:999px;padding:6px 6px 6px 12px;font-size:11px;font-weight:800;letter-spacing:.4px}
.getc i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal}
.lang{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line2);border-radius:999px;color:var(--mut);font-size:13px;font-weight:600}
.dl{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:linear-gradient(90deg,#8b5cf6,#ec4899);font-weight:700;font-size:13px}
.avbtn{position:relative;border-radius:50%}
.avbtn .dot{position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:#f43f5e;border:2px solid #0a0717}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;color:#fff;flex:none;letter-spacing:-.3px}
.av-me{background:linear-gradient(135deg,#a855f7,#ec4899)}
.av-1{background:linear-gradient(135deg,#f97316,#ec4899)}
.av-2{background:linear-gradient(135deg,#06b6d4,#8b5cf6)}
.av-3{background:linear-gradient(135deg,#facc15,#f97316)}
.av-4{background:linear-gradient(135deg,#22c55e,#06b6d4)}
.av-5{background:linear-gradient(135deg,#be123c,#7c3aed)}
.av-6{background:linear-gradient(135deg,#f472b6,#fde68a)}
.av-7{background:linear-gradient(135deg,#3b82f6,#22d3ee)}
.av-8{background:linear-gradient(135deg,#64748b,#a855f7)}
.av-brand{background:radial-gradient(circle at 30% 25%,#ff8fb8,#ec4899 45%,#9d174d)}
.av-u{background:linear-gradient(135deg,#334155,#6366f1)}

/* nav mobile */
.navm{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(11,8,25,.92);backdrop-filter:blur(14px);position:sticky;top:48px;z-index:40}
.navm .r{display:flex;align-items:center;gap:8px}
.navm .coins{padding:4px 4px 4px 10px;font-size:13px;gap:7px}
.navm .plus{width:24px;height:24px;border-radius:50%;background:var(--grad);display:grid;place-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;background:rgba(255,255,255,.03)}

/* popovers */
.pop{position:absolute;z-index:80;background:#171033;border:1px solid rgba(168,85,247,.35);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:10px}
.amenu{top:56px;right:0;width:360px}
.amenu .head{display:flex;gap:12px;align-items:center;padding:10px 10px 14px;border-bottom:1px solid var(--line)}
.amenu .head b{display:block;font-size:15px}.amenu .head small{color:var(--mut);font-size:12.5px}
.mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14px;color:#e9e5ff}
.mi:hover{background:rgba(255,255,255,.05)}
.mi .ct{margin-left:auto;font-size:11px;font-weight:800;background:#f43f5e;color:#fff;border-radius:999px;padding:2px 7px}
.mi .ar{margin-left:auto;color:var(--dim)}
.mh{font-size:12px;font-weight:700;color:var(--dim);padding:12px 12px 6px;display:flex;justify-content:space-between}
.nt{display:flex;gap:11px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.4}
.nt:hover{background:rgba(255,255,255,.04)}
.nt .ni{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.nt .ni.ok{background:rgba(52,211,153,.14);color:#6ee7b7}.nt .ni.bad{background:rgba(251,113,133,.14);color:#fda4af}.nt .ni.coin2{background:rgba(251,191,36,.14);color:#fcd34d}
.nt small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.nt.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ec4899;margin-left:6px;vertical-align:middle}

/* hero */
.hero{text-align:center;padding:46px 20px 28px}
.hero h1{font-size:54px;line-height:1.05;margin:0 0 12px;font-weight:800;letter-spacing:-1.6px}
.gt{background:linear-gradient(90deg,#f472b6,#d946ef 60%,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--mut);font-size:15px}
.dev-m .hero{padding:26px 18px 18px}
.dev-m .hero h1{font-size:34px;letter-spacing:-1px}
.dev-m .hero p{font-size:13.5px;max-width:300px;margin:0 auto}

/* studio card */
.studio{width:1240px;margin:0 auto;border-radius:26px;position:relative;
  background:linear-gradient(180deg,#161033,#100b25) padding-box,linear-gradient(170deg,rgba(168,85,247,.55),rgba(236,72,153,.12) 40%,rgba(168,85,247,.15) 70%,rgba(236,72,153,.65)) border-box;
  border:1px solid transparent;box-shadow:0 40px 140px -30px rgba(217,70,239,.45)}
.dev-m .studio{width:auto;margin:0 12px;border-radius:22px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.tab{position:relative;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.015)}
.tab .tib{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.05);display:grid;place-items:center;color:#d8d2f5;flex:none}
.tab b{display:block;font-size:14.5px}.tab small{color:var(--mut);font-size:12px}
.tab.on{background:linear-gradient(180deg,rgba(168,85,247,.2),rgba(236,72,153,.06));border-color:rgba(236,72,153,.5)}
.tab.on .tib{background:var(--grad2);color:#fff;box-shadow:0 6px 18px -4px rgba(236,72,153,.6)}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 14px #ec4899}
.dev-m .tabs{gap:6px;padding:10px}
.dev-m .tab{flex-direction:column;gap:6px;padding:10px 4px;text-align:center}
.dev-m .tab .tib{width:32px;height:32px;border-radius:9px}
.dev-m .tab b{font-size:10.5px;line-height:1.2}.dev-m .tab small{display:none}

.sbody{display:grid;grid-template-columns:300px 1fr;gap:24px;padding:22px}
.sbody.one{grid-template-columns:1fr}
.dev-m .sbody{grid-template-columns:1fr;padding:14px;gap:16px}
.ups{display:flex;flex-direction:column;gap:0;position:relative}
.ups.row{flex-direction:row;gap:0;align-items:stretch}
.ups.row .drop{flex:1}
.dev-m .ups.row{flex-direction:column}
.drop{position:relative;border:1.5px dashed rgba(168,85,247,.38);border-radius:18px;background:radial-gradient(ellipse at 50% 0%,rgba(168,85,247,.14),transparent 70%),rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 16px;min-height:158px;gap:8px}
.drop .pb{width:44px;height:44px;border-radius:13px;background:rgba(168,85,247,.22);display:grid;place-items:center;border:1px solid rgba(168,85,247,.4)}
.drop .t{font-weight:800;font-size:12.5px;letter-spacing:2.2px}
.drop .s{color:var(--mut);font-size:11.5px}
.drop.teal{border-color:rgba(45,212,191,.45);background:radial-gradient(ellipse at 50% 35%,rgba(45,212,191,.2),transparent 70%),rgba(13,60,66,.32)}
.drop.teal .pb{background:rgba(45,212,191,.16);border-color:rgba(45,212,191,.45);color:#99f6e4}
.drop.need{border-color:#f472b6;box-shadow:0 0 0 4px rgba(236,72,153,.15),inset 0 0 40px rgba(236,72,153,.12)}
.drop .fmt{display:flex;gap:5px}.drop .fmt span{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(45,212,191,.15);color:#99f6e4}
.conn{width:36px;height:36px;border-radius:50%;background:var(--grad2);display:grid;place-items:center;margin:-11px auto;position:relative;z-index:2;box-shadow:0 0 0 5px #120d2a,0 6px 20px rgba(236,72,153,.5)}
.ups.row .conn{margin:auto -14px;align-self:center}
.dev-m .ups.row .conn{margin:-11px auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumb{position:relative;width:86px;height:110px;border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
.thumb.big{width:120px;height:154px}
.thumb .x{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.tagl{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(20,14,44,.85);border:1px solid var(--line2);z-index:2}
.tagl.teal{border-color:rgba(45,212,191,.5);color:#99f6e4}
.addmore{width:86px;height:110px;border-radius:12px;border:1.5px dashed rgba(168,85,247,.4);display:grid;place-items:center;align-content:center;gap:4px;color:var(--mut);font-size:11px}
.demo{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;background:rgba(6,4,16,.5);border:1px solid rgba(45,212,191,.35);text-align:left}
.demo .dt{width:46px;height:58px;border-radius:9px;overflow:hidden;flex:none;position:relative}
.demo b{display:block;font-size:12.5px}.demo small{color:var(--mut);font-size:11px}
.privacy{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11.5px;margin-top:10px}
.selbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:linear-gradient(90deg,#db2777,#c026d3);font-size:12px;font-weight:700}

.plab{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;position:relative}
.req{font-size:10.5px;font-weight:700;color:#f9a8d4;background:rgba(236,72,153,.15);padding:2px 8px;border-radius:6px}
.phint{color:var(--mut);font-size:12.5px;margin:3px 0 10px}
.pbox{position:relative;border:1px solid var(--line2);border-radius:16px;background:rgba(6,4,16,.55);padding:14px;min-height:160px;display:flex;flex-direction:column;gap:10px}
.pbox:focus-within{border-color:rgba(236,72,153,.55);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
.pbox textarea{flex:1;background:transparent;border:0;outline:none;color:#fff;font:inherit;font-size:14.5px;line-height:1.55;resize:none;min-height:78px;width:100%}
.pbox textarea::placeholder{color:#5f5884}
.pfoot{display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:12px}
.kbd{display:inline-block;padding:2px 7px;border:1px solid var(--line2);border-radius:6px;font-size:11px;color:var(--mut);background:rgba(255,255,255,.03)}
.loaded{align-self:flex-start;position:relative;display:inline-flex;gap:8px;align-items:center;padding:5px 6px 5px 10px;border-radius:999px;background:linear-gradient(90deg,rgba(236,72,153,.18),rgba(168,85,247,.14));border:1px solid rgba(236,72,153,.45);font-size:12.5px;font-weight:600;max-width:100%}
.loaded .xx{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.loaded b{font-weight:800}
.effchip{align-self:flex-start;display:inline-flex;gap:7px;align-items:center;padding:4px 6px 4px 10px;border-radius:999px;background:rgba(168,85,247,.16);border:1px solid rgba(168,85,247,.45);font-size:12px;font-weight:600}
.togs{display:flex;align-items:center;gap:26px;margin-top:14px;flex-wrap:wrap}
.togi{display:flex;align-items:center;gap:10px}
.togi b{display:block;font-size:13px}.togi small{display:block;color:var(--mut);font-size:11.5px}
.sw{width:42px;height:24px;border-radius:12px;background:#2c2552;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--grad2)}.sw.on::after{left:21px}
.togs .eng{margin-left:auto;color:var(--dim);font-size:12px}
.dev-m .togs{gap:14px}.dev-m .togs .eng{display:none}

/* effects / community */
.eff{padding:8px 22px 4px;border-top:1px solid var(--line)}
.dev-m .eff{padding:6px 14px 4px}
.effh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:16px 0 12px}
.effh h4{margin:0;font-size:16px;font-weight:800}.effh p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dev-m .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-14px;padding:12px 14px 2px 0;margin-top:-12px}
.dev-m .chips::-webkit-scrollbar{display:none}
.dev-m .sech{flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:#ddd7fb;white-space:nowrap;background:rgba(255,255,255,.015)}
.chip .n{font-size:10.5px;font-weight:800;min-width:19px;height:19px;border-radius:999px;background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0 5px}
.chip.on{background:rgba(168,85,247,.22);border-color:rgba(192,132,252,.75);color:#fff}
.chip.on .n{background:var(--pink);color:#fff}
.chip.comm{border-color:rgba(236,72,153,.4)}
.chip.comm.on{background:linear-gradient(90deg,rgba(236,72,153,.35),rgba(168,85,247,.3));border-color:#f472b6}
.newb{font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:5px;background:linear-gradient(90deg,#8b5cf6,#d946ef);color:#fff}
.chiprow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--line2);gap:2px}
.seg a{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mut);display:flex;gap:6px;align-items:center}
.seg a.on{background:rgba(168,85,247,.3);color:#fff;box-shadow:inset 0 0 0 1px rgba(192,132,252,.6)}
.dev-m .chiprow{flex-direction:column;align-items:stretch;gap:10px}
.dev-m .chiprow .seg{align-self:flex-start}

.tgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px 12px}
.dev-m .tgrid{grid-template-columns:repeat(2,1fr);gap:14px 10px}
.tcard{position:relative;min-width:0}
.tc-cv{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid var(--line);isolation:isolate}
.tc-cv .bdg{position:absolute;top:8px;left:8px;z-index:3}
.bdg{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:6px;color:#fff}
.bdg.HOT{background:#ec4899}.bdg.NEW{background:#8b5cf6}
.tc-mode{position:absolute;top:8px;right:8px;z-index:3;width:24px;height:24px;border-radius:8px;background:rgba(10,7,23,.55);backdrop-filter:blur(4px);display:grid;place-items:center}
.tc-ttl{position:absolute;inset:auto 0 0 0;z-index:2;padding:30px 10px 9px;background:linear-gradient(180deg,transparent,rgba(6,3,16,.88));font-weight:800;font-size:13px;line-height:1.25;letter-spacing:-.1px}
.tc-hov{position:absolute;inset:0;z-index:4;background:rgba(12,7,30,.62);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;transition:opacity .18s}
.tcard:hover .tc-hov,.tcard.is-hover .tc-hov{opacity:1}
.tcard.is-hover .tc-cv{border-color:#f472b6;box-shadow:0 0 0 2px rgba(236,72,153,.35)}
.tc-hov .st{display:flex;gap:12px;font-weight:800;font-size:13px}.tc-hov .st span{display:flex;gap:5px;align-items:center}
.usebtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;color:#1a1033;font-weight:800;font-size:12.5px}
.tc-meta{padding:8px 2px 0;position:relative}
.tc-by{display:flex;align-items:center;gap:6px;font-size:12px;color:#cfc8f2;font-weight:600;min-width:0}
.tc-by span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-by .vf{color:#f472b6}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.pro{background:linear-gradient(90deg,#7c3aed,#c026d3);border-color:transparent;color:#fff}
.pill.mode{background:rgba(255,255,255,.09);border-color:transparent;color:#e9e5ff}
.pill.lg{font-size:12.5px;padding:6px 11px;border-radius:9px}
.pager{display:flex;justify-content:center;gap:6px;margin:20px 0 6px}
.pager a{min-width:32px;height:32px;padding:0 8px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.pager a.on{background:rgba(168,85,247,.3);border-color:#c084fc;color:#fff}
.pager a.dis{opacity:.35}
.pager a.nx{background:var(--grad2);border:0;color:#fff}

/* settings dock */
.dock{position:sticky;bottom:18px;z-index:20;margin:16px 22px 22px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 10px;padding:12px 12px 12px 16px;border-radius:20px;background:rgba(22,15,48,.94);border:1px solid rgba(168,85,247,.32);backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.dg{display:flex;flex-direction:column;gap:6px}
.dg .dl2{display:flex;justify-content:space-between;gap:18px;font-size:11.5px;font-weight:700;color:#cfc8f2}
.dg .dl2 span{color:var(--dim);font-weight:600}
.opts{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(6,4,16,.6);border:1px solid var(--line)}
.opt{padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.opt.on{background:rgba(168,85,247,.32);color:#fff;box-shadow:inset 0 0 0 1px rgba(192,132,252,.55)}
.opt .pl{font-size:9px;font-weight:800;padding:2px 5px;border-radius:5px;background:linear-gradient(90deg,#7c3aed,#c026d3);color:#fff;display:inline-flex;gap:3px;align-items:center}
.gen{margin-left:auto;height:54px;padding:0 9px 0 20px;border-radius:999px;background:var(--grad);box-shadow:0 12px 32px -6px rgba(236,72,153,.7);display:flex;align-items:center;gap:14px;font-weight:800;font-size:15.5px;border:0;color:#fff;position:relative;white-space:nowrap}
.gen .cost{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 11px;display:flex;gap:6px;align-items:center;font-size:13px}
.adj{margin:0 22px 18px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:12.5px}
.adj a{margin-left:auto;font-weight:800;color:#fff;text-decoration:underline}
.dev-m .adj{margin:0 14px 14px}

/* mobile settings */
.msets{padding:6px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);margin-top:12px}
.msets .dl2{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px}
.msets .dl2 span{color:var(--dim);font-weight:600}
.mlist{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:rgba(6,4,16,.4)}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow b{display:block;font-size:13.5px}.mrow small{color:var(--mut);font-size:11.5px}
.mrow .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--pink);display:grid;place-items:center}
.mrow.on{background:rgba(168,85,247,.16);box-shadow:inset 0 0 0 1px rgba(192,132,252,.45)}
.msets .opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.msets .opt{justify-content:center;padding:10px 6px}
.mgen{position:sticky;bottom:0;z-index:30;padding:12px 14px 22px;background:linear-gradient(180deg,transparent,#0a0717 35%)}
.mgen .gen{width:100%;justify-content:center;margin:0}

/* history */
.hist{width:1240px;margin:56px auto 0;padding-bottom:40px}
.dev-m .hist{width:auto;margin:30px 14px 0}
.hist.inner,.dev-m .hist.inner{width:auto;margin:0;padding-bottom:0}
.hist.inner .hgrid{grid-template-columns:repeat(5,1fr)}
.dev-m .hist.inner .hgrid{grid-template-columns:repeat(2,1fr)}
.sech{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:16px}
.sech h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.dev-m .sech h3{font-size:18px}
.hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.dev-m .hgrid{grid-template-columns:repeat(2,1fr);gap:10px}
.hcard{border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden;position:relative}
.hcard .cvw{position:relative;aspect-ratio:4/5}
.hcard .inf{padding:10px 12px 12px}
.hcard .inf b{font-size:13.5px;display:block}.hcard .inf small{color:var(--dim);font-size:11.5px}
.hact{display:flex;gap:6px;margin-top:10px}
.pubbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;border-radius:10px;background:var(--grad);font-weight:800;font-size:11.5px;white-space:nowrap;padding:0 6px;box-shadow:0 6px 16px -6px rgba(236,72,153,.7);position:relative}
.sqbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.stchip{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:10px;font-weight:700;font-size:12px;border:1px solid var(--line2);color:var(--mut)}
.stchip.review{color:#fcd34d;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07)}
.stchip.published{color:#6ee7b7;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.07)}
.stchip.rejected{color:#fda4af;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.07)}
.prog{position:absolute;inset:0;background:rgba(10,6,25,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:12.5px;z-index:3}
.prog .bar{width:70%;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vbdg{position:absolute;bottom:8px;left:8px;z-index:3;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.5);display:flex;gap:4px;align-items:center}

/* covers */
.cv{position:absolute;inset:0;overflow:hidden}
.sil::before{content:"";position:absolute;left:50%;top:27%;width:27%;aspect-ratio:1/1.12;border-radius:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(14,8,32,.42),rgba(14,8,32,.62));z-index:1}
.sil::after{content:"";position:absolute;left:50%;bottom:-14%;width:70%;height:48%;border-radius:50% 50% 12% 12%/60% 60% 10% 10%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(14,8,32,.5),rgba(14,8,32,.78));z-index:1}
.cv-beach{background:radial-gradient(circle at 50% 54%,#ffe08a 0 7%,rgba(255,224,138,.35) 11%,transparent 22%),linear-gradient(180deg,#ff9a6b 0%,#ff5f8f 34%,#ffb38a 54%,#3f6aa1 55%,#26386b 100%)}
.cv-neon{background:radial-gradient(ellipse at 18% 28%,rgba(236,72,153,.85),transparent 45%),radial-gradient(ellipse at 84% 72%,rgba(34,211,238,.75),transparent 45%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px),linear-gradient(160deg,#0b0b2a,#1c0b33)}
.cv-golden{background:radial-gradient(circle at 72% 22%,#fff6c2 0 9%,rgba(255,246,194,.4) 16%,transparent 38%),linear-gradient(170deg,#f8cc5c,#f08a4b 48%,#b8456b)}
.cv-cyber{background:repeating-linear-gradient(0deg,rgba(236,72,153,.45) 0 1px,transparent 1px 16px) 0 100%/100% 38% no-repeat,repeating-linear-gradient(90deg,rgba(168,85,247,.4) 0 1px,transparent 1px 22px) 0 100%/100% 38% no-repeat,radial-gradient(circle at 50% 62%,#ff5cad 0 12%,transparent 13%),linear-gradient(180deg,#120a33,#3b0d5c 60%,#7a1257)}
.cv-anime{background:radial-gradient(circle,#fff 0 1.4px,transparent 2px) 0 0/34px 34px,radial-gradient(circle at 70% 25%,rgba(255,255,255,.7),transparent 30%),linear-gradient(160deg,#fbc2eb,#c3a6ee 55%,#8fb8ee)}
.cv-studio{background:radial-gradient(ellipse at 50% 30%,#6a5f84 0%,#2a2340 48%,#110d1c 100%)}
.cv-carpet{background:conic-gradient(from 195deg at 50% -8%,transparent 0 8deg,rgba(255,236,190,.28) 12deg,transparent 18deg 28deg,rgba(255,236,190,.22) 32deg,transparent 38deg),linear-gradient(180deg,#3a0712,#8e0e2b 62%,#d0234a)}
.cv-elven{background:radial-gradient(circle at 50% 36%,rgba(167,243,208,.75),transparent 40%),radial-gradient(circle,rgba(190,255,220,.9) 0 1px,transparent 2px) 0 0/26px 30px,linear-gradient(180deg,#042f2a,#0b6b4f 52%,#0d3b2c)}
.cv-night{background:radial-gradient(circle,#fff 0 .9px,transparent 1.6px) 0 0/26px 26px,radial-gradient(circle at 78% 18%,#fff8d6 0 5%,transparent 7%),linear-gradient(180deg,#050a24,#1b1f5e 66%,#4c2a85)}
.cv-retro{background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 40%,rgba(255,220,170,.45),transparent 60%),linear-gradient(160deg,#d9a066,#a0522d 60%,#4a2511)}
.cv-rain{background:repeating-linear-gradient(104deg,rgba(255,255,255,.13) 0 1px,transparent 1px 9px),radial-gradient(ellipse at 30% 80%,rgba(250,204,21,.25),transparent 40%),linear-gradient(180deg,#1f2a44,#3c4f76 62%,#6f8fb5)}
.cv-aurora{background:radial-gradient(ellipse at 28% 22%,rgba(52,211,153,.75),transparent 50%),radial-gradient(ellipse at 72% 30%,rgba(167,139,250,.75),transparent 52%),radial-gradient(circle,#fff 0 .8px,transparent 1.5px) 0 0/30px 30px,linear-gradient(180deg,#071226,#0b1d3a)}
.cv-snow{background:radial-gradient(circle,#fff 0 1.5px,transparent 2px) 0 0/22px 22px,linear-gradient(180deg,#b5d0ee,#e8f1fb 56%,#9fb7d3 57%,#6d86a8)}
.cv-vapor{background:radial-gradient(circle at 50% 46%,#ffd166 0 14%,transparent 15%),repeating-linear-gradient(0deg,rgba(5,255,161,.4) 0 1px,transparent 1px 14px) 0 100%/100% 34% no-repeat,linear-gradient(180deg,#ff71ce 0%,#b967ff 62%,#1f0b4d 100%)}
.cv-sakura{background:radial-gradient(circle,rgba(255,255,255,.9) 0 2px,transparent 3px) 0 0/40px 46px,radial-gradient(circle,rgba(251,207,232,.9) 0 3px,transparent 4px) 18px 22px/40px 46px,linear-gradient(170deg,#fde2ef,#f9a8d4 55%,#a855f7)}
.cv-desert{background:radial-gradient(ellipse at 30% 100%,#c2410c 0 40%,transparent 41%),radial-gradient(ellipse at 80% 100%,#9a3412 0 35%,transparent 36%),radial-gradient(circle at 70% 30%,#fff7d6 0 6%,transparent 8%),linear-gradient(180deg,#fdba74,#fb923c 60%,#ea580c)}
.cv-ocean{background:repeating-radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.08) 0 2px,transparent 2px 14px),linear-gradient(180deg,#0ea5e9,#1e3a8a 65%,#0b1638)}
.cv-lava{background:radial-gradient(ellipse at 50% 100%,#fb923c 0 18%,#dc2626 30%,transparent 55%),radial-gradient(circle,rgba(253,186,116,.8) 0 1.5px,transparent 2.5px) 0 0/30px 34px,linear-gradient(180deg,#0c0a09,#3b0a0a 70%)}
.cv-mint{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),transparent 35%),linear-gradient(160deg,#a7f3d0,#5eead4 50%,#0e7490)}
.cv-dusk{background:radial-gradient(circle at 50% 70%,#fda4af 0 10%,transparent 30%),linear-gradient(180deg,#312e81,#7e22ce 55%,#f472b6)}
.cv-me{background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.35),transparent 35%),linear-gradient(160deg,#c084fc,#f472b6 60%,#fb7185)}

/* generic page bits */
.pg{min-height:100%}
.wrap{width:1400px;margin:0 auto}
.dev-m .wrap{width:auto;margin:0 14px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;padding:28px 0 18px}
.crumb a{display:flex;gap:6px;align-items:center;color:#e9e5ff;font-weight:700}
.crumb i{color:var(--dim);font-style:normal}
.dev-m .crumb{padding:16px 0 12px;font-size:12px}
.foot{border-top:1px solid var(--line);margin-top:70px;padding:26px 56px;color:var(--dim);font-size:12.5px;display:flex;justify-content:space-between}
.dev-m .foot{margin-top:40px;padding:20px 16px 90px;flex-direction:column;gap:6px}

/* template detail */
.det{display:grid;grid-template-columns:1fr 600px;gap:56px;padding-bottom:20px}
.dev-m .det{grid-template-columns:minmax(0,1fr);gap:20px}
.pv{position:relative;height:800px;border-radius:26px;overflow:hidden;border:1px solid var(--line2);background:#000}
.pv .blur{position:absolute;inset:-40px;filter:blur(40px) saturate(1.2);opacity:.65}
.pv .media{position:absolute;top:28px;bottom:84px;left:50%;transform:translateX(-50%);aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pv .media .cv{animation:kb 9s ease-in-out infinite alternate}
.pv.sq .media{aspect-ratio:3/4}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-2%)}}
@media (prefers-reduced-motion:reduce){.pv .media .cv{animation:none}.spin{animation:none}}
.pv .ctl{position:absolute;left:24px;right:24px;bottom:22px;height:44px;border-radius:14px;background:rgba(10,7,23,.7);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;padding:0 16px;border:1px solid var(--line2)}
.pv .ctl .tr{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.pv .ctl .tr i{display:block;height:100%;width:38%;background:var(--grad);animation:prog 9s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.pv .loop{position:absolute;top:22px;left:22px;z-index:3;display:flex;gap:6px;align-items:center;padding:6px 11px;border-radius:999px;background:rgba(10,7,23,.65);font-size:12px;font-weight:700;border:1px solid var(--line2)}
.dev-m .pv{height:520px;border-radius:20px}
.dev-m .pv .media{top:16px;bottom:72px}
.dev-m .pv .ctl{left:12px;right:12px;bottom:12px}
.dinfo h1{font-size:40px;line-height:1.1;margin:6px 0 18px;letter-spacing:-1px;font-weight:800}
.dev-m .dinfo h1{font-size:28px;margin:0 0 14px}
.dmode{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:700;color:#f9a8d4;padding:5px 11px;border-radius:999px;background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.35)}
.crow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.crow b{display:block;font-size:15px}.crow small{color:var(--mut);font-size:12.5px}
.crow .btn{margin-left:auto}
.stats{display:flex;align-items:center;gap:18px;margin:18px 0 22px;font-weight:700;font-size:14px;color:#e9e5ff;flex-wrap:wrap}
.stats span{display:flex;align-items:center;gap:7px}
.stats .acts{margin-left:auto;display:flex;gap:8px}
.dsec{margin-top:20px}
.dsec h5{margin:0 0 10px;font-size:13px;font-weight:800;color:#cfc8f2;display:flex;gap:8px;align-items:center}
.dsec p{margin:0;color:#d6d0f5;font-size:14px;line-height:1.6}
.promptro{padding:14px 16px;border-radius:14px;background:rgba(6,4,16,.55);border:1px solid var(--line2);font-size:14px;line-height:1.6;color:#e9e5ff;position:relative}
.promptro .cp{position:absolute;top:10px;right:10px}
.note{font-size:12px;color:var(--dim);margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.usewrap{margin-top:26px;padding:18px;border-radius:20px;background:linear-gradient(180deg,rgba(168,85,247,.12),rgba(236,72,153,.06));border:1px solid rgba(236,72,153,.3)}
.usewrap .btn{width:100%}
.usewrap .est{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-top:12px;gap:12px}
.dgnote{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:12.5px;line-height:1.45}
.dgnote a{color:#fff;font-weight:800;text-decoration:underline}
.rep{display:flex;align-items:center;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.rep a{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.rep a.lk{color:#fda4af;padding:7px 12px;border-radius:10px;border:1px dashed rgba(251,113,133,.45)}
.tgtbox{display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px;background:rgba(6,4,16,.5);border:1px solid rgba(45,212,191,.35)}
.tgtbox .tt{width:64px;height:82px;border-radius:10px;overflow:hidden;position:relative;flex:none}
.tgtbox b{display:block;font-size:13.5px}.tgtbox small{color:var(--mut);font-size:12px}
.msticky{position:sticky;bottom:0;z-index:30;padding:12px 14px 22px;background:linear-gradient(180deg,transparent,#0a0717 30%);display:flex;gap:10px}
.msticky .btn.pri{flex:1}

/* creator */
.banner{height:230px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.dev-m .banner{height:130px;border-radius:0 0 22px 22px}
.cphead{display:flex;gap:28px;align-items:flex-end;margin-top:-70px;position:relative;z-index:2}
.cphead .bigav{display:inline-flex;border-radius:50%;box-shadow:0 0 0 6px #0a0717}
.cphead .who{flex:1;padding-bottom:6px}
.cphead h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-.8px;display:flex;align-items:baseline;gap:12px}
.cphead h2 small{font-size:17px;color:var(--mut);font-weight:600;letter-spacing:0}
.cphead p{margin:8px 0 0;color:#d6d0f5;font-size:14.5px;max-width:640px}
.cpacts{display:flex;gap:10px;align-items:center;padding-bottom:8px}
.cpacts .vo{font-size:11.5px;color:var(--dim);display:block;text-align:right;margin-top:6px}
.dev-m .cphead{flex-direction:column;align-items:flex-start;gap:12px;margin-top:-46px}
.dev-m .cphead h2{font-size:24px;flex-wrap:wrap;gap:4px 10px}
.dev-m .cphead h2 small{font-size:14px}
.dev-m .cpacts{width:100%}.dev-m .cpacts .btn{flex:1}
.cstats{display:flex;gap:14px;margin:26px 0 34px}
.cstat{flex:1;padding:16px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.cstat b{display:flex;gap:8px;align-items:center;font-size:26px;font-weight:800;letter-spacing:-.5px}
.cstat small{color:var(--mut);font-size:12.5px;font-weight:600}
.cstat.earn{background:linear-gradient(180deg,rgba(251,191,36,.12),rgba(251,191,36,.03));border-color:rgba(251,191,36,.3)}
.cstat.earn b{color:#fcd34d}
.dev-m .cstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 24px}
.dev-m .cstat{padding:12px 14px}.dev-m .cstat b{font-size:20px}
.masonry{columns:5;column-gap:16px}
.dev-m .masonry{columns:2;column-gap:10px}
.masonry .tcard{break-inside:avoid;margin-bottom:18px;display:block}
.masonry .tc-cv{aspect-ratio:auto}
.loadmore{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--mut);font-size:13px;font-weight:600;padding:18px 0 10px}

/* profile */
.prof{display:grid;grid-template-columns:260px minmax(0,1fr);gap:30px;padding-top:30px}
.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:100px;align-self:start;padding:10px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.side a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mut)}
.side a.on{background:linear-gradient(90deg,rgba(236,72,153,.22),rgba(168,85,247,.16));color:#fff;box-shadow:inset 0 0 0 1px rgba(236,72,153,.4)}
.side a .ct{margin-left:auto;font-size:11px;font-weight:800;background:#f43f5e;color:#fff;border-radius:999px;padding:1px 7px}
.dev-m .prof{grid-template-columns:minmax(0,1fr);padding-top:14px;gap:14px}
.mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:-14px}
.mtabs a{padding:9px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.mtabs a.on{background:var(--grad);border-color:transparent;color:#fff}
.phead{display:flex;align-items:center;gap:16px;padding:20px;border-radius:22px;background:linear-gradient(120deg,rgba(168,85,247,.16),rgba(236,72,153,.08) 60%,transparent),var(--panel);border:1px solid rgba(168,85,247,.3)}
.phead .who b{font-size:20px;display:block;letter-spacing:-.3px}
.phead .who small{color:var(--mut);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.phead .who small span{display:flex;gap:5px;align-items:center}
.phead .acts{margin-left:auto;display:flex;gap:8px}
.dev-m .phead{flex-wrap:wrap;padding:16px}
.dev-m .phead .acts{margin:0;width:100%}.dev-m .phead .acts .btn{flex:1}
.fchips{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
.dev-m .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-14px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--dim);padding:13px 16px;background:rgba(255,255,255,.025);border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .cvc{width:58px;height:74px;border-radius:10px;overflow:hidden;position:relative}
.tbl .tt b{display:block;font-size:14px}.tbl .tt small{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.badge.published{background:rgba(52,211,153,.14);color:#6ee7b7}
.badge.review{background:rgba(251,191,36,.14);color:#fcd34d}
.badge.rejected{background:rgba(251,113,133,.14);color:#fda4af}
.badge.down{background:rgba(148,163,184,.16);color:#cbd5e1}
.badge.hidden{background:rgba(251,146,60,.15);color:#fdba74}
.badge.pending{background:rgba(251,191,36,.14);color:#fcd34d}
.badge.approved{background:rgba(52,211,153,.14);color:#6ee7b7}
.reason{font-size:12px;color:var(--mut);margin-top:6px;max-width:300px;line-height:1.4}
.reason.bad{color:#fda4af}
.racts{display:flex;gap:6px;justify-content:flex-end}
.earnv{display:flex;align-items:center;gap:6px;font-weight:800;color:#fcd34d}
.mcard{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.mcard .cvc{width:68px;height:88px;border-radius:11px;overflow:hidden;position:relative;flex:none}
.mcard .bd{flex:1;min-width:0}
.mcard .bd b{display:block;font-size:14px}
.mcard .row2{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;align-items:center;flex-wrap:wrap}
.mcard .racts{justify-content:flex-start;margin-top:10px}
.empty{text-align:center;padding:70px 30px;border-radius:24px;border:1.5px dashed rgba(168,85,247,.35);background:radial-gradient(ellipse at 50% 0%,rgba(168,85,247,.12),transparent 70%)}
.empty h3{font-size:22px;margin:16px 0 8px;letter-spacing:-.4px}
.empty p{color:var(--mut);margin:0 auto 22px;max-width:460px;line-height:1.55}
.empty .steps{display:flex;gap:12px;justify-content:center;margin:0 0 26px;flex-wrap:wrap}
.empty .steps span{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:12.5px;font-weight:600}
.empty .steps i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--grad2);display:grid;place-items:center;font-size:11px;font-weight:800}
.dev-m .empty{padding:40px 18px}
.wallet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:22px}
.dev-m .wallet{grid-template-columns:1fr;gap:10px}
.wcard{padding:20px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.wcard small{color:var(--mut);font-size:12.5px;font-weight:600}
.wcard b{display:flex;gap:10px;align-items:center;font-size:30px;font-weight:800;margin:6px 0 12px;letter-spacing:-.6px}
.wcard.pro{background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(236,72,153,.18));border-color:rgba(192,132,252,.45)}
.amt{font-weight:800;text-align:right;white-space:nowrap}
.amt.p{color:#6ee7b7}.amt.n{color:#fda4af}
.ttype{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.ttype i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal}
.coll{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.dev-m .coll{grid-template-columns:repeat(2,1fr);gap:10px}
.stub{text-align:center;padding:140px 20px}
.stub h2{font-size:34px;margin:18px 0 8px}
.stub p{color:var(--mut);margin:0 0 22px}


/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font:inherit;font-weight:700;font-size:13.5px;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line2);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:var(--grad);border-color:transparent;box-shadow:0 10px 26px -8px rgba(236,72,153,.75)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:10px;gap:6px}
.btn.lg{height:56px;padding:0 28px;font-size:16.5px;border-radius:16px;font-weight:800}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none;filter:grayscale(.3)}
.btn.danger{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.45);color:#fda4af}
.btn.white{background:#fff;color:#1a1033;border-color:#fff}
.loaded .ltx{min-width:0;line-height:1.4}
.loaded .lau{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.dev-m .loaded{border-radius:14px;align-items:flex-start;padding:7px 6px 7px 10px}
.dev-m .hact .sqbtn{display:none}
.dev-m .pubbtn{font-size:11px}

/* overlays & modals */
.ovl{position:absolute;inset:0;z-index:100;background:rgba(5,3,14,.68);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:30px}
.modal{position:relative;width:560px;max-width:100%;max-height:100%;overflow:auto;background:linear-gradient(180deg,#1a1240,#130d2e);border:1px solid rgba(168,85,247,.4);border-radius:26px;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(236,72,153,.08) inset;scrollbar-width:thin;scrollbar-color:#3b2f6b transparent}
.modal.wide{width:1080px}
.modal.mid{width:680px}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px 0}
.mhd h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;gap:10px;align-items:center}
.mbody{padding:18px 26px 6px}
.mft{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px 24px;align-items:center;position:sticky;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(19,13,46,0),#130d2e 26%)}
.mft .lft{margin-right:auto;font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.xbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.mcenter{text-align:center;padding:34px 34px 10px}
.mcenter h3{font-size:24px;margin:18px 0 10px;letter-spacing:-.5px}
.mcenter p{color:var(--mut);margin:0;line-height:1.6;font-size:14.5px}
.bigic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin:0 auto}
.bigic.ok{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(45,212,191,.12));color:#6ee7b7;box-shadow:0 0 0 1px rgba(52,211,153,.35)}
.bigic.bad{background:linear-gradient(135deg,rgba(251,113,133,.25),rgba(244,63,94,.1));color:#fda4af;box-shadow:0 0 0 1px rgba(251,113,133,.4)}
.bigic.pnk{background:var(--grad2);box-shadow:0 14px 40px -8px rgba(236,72,153,.7)}
.bigic.amb{background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(251,146,60,.1));color:#fcd34d;box-shadow:0 0 0 1px rgba(251,191,36,.4)}
.dev-m .ovl{align-items:flex-end;padding:0}
.dev-m .modal{width:100%!important;border-radius:26px 26px 0 0;max-height:94%;border-bottom:0}
.dev-m .modal.full{height:94%}
.dev-m .modal::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:10px auto 0}
.dev-m .mhd{padding:14px 18px 0}.dev-m .mhd h3{font-size:19px}
.dev-m .mbody{padding:14px 18px 4px}
.dev-m .mft{padding:14px 18px 26px;position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#130d2e 30%);flex-wrap:wrap}
.dev-m .mft .btn{flex:1}
.dev-m .mft .lft{width:100%;margin:0 0 4px}
.dev-m .mcenter{padding:24px 20px 6px}
.field{margin-bottom:16px}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);background:rgba(6,4,16,.55);color:#fff;padding:0 14px;font:inherit;font-size:14px;outline:none}
.inp:focus{border-color:rgba(236,72,153,.6);box-shadow:0 0 0 3px rgba(236,72,153,.15)}
textarea.inp{height:auto;padding:12px 14px;resize:none;min-height:84px;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a49dc8 50%),linear-gradient(135deg,#a49dc8 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.inp option{background:#1a1240}
.lbl{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center;color:#e9e5ff}
.lbl .opt2{color:var(--dim);font-weight:600}
.lbl .cnt{margin-left:auto;color:var(--dim);font-weight:600;font-size:11.5px}
.tagbox{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:rgba(6,4,16,.55);padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagbox .tg{display:inline-flex;gap:6px;align-items:center;padding:5px 6px 5px 10px;border-radius:999px;background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.45);font-size:12.5px;font-weight:700}
.tagbox .tg i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-style:normal}
.tagbox input{flex:1;min-width:120px;background:transparent;border:0;outline:none;color:#fff;font:inherit;font-size:13.5px;padding:6px}
.info{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.45}
.info.y{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.32);color:#fde68a}
.info.p{background:rgba(236,72,153,.08);border:1px solid rgba(236,72,153,.32);color:#fbcfe8}
.info.r{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.35);color:#fecdd3}
.info.t{background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.3);color:#99f6e4}
.info.g{background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--mut)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:#e9e5ff;padding:2px 0}
.chk .box{flex:none;width:21px;height:21px;border-radius:7px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;margin-top:1px;background:rgba(6,4,16,.5)}
.chk.on .box{background:var(--grad2);border-color:transparent}
.chk .rq{color:#f9a8d4;font-weight:700}
.authbox{margin-top:12px;padding:16px;border-radius:16px;border:1.5px dashed rgba(45,212,191,.45);background:rgba(13,60,66,.2)}
.authbox h6{margin:0 0 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;color:#99f6e4}
.pubgrid{display:grid;grid-template-columns:340px 1fr;gap:28px}
.dev-m .pubgrid{grid-template-columns:1fr;gap:16px}
.pubprev{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;border:1px solid var(--line2)}
.dev-m .pubprev{aspect-ratio:4/3.6}
.frames{display:flex;gap:8px;margin-top:10px}
.frames a{position:relative;flex:1;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.72}
.frames a.on{border-color:#f472b6;opacity:1;box-shadow:0 0 0 3px rgba(236,72,153,.2)}
.frames a .fl{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;z-index:3;text-shadow:0 1px 3px #000}
.frames a.up{border:1.5px dashed rgba(168,85,247,.5);display:grid;place-items:center;align-content:center;gap:2px;font-size:10.5px;color:var(--mut);opacity:1;background:rgba(255,255,255,.02)}
.stores{border-radius:14px;border:1px solid var(--line2);overflow:hidden;font-size:12.5px}
.stores .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.03);font-weight:700}
.stores .sb{display:grid;grid-template-columns:1fr 1fr;gap:0}
.stores .sb div{padding:12px 14px}
.stores .sb div+div{border-left:1px solid var(--line)}
.stores .sb h6{margin:0 0 8px;font-size:11.5px;color:var(--dim);font-weight:700}
.stores ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.stores li{display:flex;gap:7px;align-items:center;color:#e9e5ff}

function tpl(id, S){ if(!id) return null; if(String(id).startsWith('o-')) return OFFICIAL.find(o=>o.id===id); return (S && S.mine.find(t=>t.id===id)) || BUILT[id] || null; }
function isProTpl(t){ return isProVal(t.q) || t.len==='10s' || t.model==='Spicy Verse Pro'; }
function community(mode, S, sort){

}
function cost(mode, set, sound){
  if(mode==='edit'){ const b = {'Spicy Verse 3.0':8,'Spicy Verse 2.2':6,'Spicy Verse Pro':12}[set.model]; return b*(set.q==='2K'?2:1); }
  if(mode==='fs'){ const b = {'Spicy Verse 3.0':12,'Spicy Verse 2.2':9,'Spicy Verse Pro':18}[set.model]; return Math.round(b*(set.q==='1080p'?1.5:1)); }
  const b = {'Spicy Verse 3.0':15,'Spicy Verse 2.2':10,'Spicy Verse Pro':25}[set.model];
  const m = {'480p':1,'720p':1.4,'1080p':2}[set.q] || 1;
  let v = Math.round(b*m*(set.len==='10s'?2:1)); if(sound && mode==='i2v') v += 5; return v;
}
function tplSet(t){ return {model:t.model||'Spicy Verse 3.0', q:t.q, len:t.len||'5s', ratio:t.ratio||'9:16'}; }
function downgrade(mode, set){
  const out = {...set}, changes = [];
  if(isProVal(set.q)){ const to = mode==='edit' ? '1K' : '720p'; changes.push({k:mode==='edit'?'Resolution':'Quality', from:set.q, to}); out.q = to; }
  if(set.len==='10s' && MODES[mode].video){ changes.push({k:'Length', from:'10s', to:'5s'}); out.len = '5s'; }
  if(set.model==='Spicy Verse Pro'){ changes.push({k:'Model', from:'Spicy Verse Pro', to:'Spicy Verse 3.0'}); out.model = 'Spicy Verse 3.0'; }
  return {set:out, changes};
}

function resetTool(tab){
  const T = S.tool; T.tab = tab; T.loaded = null; T.adjusted = null; T.effect = null; T.need = false; T.prompt = ''; T.page = 1;
  T.up = {photo:[], ref:null, face:null, target:null};

function loadTemplate(id, openModal = true){
  const t = tpl(id,S); if(!t) return;
  S.route = 'aitools'; resetTool(t.mode);
  const T = S.tool; T.loaded = t.id; T.prompt = t.prompt || ''; T.sound = !!t.sound; T.cat = 'community';
  if(t.mode==='i2v') T.up.ref = {name:t.demo||'Ocean Walk', cv:'ocean', fromTpl:true};
  if(t.mode==='edit') T.up.ref = {name:t.demo||'Studio Grey', cv:'studio', fromTpl:true};
  if(t.mode==='fs') T.up.target = {cv:t.cv, fromTpl:true};
  const full = tplSet(t);
  if(!S.pro && isProTpl(t)){
    const d = downgrade(t.mode, full); T.set = d.set; T.adjusted = d.changes;
    if(openModal) S.modal = {type:'downgrade', title:t.title, changes:d.changes};
  } else T.set = full;
}

  const c = cost(mode,T.set,T.sound);

  const id = 'h-'+Date.now(), n = S.hist.length + 1;

    meta: MODES[mode].video ? `${T.set.len} · ${T.set.q}` : T.set.q, status:'generating', p:4, src: T.loaded || T.effect || null};
  S.hist.unshift(item);
  S.ledger.unshift({d:item.time, type:'spend', t:'Generation · '+MODES[mode].label, s:`${T.set.model} · ${item.meta}`, a:-c});
  if(T.loaded){ const t = tpl(T.loaded,S); if(t && t.author!=='me') t.uses += 1; }
  toast(`Generating · ${c} coins`, 'sparkles');
  const timer = setInterval(()=>{ item.p = Math.min(100, item.p + 19); if(item.p>=100){ item.status = 'done'; clearInterval(timer); S.coll.unshift({...item}); toast(`${item.title} is ready. You can publish it as a template.`); } render(); }, 650);
  genTimers.push(timer);
}

/* ===== Publish flow ===== */
function findCreation(id){ return S.hist.find(h=>h.id===id) || S.coll.find(h=>h.id===id); }
function startPublish(hid){
  if(!S.user.ready){ S.modal = {type:'setup', step:1, email:'', sent:false, nick:S.user.nick, handle:'ruby.makes', av:S.user.av, then:hid}; return; }
  const h = findCreation(hid); if(!h) return;
  const src = h.src ? tpl(h.src,S) : null;
  S.modal = {type:'publish', hid, mode:h.mode, cv:h.cv, meta:h.meta, src:h.src, title: src ? src.title : '', cat: src ? (src.cat||'Cinematic') : 'Cinematic',
    tags: src ? (src.tags || [src.title.split(' ')[0], (src.cat||'').replace(/ & /,'')]).filter(Boolean).slice(0,5) : [], desc:'', prompt: src && src.prompt ? src.prompt : 'A cinematic shot with soft light and a gentle push-in, shallow depth of field.',
    cover:0, auth:false, authFs:false};
}
function submitPublish(){
  const M = S.modal; if(!pubValid(M)) return;
  const finish = (status, extra = {}) => {
    let t;
    if(M.resubmit){ t = S.mine.find(x=>x.id===M.tid); Object.assign(t,{title:M.title.trim(), cat:M.cat, tags:[...M.tags], desc:M.desc||t.desc, status, date:'2026-10-27'}, extra); delete t.reason; if(extra.reason) t.reason = extra.reason; }
    else {
      t = {id:'t-'+(3000+S.mine.length), title:M.title.trim(), mode:M.mode, cv:M.cv, status, uses:0, likes:0, earn:0, date:'2026-10-27', q:(M.meta.split(' · ').pop()), len:MODES[M.mode].video?M.meta.split(' · ')[0]:null,
        cat:M.cat, tags:[...M.tags], author:'me', model:'Spicy Verse 3.0', ratio:M.mode==='edit'?null:'9:16', sound:false, desc:M.desc||'Fresh from AI Tools.', prompt:M.mode==='fs'?'':M.prompt, demo:null, badge:'', ...extra};
      S.mine.unshift(t);
      const h = findCreation(M.hid); if(h){ h.status = status==='review'?'review':'rejected'; h.tid = t.id; }
    }
    return t;
  };
  if(M.mode==='fs'){
    S.modal = {type:'detect'};
    setTimeout(()=>{
      if(S.sim.detectHit){ finish('rejected',{reason:'Flagged by Face Swap check: suspected public figure', note:'Public figure likeness detected in the target image.'}); S.notifs.unshift({id:'n'+Date.now(),kind:'bad',tid:null,text:`“${M.title}” was rejected automatically: suspected public figure.`,time:'Just now',unread:true}); S.modal = {type:'detectFail'}; }
      else { finish('review'); S.modal = {type:'submitted', title:M.title}; }
      render();
    }, 1900);
    return;
  }
  finish('review'); S.modal = {type:'submitted', title:M.title};
}

/* ===== Admin actions ===== */
function adminItem(){ const list = adminQueue(S, S.adm.tab).filter(q=>S.adm.mode==='all'||q.mode===S.adm.mode); return list.find(x=>x.id===S.adm.sel) || list[0]; }
function adminDecide(ok){
  const A = S.adm, x = adminItem(); if(!x || x.status!=='pending') return;
  if(!ok && !A.reason){ A.dd = true; return toast('Pick a rejection reason first','alert'); }
  if(x.mine){
    const t = S.mine.find(m=>m.id===x.id);
    if(ok){ t.status = 'published'; t.date = '2026-10-27'; S.notifs.unshift({id:'n'+Date.now(),kind:'ok',tid:t.id,text:`“${t.title}” is live in Community.`,time:'Just now',unread:true}); }
    else { t.status = 'rejected'; t.reason = A.reason; t.note = A.notes || ''; S.notifs.unshift({id:'n'+Date.now(),kind:'bad',tid:t.id,text:`“${t.title}” wasn’t approved: ${A.reason.toLowerCase()}.`,time:'Just now',unread:true}); }
  } else { const q = S.queue.find(q=>q.id===x.id); q.status = ok?'approved':'rejected'; if(!ok) q.reason = A.reason; }
  toast(ok ? `Approved “${x.title}”. It’s live in Community.` : `Rejected “${x.title}”. Creator notified with the reason.`, ok?'check':'x');
  A.reason = ''; A.notes = ''; A.dd = false;
  const next = adminQueue(S,'pending')[0]; A.sel = next ? next.id : null;
}

function onClick(e){
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a; if(a==='noop'){ return; }
  if(el.tagName==='A' || el.tagName==='BUTTON') e.preventDefault();
  if(el.hasAttribute('disabled')) return;
  const fn = ACT[a]; if(!fn) return;
  fn(el.dataset.v || '', el);
  if(!['go','card','use','creator','anav','asel'].includes(a)) render();
}
function setPath(path, val){ const parts = path.split('.'); let o = parts[0]==='modal' ? S.modal : parts[0]==='adm' ? S.adm : S.tool; if(parts[0]==='prompt'){ S.tool.prompt = val; return; } o[parts[1]] = val; }
function onInput(e){
  const el = e.target;
  if(el.dataset.in){
    setPath(el.dataset.in, el.value);
    document.querySelectorAll(`[data-count="${el.dataset.in}"]`).forEach(c=>{ const max = el.getAttribute('maxlength'); c.textContent = `${el.value.length} / ${max}`; });
    if(S.modal && S.modal.type==='publish') document.querySelectorAll('.js-submit').forEach(b=>{ b.disabled = !pubValid(S.modal); });
    if(el.tagName==='SELECT') render();
  }
}
function onKey(e){
  const el = e.target;
  if(el.dataset && el.dataset.tag && e.key==='Enter'){ e.preventDefault(); const v = el.value.trim().replace(/^#/,'').replace(/\s+/g,''); if(v && S.modal.tags.length<5 && !S.modal.tags.includes(v)) S.modal.tags.push(v); render(); setTimeout(()=>{ const i = document.querySelector('#pd [data-tag]') ; if(i && el.closest('#pd')) i.focus(); else { const j = document.querySelector('#pm [data-tag]'); if(j) j.focus(); } },0); }
  if(el.dataset && el.dataset.in==='prompt' && e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); generate(); render(); }
}
document.addEventListener('keydown', e=>{
  if(VIEW!=='proto') return;
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'');
  if(e.key==='Escape' && (S.modal||S.pop)){ S.modal = null; S.pop = null; render(); }
  if(!typing && S.route==='admin' && S.adm.nav==='review'){ if(e.key==='a'||e.key==='A'){ adminDecide(true); render(); } if(e.key==='r'||e.key==='R'){ adminDecide(false); render(); } }
});
function bindScroll(){
  ['pd','pm'].forEach(id=>{ const sc = document.querySelector('#'+id+' .scroller'); if(!sc || sc._b) return; sc._b = true;
    sc.addEventListener('scroll', ()=>{ if(S.route!=='creator') return; const {list} = creatorData(S,S.cid); if(S.cshow >= list.length) return;
      if(sc.scrollTop + sc.clientHeight > sc.scrollHeight - 200){ S.cshow += 5; render(); } }, {passive:true}); });
}

  {t:'Likeness removal request', h:true, notes:[['i','Submitting auto-hides the template and sends it to manual recheck.']], f:s=>{ s.route='template'; s.tid='t-1081'; s.modal={type:'likeness',tid:'t-1081',title:'Red Carpet Swap',name:'Jordan Morales',email:'j.morales@mail.com',rel:'me',ok:true}; }},

function loadTemplateInto(s, id, modal){ const keep = S; S = s; loadTemplate(id, !!modal); S = keep; }
function startPublishInto(s, hid){ const keep = S; S = s; startPublish(hid); S = keep; }
function boardState(f){ const s = freshState(); f(s); return s; }

function renderBoard(){
  CTX.board = true;
  let html = `<div class="b-head"><div><h1>Spicy Lab · UGC Community Templates</h1><p>AI Tools redesign spec v1.4.1 applied to Spicy Lab. Every screen at desktop 1920 px with its mobile 390 px version beside it. Use “Open in prototype” on any screen to click through it live.</p></div>
    <div class="b-legend"><span><span class="mk">1</span>Spec markers ①–④ from Part 4</span><span><span class="mk">i</span>Notes for design / dev</span></div></div>`;
  let n = 0;
  BOARD.forEach((sec, si)=>{
    html += `<div class="b-label">${esc(sec.label)}</div>`;
    sec.pairs.forEach((p, pi)=>{
      n++;
      const st = boardState(p.f);
      html += `<div class="b-pair"><div class="b-pair-h"><div><h3>${si+1}.${pi+1} · ${esc(p.t)}</h3><div class="b-notes">${p.notes.map(([k,t])=>`<div class="b-note"><span class="mk">${k}</span><span>${esc(t)}</span></div>`).join('')}</div></div>
        <button class="b-open" data-open="${si}:${pi}">▶ Open in prototype</button></div>
        <div class="b-row"><div><div class="b-cap">Desktop · 1920 <code>${esc(routeOf(st))}</code></div>${frameHTML(st,'d',p.h?1080:null)}</div>
        <div><div class="b-cap">Mobile · 390</div>${frameHTML(st,'m',p.h?844:null)}</div></div></div>`;
    });
  });
  document.getElementById('board').innerHTML = html;
  // scroll anchored modal backgrounds
  let idx = 0;
  BOARD.forEach(sec=>sec.pairs.forEach(p=>{ if(p.anchor){ document.querySelectorAll(`.b-pair`)[idx].querySelectorAll('.frame.fixed').forEach(fr=>{ const sc = fr.querySelector('.scroller'), a = sc.querySelector(p.anchor); if(a) sc.scrollTop = Math.max(0, a.offsetTop - 160); }); } idx++; }));
  CTX.board = false;
}

/* ===== Toolbar & view ===== */
function applyZoom(){
  if(VIEW==='board'){ const b = document.getElementById('board'); const z = ZOOM==='fit' ? Math.min(1,(window.innerWidth-8)/2560) : +ZOOM; b.style.zoom = z; }
  else { const st = document.getElementById('stage'); const w = DEV==='both' ? 1920+390+60+40 : DEV==='d' ? 1920+40 : 390+40;
    const z = ZOOM==='fit' ? Math.min(1,(window.innerWidth-40)/w) : +ZOOM; st.style.zoom = z; }
}
function setView(v){
  VIEW = v; document.body.classList.toggle('mode-board', v==='board'); document.body.classList.toggle('mode-proto', v==='proto');
  document.getElementById('boardView').hidden = v!=='board'; document.getElementById('protoView').hidden = v!=='proto';
  if(v==='proto') render(true); syncToolbar(); applyZoom(); window.scrollTo(0,0);
}
function syncToolbar(){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on', b.dataset.view===VIEW));
  document.querySelectorAll('[data-dev]').forEach(b=>b.classList.toggle('on', b.dataset.dev===DEV));
  document.querySelectorAll('[data-zoom]').forEach(b=>b.classList.toggle('on', b.dataset.zoom===ZOOM));
  document.querySelectorAll('[data-app]').forEach(b=>b.classList.toggle('on', (b.dataset.app==='admin')===(S.route==='admin')));
  const t = (id,on)=>document.getElementById(id).classList.toggle('on',on);
  t('tgPro',S.pro); t('tgNew',!S.user.ready); t('tgHit',S.sim.detectHit);
  document.body.classList.toggle('dev-only-d', DEV==='d'); document.body.classList.toggle('dev-only-m', DEV==='m');
}
function openFromBoard(si, pi){ genTimers.forEach(clearInterval); S = boardState(BOARD[si].pairs[pi].f); setView('proto'); }
function buildJump(){
  const sel = document.getElementById('jump');
  sel.innerHTML = `<option value="">Jump to screen…</option>` + BOARD.map((s,si)=>`<optgroup label="${esc(s.label)}">${s.pairs.map((p,pi)=>`<option value="${si}:${pi}">${si+1}.${pi+1} ${esc(p.t)}</option>`).join('')}</optgroup>`).join('');
  sel.addEventListener('change', ()=>{ if(sel.value){ const [a,b] = sel.value.split(':'); openFromBoard(+a,+b); sel.value=''; } });
}
function initToolbar(){
  document.getElementById('tb').addEventListener('click', e=>{
    const b = e.target.closest('button,[data-tg]'); if(!b) return;
    if(b.dataset.view) setView(b.dataset.view);
    if(b.dataset.dev){ DEV = b.dataset.dev; syncToolbar(); applyZoom(); }
    if(b.dataset.zoom){ ZOOM = b.dataset.zoom; syncToolbar(); applyZoom(); }
    if(b.dataset.app){ S.modal = null; S.pop = null; if(b.dataset.app==='admin'){ S.route = 'admin'; } else S.route = 'aitools'; render(true); syncToolbar(); }
    if(b.dataset.tg==='pro'){ S.pro = !S.pro; render(); syncToolbar(); }
    if(b.dataset.tg==='new'){ if(S.user.ready){ S.user.ready = false; S.mine = []; S.hist.forEach(h=>{ if(['review','published','rejected'].includes(h.status)){ h.status='done'; delete h.tid; } }); } else { const f = freshState(); S.user = f.user; S.mine = f.mine; S.hist = f.hist; } render(); syncToolbar(); }
    if(b.dataset.tg==='hit'){ S.sim.detectHit = !S.sim.detectHit; syncToolbar(); }
    if(b.id==='reset'){ genTimers.forEach(clearInterval); S = freshState(); render(true); syncToolbar(); }
  });
  document.getElementById('board').addEventListener('click', e=>{ const b = e.target.closest('[data-open]'); if(b){ const [a,c] = b.dataset.open.split(':'); openFromBoard(+a,+c); } });
  const stage = document.getElementById('stage');
  stage.addEventListener('click', onClick); stage.addEventListener('input', onInput); stage.addEventListener('change', onInput); stage.addEventListener('keydown', onKey);
  window.addEventListener('resize', applyZoom);
}
initToolbar(); buildJump(); renderBoard(); setView('board');
</script>
